// A protobuf-based API for communication between
// the Warp client and the remote server binary.
//
// Messages are length-prefixed: [4-byte little-endian length][protobuf bytes].

syntax = "proto3";

package remote_server;

// ── Top-level envelopes ───────────────────────────────────────────

// Top-level envelope for all client → server messages.
message ClientMessage {
  string request_id = 1;
  oneof message {
    Initialize initialize = 2;
    Abort abort = 3;
    NavigatedToDirectory navigated_to_directory = 4;
    LoadRepoMetadataDirectory load_repo_metadata_directory = 5;
    SessionBootstrapped session_bootstrapped = 6;
    WriteFile write_file = 7;
    DeleteFile delete_file = 8;
    RunCommandRequest run_command = 9;
    ReadFileContextRequest read_file_context = 10;
    Authenticate authenticate = 11;
    OpenBuffer open_buffer = 13;
    BufferEdit buffer_edit = 14;
    CloseBuffer close_buffer = 15;
    SaveBuffer save_buffer = 16;
    ResolveConflict resolve_conflict = 17;
    ListDirectory list_directory = 18;
    ResolvePath resolve_path = 19;
    CreateDirectory create_directory = 20;
    ReadFileChunk read_file_chunk = 21;
    WriteFileChunk write_file_chunk = 22;
    CreatePty create_pty = 23;
    WritePty write_pty = 24;
    ResizePty resize_pty = 25;
    ClosePty close_pty = 26;
    ScanCliAgentSessions scan_cli_agent_sessions = 27;
    ReadCliAgentSession read_cli_agent_session = 28;
    MutateCliAgentSession mutate_cli_agent_session = 29;
    ExactRename exact_rename = 30;
    GetCliAgentSessionUserState get_cli_agent_session_user_state = 31;
    MutateCliAgentSessionUserState mutate_cli_agent_session_user_state = 32;
    DeleteDirectory delete_directory = 33;
    AppendFile append_file = 34;
    BeginFileTransfer begin_file_transfer = 35;
    FinishFileTransfer finish_file_transfer = 36;
    AbortFileTransfer abort_file_transfer = 37;
    PromoteFiles promote_files = 38;
    SessionExecutionContextDeregistered session_execution_context_deregistered = 39;
  }
}
// Top-level envelope for all server → client messages.
// Push messages use an empty request_id to distinguish them from
// request/response pairs.
message ServerMessage {
  string request_id = 1;
  oneof message {
    InitializeResponse initialize_response = 2;
    ErrorResponse error = 3;
    NavigatedToDirectoryResponse navigated_to_directory_response = 4;
    RepoMetadataSnapshot repo_metadata_snapshot = 5;
    RepoMetadataUpdatePush repo_metadata_update = 6;
    LoadRepoMetadataDirectoryResponse load_repo_metadata_directory_response = 7;
    WriteFileResponse write_file_response = 8;
    DeleteFileResponse delete_file_response = 9;
    RunCommandResponse run_command_response = 10;
    ReadFileContextResponse read_file_context_response = 11;
    OpenBufferResponse open_buffer_response = 14;
    BufferUpdatedPush buffer_updated = 15;
    SaveBufferResponse save_buffer_response = 16;
    ResolveConflictResponse resolve_conflict_response = 17;
    ListDirectoryResponse list_directory_response = 18;
    ResolvePathResponse resolve_path_response = 19;
    CreateDirectoryResponse create_directory_response = 20;
    ReadFileChunkResponse read_file_chunk_response = 21;
    WriteFileChunkResponse write_file_chunk_response = 22;
    CreatePtyResponse create_pty_response = 23;
    PtyOutputPush pty_output = 24;
    PtyExitedPush pty_exited = 25;
    ScanCliAgentSessionsResponse scan_cli_agent_sessions_response = 26;
    ReadCliAgentSessionResponse read_cli_agent_session_response = 27;
    MutateCliAgentSessionResponse mutate_cli_agent_session_response = 28;
    ExactRenameResponse exact_rename_response = 29;
    GetCliAgentSessionUserStateResponse get_cli_agent_session_user_state_response = 30;
    MutateCliAgentSessionUserStateResponse mutate_cli_agent_session_user_state_response = 31;
    DeleteDirectoryResponse delete_directory_response = 32;
    AppendFileResponse append_file_response = 33;
    BeginFileTransferResponse begin_file_transfer_response = 34;
    FinishFileTransferResponse finish_file_transfer_response = 35;
    AbortFileTransferResponse abort_file_transfer_response = 36;
    PromoteFilesResponse promote_files_response = 37;
  }
}

// ── Initialize handshake

// Sent by the client immediately after connecting to negotiate the protocol.
message Initialize {
  // Optional bearer token used by the daemon for Warp-server requests.
  // Empty means no credential was available and does not clear an existing
  // daemon credential.
  string auth_token = 1;
  // Exact wire/semantic protocol revision expected by this client.
  uint32 protocol_revision = 2;
}

// Sent by the client when its bearer credential rotates after initialization.
// This is a notification (fire-and-forget) — the server does not send a response.
message Authenticate {
  // Optional bearer token used by the daemon for Warp-server requests.
  // Empty means no credential was available and does not clear an existing
  // daemon credential.
  string auth_token = 1;
}

// Sent by the client to cancel an in-progress request.
// This is a notification (fire-and-forget) — the server does not send a response.
message Abort {
  string request_id_to_abort = 1;
}

// Returned by the server in response to Initialize.
message InitializeResponse {
  string server_version = 1;
  string host_id = 2;
  // Exact wire/semantic protocol revision implemented by this helper.
  uint32 protocol_revision = 3;
}

// Sent by the client after the SSH session has been bootstrapped.
// This is a notification (fire-and-forget) — the server does not send a
// response. The server uses this to create a per-session
// LocalCommandExecutor matching the bootstrapped shell.
message SessionBootstrapped {
  uint64 session_id = 1;
  string shell_type = 2;
  // The full path to the shell binary (e.g. "/usr/bin/zsh").
  // When present, the server uses this directly instead of doing a PATH lookup.
  optional string shell_path = 3;
  // Physical working directory captured after the target shell loaded user config.
  optional string working_directory = 4;
  // Target-session values for authoritative command environment variables.
  // The helper must remove its daemon values for the authoritative names before
  // applying this map; omission means unset in the target session.
  map<string, string> environment_variables = 5;
}

// Sent when a terminal alias is closed while its Environment transport stays
// connected. The helper must immediately remove the exact session executor;
// reconnect replay remains owned by the manager registry.
message SessionExecutionContextDeregistered {
  uint64 session_id = 1;
}

// Sent by the client to execute a shell command on the remote host.
message RunCommandRequest {
  string command = 1;
  // Working directory for the command. If empty, uses the server's default.
  optional string working_directory = 2;
  // Environment variables to set for the command.
  map<string, string> environment_variables = 3;
  // The session whose shell executor should run this command.
  uint64 session_id = 4;
}

// Specific error codes for RunCommandRequest failures.
enum RunCommandErrorCode {
  RUN_COMMAND_ERROR_CODE_UNSPECIFIED = 0;
  // The session ID has no associated executor (session was never bootstrapped).
  SESSION_NOT_FOUND = 1;
  // The command could not be executed (e.g. the shell process failed to spawn).
  EXECUTION_FAILED = 2;
}

message RunCommandError {
  RunCommandErrorCode code = 1;
  string message = 2;
}

message RunCommandSuccess {
  bytes stdout = 1;
  bytes stderr = 2;
  // Absent when the process was killed by a signal (Unix).
  optional int32 exit_code = 3;
}

// Returned by the server with the result of a RunCommandRequest.
message RunCommandResponse {
  oneof result {
    RunCommandSuccess success = 1;
    RunCommandError error = 2;
  }
}


// ── Native remote PTY ─────────────────────────────────────────────

// Client → server: create a persistent PTY on the remote host.
message CreatePty {
  string working_directory = 1;
  string shell = 2;
  uint32 rows = 3;
  uint32 cols = 4;
  map<string, string> environment_variables = 5;
}

message CreatePtyResponse {
  oneof result {
    CreatePtySuccess success = 1;
    CreatePtyError error = 2;
  }
}

message CreatePtySuccess {
  uint64 pty_id = 1;
  string shell_type = 2;
}

message CreatePtyError {
  string message = 1;
}

// Client → server: write raw input bytes to an existing PTY.
message WritePty {
  uint64 pty_id = 1;
  bytes bytes = 2;
}

// Client → server: resize an existing PTY.
message ResizePty {
  uint64 pty_id = 1;
  uint32 rows = 2;
  uint32 cols = 3;
  uint32 width_px = 4;
  uint32 height_px = 5;
}

// Client → server: close and reap an existing PTY.
message ClosePty {
  uint64 pty_id = 1;
}

// Server → client push: raw output bytes from a PTY.
message PtyOutputPush {
  uint64 pty_id = 1;
  bytes bytes = 2;
}

// Server → client push: a PTY exited or was closed.
message PtyExitedPush {
  uint64 pty_id = 1;
  optional int32 exit_code = 2;
}

// ── Shared error response ─────────────────────────────────────────

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The request was malformed (e.g. missing oneof variant).
  INVALID_REQUEST = 1;
  // An unexpected server-side failure.
  INTERNAL = 2;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

// ── Shared repo metadata sub-messages ─────────────────────────────
// Mirror the Rust types in repo_metadata/src/file_tree_update.rs.

// Mirrors RepoNodeMetadata in Rust.
message RepoNodeMetadata {
  oneof node {
    DirectoryNodeMetadata directory = 1;
    FileNodeMetadata file = 2;
    SymlinkNodeMetadata symlink = 3;
  }
}

// Mirrors DirectoryNodeMetadata in Rust.
message DirectoryNodeMetadata {
  string path = 1;
  bool ignored = 2;
  bool loaded = 3;
}

// Mirrors FileNodeMetadata in Rust.
message FileNodeMetadata {
  string path = 1;
  optional string extension = 2;
  bool ignored = 3;
}

// Mirrors SymlinkNodeMetadata in Rust. `path` is the lexical link path;
// target_kind describes navigation capability without replacing link identity.
message SymlinkNodeMetadata {
  string path = 1;
  FileSystemEntryKind target_kind = 2;
  bool ignored = 3;
  bool loaded = 4;
}

// Mirrors FileTreeEntryUpdate in Rust. Describes a subtree patch rooted
// at a parent directory.
message RepoMetadataEntryUpdate {
  string parent_path_to_replace = 1;
  repeated RepoNodeMetadata subtree_metadata = 2;
}

// ── NavigatedToDirectory ──────────────────────────────────────────

// Client → server: "I navigated to this directory, please index it."
message NavigatedToDirectory {
  string path = 1;
}

// Response after the server has run git detection on the requested path.
// When is_git is true, indexed_path is the git repo root and full indexing
// runs in the background. A RepoMetadataSnapshot push will follow.
// When is_git is false, the directory was lazily indexed at first level.
// A RepoMetadataSnapshot push with the lazy tree data will follow.
message NavigatedToDirectoryResponse {
  string indexed_path = 1;
  bool is_git = 2;
}

// ── LoadRepoMetadataDirectory ─────────────────────────────────────

// Client → server: load the next level of a subdirectory within an
// already-tracked repo (lazy expand).
message LoadRepoMetadataDirectory {
  string repo_path = 1;
  string dir_path = 2;
}

// Response with the loaded subtree entries for the requested directory.
message LoadRepoMetadataDirectoryResponse {
  string repo_path = 1;
  string dir_path = 2;
  repeated RepoMetadataEntryUpdate entries = 3;
}

// ── File write/delete operations ──────────────────────────────────

// Shared error type for file operations (read/write/delete).
message FileOperationError {
  string message = 1;
}

// Client → server: write content to a file, creating parent dirs if needed.
message WriteFile {
  string path = 1;
  string content = 2;
}

// Server → client: result of a WriteFile request.
message WriteFileResponse {
  oneof result {
    WriteFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

message WriteFileSuccess {}

// Client → server: delete a file.
message DeleteFile {
  string path = 1;
}

// Server → client: result of a DeleteFile request.
message DeleteFileResponse {
  oneof result {
    DeleteFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

message DeleteFileSuccess {}

// Identity captured by ListDirectory for a lexical directory entry. The
// helper revalidates this identity before recursively deleting through a
// pinned directory descriptor.
message DeleteDirectoryIdentity {
  uint64 device = 1;
  uint64 inode = 2;
}

// Client → server: recursively delete exactly the selected directory inode.
message DeleteDirectory {
  string path = 1;
  DeleteDirectoryIdentity identity = 2;
}

// Server → client: result of a DeleteDirectory request.
message DeleteDirectoryResponse {
  oneof result {
    DeleteDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

message DeleteDirectorySuccess {}

// Client → server: rename to exactly `to_path`. Existing destinations are a
// typed conflict and are never interpreted as directories to move inside.
message ExactRename {
  string from_path = 1;
  string to_path = 2;
}

message ExactRenameSuccess {
  string committed_path = 1;
}

message ExactRenameConflict {
  string requested_path = 1;
}

message ExactRenameResponse {
  oneof result {
    ExactRenameSuccess success = 1;
    FileOperationError error = 2;
    ExactRenameConflict conflict = 3;
  }
}

// Owning-host append: one O_APPEND write on the helper host. This must never
// be implemented as client-side read/modify/truncate.
message AppendFile {
  string path = 1;
  bytes bytes = 2;
}

message AppendFileSuccess {
  uint64 file_size = 1;
}

message AppendFileResponse {
  oneof result {
    AppendFileSuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── Read file context (batch) ─────────────────────────────────────

// A single file to read, with optional line ranges.
message ReadFileContextFile {
  string path = 1;
  // 1-indexed line ranges (start..end). Empty = read entire file.
  repeated LineRange line_ranges = 2;
}

message LineRange {
  uint32 start = 1;
  uint32 end = 2;
}

// Client → server: batch read multiple files with full context.
message ReadFileContextRequest {
  repeated ReadFileContextFile files = 1;
  // Per-file byte limit. Absent = use server default.
  optional uint32 max_file_bytes = 2;
  // Cumulative byte budget across all files. Absent = no batch limit.
  optional uint32 max_batch_bytes = 3;
}

// Server → client: result of a ReadFileContextRequest.
// Per-file failures are reported in `failed_files`, not as a top-level error.
// Catastrophic server errors (malformed request, etc.) use the generic ErrorResponse.
message ReadFileContextResponse {
  repeated FileContextProto file_contexts = 1;
  repeated FailedFileRead failed_files = 2;
}

message FailedFileRead {
  string path = 1;
  FileOperationError error = 2;
}

message FileContextProto {
  string file_name = 1;
  oneof content {
    string text_content = 2;
    bytes binary_content = 3;
  }
  // Optional 1-indexed line range this segment covers.
  optional uint32 line_range_start = 4;
  optional uint32 line_range_end = 5;
  optional uint64 last_modified_epoch_millis = 6;
  uint32 line_count = 7;
}

// ── Server → client push messages ─────────────────────────────────

// Full or lazy-loaded repo metadata snapshot. Pushed by the server after
// NavigatedToDirectory completes indexing (either lazy or full git).
message RepoMetadataSnapshot {
  string repo_path = 1;
  repeated RepoMetadataEntryUpdate entries = 2;
  bool sync_complete = 3;
}

// Incremental repo metadata update. Mirrors RepoMetadataUpdate in Rust.
message RepoMetadataUpdatePush {
  string repo_path = 1;
  repeated string remove_entries = 2;
  repeated RepoMetadataEntryUpdate update_entries = 3;
}

// ── Buffer syncing ────────────────────────────────────────────────

// Client → server: open a buffer for bidirectional syncing.
// The server reads the file, starts watching it, and returns the content.
message OpenBuffer {
  string path = 1;
}

// Server → client: response to OpenBuffer with the initial file content.
message OpenBufferResponse {
  string content = 1;
  uint64 server_version = 2;
}

// Client → server: push an incremental edit (fire-and-forget notification).
// If the server accepts (expected_server_version matches its local version),
// it applies the edit silently — no response needed since the client already
// has the edit applied locally.
// If the server rejects (version mismatch), the edit is silently dropped;
// the client discovers the divergence on the next file-watcher
// BufferUpdatedPush that carries the server's current state. (The earlier
// "server pushes BufferUpdatedPush on reject" wording did not match the
// implementation and has been removed.)
//
// A canonical buffer has exactly one writable connection owner. A second
// connection attempting to open the same path is rejected; edit/save/resolve/close
// from a non-owner connection are ignored or rejected. This keeps the single
// SyncClock.client_version and transport ownership atomic.
message BufferEdit {
  string path = 1;
  uint64 expected_server_version = 2;
  uint64 new_client_version = 3;
  repeated TextEdit edits = 4;
}

// A single text edit within a buffer, using 1-indexed character offsets (matching CharOffset).
message TextEdit {
  uint64 start_offset = 1;
  uint64 end_offset = 2;
  string text = 3;
}

// Server → client push: file changed on disk.
// The client uses expected_client_version to detect conflicts.
// Carries only incremental edits — full content is served by OpenBufferResponse.
message BufferUpdatedPush {
  string path = 1;
  uint64 new_server_version = 2;
  uint64 expected_client_version = 3;
  repeated TextEdit edits = 4;
}

// Client → server: close a buffer (stop watching).
message CloseBuffer {
  string path = 1;
}

// Client → server: persist the current in-memory buffer to disk.
message SaveBuffer {
  string path = 1;
}

// Server → client: result of a SaveBuffer request.
message SaveBufferResponse {
  oneof result {
    SaveBufferSuccess success = 1;
    FileOperationError error = 2;
  }
}

message SaveBufferSuccess {}

// Client → server: resolve a conflict by accepting the client's content.
// The server stages client_content and the proposed clock, then persists the
// staged content. Only a matching successful save atomically publishes the
// staged buffer/clock/base state; failure discards staging and preserves the
// last committed canonical state. For "accept server", the client re-sends
// OpenBuffer instead.
message ResolveConflict {
  string path = 1;
  uint64 acknowledged_server_version = 2;
  string client_content = 3;
  uint64 current_client_version = 4;
}

// Server → client: result of a ResolveConflict request.
message ResolveConflictResponse {
  oneof result {
    ResolveConflictSuccess success = 1;
    FileOperationError error = 2;
  }
}

message ResolveConflictSuccess {}

// ── ListDirectory ─────────────────────────────────────────────────
// Ashide:终端文件链接的远端精确校验。客户端在远端 SSH 会话里
// Ctrl/Cmd+点击文件路径时,需要知道某个 cwd 下的真实目录项,
// 才能从 `ls -l` 这类整行输出里准确切出文件名(本地会话靠
// `fs::metadata` 存在性校验做这件事,远端文件不在本地磁盘上)。

// Client → server: list the immediate entries of a directory.
message ListDirectory {
  string path = 1;
}

enum FileSystemEntryKind {
  FILE_SYSTEM_ENTRY_KIND_UNSPECIFIED = 0;
  FILE = 1;
  DIRECTORY = 2;
  SYMLINK = 3;
  OTHER = 4;
  MISSING = 5;
}

// A single directory entry returned by ListDirectory.
message DirEntry {
  string name = 1;
  bool is_dir = 2;
  FileSystemEntryKind kind = 3;
  optional uint64 size_bytes = 4;
  optional uint64 modified_epoch_millis = 5;
  // For symlink entries, the kind of the resolved target (FILE / DIRECTORY /
  // MISSING / OTHER). UNSPECIFIED for non-symlink entries.
  FileSystemEntryKind target_kind = 6;
  optional DeleteDirectoryIdentity directory_identity = 7;
  bool platform_hidden = 8;
  bool ignored = 9;
}

// Server → client: the entries contained directly in the requested directory.
message ListDirectorySuccess {
  repeated DirEntry entries = 1;
  // 展开后的请求路径，但不跟随末级符号链接；这是文件浏览器拼接子项的身份路径。
  string path = 2;
}

// Server → client: result of a ListDirectory request.
message ListDirectoryResponse {
  oneof result {
    ListDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── Server file browser operations ────────────────────────────────

message ResolvePath {
  string path = 1;
}

message ResolvePathSuccess {
  // 展开后的请求路径，但不跟随末级符号链接。
  string path = 1;
  FileSystemEntryKind kind = 2;
  optional uint64 size_bytes = 3;
  // For symlink entries, the kind of the resolved target.
  FileSystemEntryKind target_kind = 4;
  // 解析成功时的规范目标路径；悬空链接为缺省。
  optional string resolved_path = 5;
}

message ResolvePathNotFound {}

message ResolvePathResponse {
  oneof result {
    ResolvePathSuccess success = 1;
    FileOperationError error = 2;
    ResolvePathNotFound not_found = 3;
  }
}

message CreateDirectory {
  string path = 1;
}

// Creation is an acknowledgement only. The caller already owns the lexical
// path identity; returning a canonical target here would let UI state escape a
// symlink namespace after a successful create.
message CreateDirectorySuccess {}

message CreateDirectoryResponse {
  oneof result {
    CreateDirectorySuccess success = 1;
    FileOperationError error = 2;
  }
}

message FileTransferHandle {
  string id = 1;
}

enum FileTransferDirection {
  FILE_TRANSFER_DIRECTION_UNSPECIFIED = 0;
  FILE_TRANSFER_DIRECTION_READ = 1;
  FILE_TRANSFER_DIRECTION_WRITE = 2;
}

message BeginFileTransfer {
  string path = 1;
  FileTransferDirection direction = 2;
  optional bool executable = 3;
}

message BeginFileTransferSuccess {
  FileTransferHandle handle = 1;
  optional uint64 total_size = 2;
}

message BeginFileTransferResponse {
  oneof result {
    BeginFileTransferSuccess success = 1;
    FileOperationError error = 2;
  }
}

message ReadFileChunk {
  FileTransferHandle handle = 1;
  uint64 max_bytes = 2;
}

message ReadFileChunkSuccess {
  bytes bytes = 1;
  uint64 next_offset = 2;
  optional uint64 total_size = 3;
  bool eof = 4;
}

message ReadFileChunkResponse {
  oneof result {
    ReadFileChunkSuccess success = 1;
    FileOperationError error = 2;
  }
}

message WriteFileChunk {
  FileTransferHandle handle = 1;
  bytes bytes = 2;
}

message WriteFileChunkSuccess {
  uint64 next_offset = 1;
}

message WriteFileChunkResponse {
  oneof result {
    WriteFileChunkSuccess success = 1;
    FileOperationError error = 2;
  }
}

message FinishFileTransfer {
  FileTransferHandle handle = 1;
}

message FinishFileTransferSuccess {
  optional string committed_path = 1;
}

message FinishFileTransferResponse {
  oneof result {
    FinishFileTransferSuccess success = 1;
    FileOperationError error = 2;
  }
}

message AbortFileTransfer {
  FileTransferHandle handle = 1;
}

message AbortFileTransferSuccess {}

message AbortFileTransferResponse {
  oneof result {
    AbortFileTransferSuccess success = 1;
    FileOperationError error = 2;
  }
}

message PromotionTarget {
  string staging_path = 1;
  string final_path = 2;
}

enum PromotionStatus {
  PROMOTION_STATUS_UNSPECIFIED = 0;
  PROMOTION_STATUS_COMMITTED = 1;
  PROMOTION_STATUS_CONFLICT = 2;
  PROMOTION_STATUS_FAILED = 3;
}

message PromotionResult {
  string staging_path = 1;
  string requested_path = 2;
  optional string committed_path = 3;
  PromotionStatus status = 4;
  optional string error = 5;
}

message PromoteFiles {
  repeated PromotionTarget targets = 1;
  bool overwrite = 2;
  repeated string directory_overwrite_roots = 3;
}

message PromoteFilesSuccess {
  repeated PromotionResult results = 1;
}

message PromoteFilesResponse {
  oneof result {
    PromoteFilesSuccess success = 1;
    FileOperationError error = 2;
  }
}

// ── CLI-agent session history (Claude / Codex) ────────────────────
// The daemon runs natively on the remote host and reads/scans/mutates
// the target agent session stores directly via std::fs — one round trip per
// operation, no remote Python. Store roots are resolved by the target
// Environment session and sent explicitly; the daemon process environment is
// not configuration authority for the target CLI installation.

message CliAgentSessionStoreRoots {
  string home_dir = 1;
  string claude_config_dir = 2;
  string codex_home = 3;
}

// Client → server: scan recent Claude/Codex session files and return a
// deduplicated, oldest-first list of records (newest-trimmed to `limit`).
message ScanCliAgentSessions {
  uint32 limit = 1;
  CliAgentSessionStoreRoots roots = 2;
  // Serialized CLIAgent names selected by Ashide's discovery setting.
  repeated string enabled_agents = 3;
  // Providers that this EnvironmentTable generation has already observed.
  // The daemon only uses this to distinguish first-run empty stores from a
  // temporarily missing previously-observed provider source.
  repeated string previously_observed_agents = 4;
}

message CliAgentSessionRecord {
  string agent = 1;
  string id = 2;
  string source = 3;
  optional string label = 4;
  optional string cwd = 5;
  optional int64 modified_epoch_millis = 6;
}

message ScanCliAgentSessionsSuccess {
  repeated CliAgentSessionRecord records = 1;
  // Every provider successfully scanned for this complete generation,
  // including providers whose stores were successfully empty.
  repeated string observed_agents = 2;
  // A previously observed provider source disappeared. Records are omitted and
  // the EnvironmentTable must preserve its committed collection.
  optional string source_missing_agent = 3;
}

message ScanCliAgentSessionsResponse {
  oneof result {
    ScanCliAgentSessionsSuccess success = 1;
    FileOperationError error = 2;
  }
}

// Client → server: resolve a session source (including a codex
// `<index_path>:<id>` source → transcript) and read its bytes.
message ReadCliAgentSession {
  string source = 1;
  optional string provider_session_id = 2;
  CliAgentSessionStoreRoots roots = 3;
}

message ReadCliAgentSessionSuccess {
  string reference = 1;
  string sha256 = 2;
  bytes content = 3;
}

message ReadCliAgentSessionResponse {
  oneof result {
    ReadCliAgentSessionSuccess success = 1;
    FileOperationError error = 2;
  }
}

enum CliAgentSessionMutation {
  CLI_AGENT_SESSION_MUTATION_UNSPECIFIED = 0;
  CLI_AGENT_SESSION_MUTATION_ARCHIVE = 1;
  CLI_AGENT_SESSION_MUTATION_DELETE = 2;
}

// Client → server: archive or delete a session source (file or codex
// index entry).
message MutateCliAgentSession {
  string source = 1;
  CliAgentSessionMutation mutation = 2;
  CliAgentSessionStoreRoots roots = 3;
}

message MutateCliAgentSessionSuccess {}

message MutateCliAgentSessionResponse {
  oneof result {
    MutateCliAgentSessionSuccess success = 1;
    FileOperationError error = 2;
  }
}

// Client → server: read Ashide-owned user state for CLI-agent sessions.
// This is intentionally separate from MutateCliAgentSession, which mutates
// provider-owned transcript/index sources. User state belongs to the
// environment and is stored in the daemon user's Ashide config directory.
message GetCliAgentSessionUserState {}

message CliAgentSessionUserState {
  map<string, string> aliases = 1;
  repeated string pinned = 2;
}

message GetCliAgentSessionUserStateSuccess {
  CliAgentSessionUserState state = 1;
}

message GetCliAgentSessionUserStateResponse {
  oneof result {
    GetCliAgentSessionUserStateSuccess success = 1;
    FileOperationError error = 2;
  }
}

enum CliAgentSessionUserStateMutation {
  CLI_AGENT_SESSION_USER_STATE_MUTATION_UNSPECIFIED = 0;
  CLI_AGENT_SESSION_USER_STATE_MUTATION_SET_ALIAS = 1;
  CLI_AGENT_SESSION_USER_STATE_MUTATION_CLEAR_ALIAS = 2;
  CLI_AGENT_SESSION_USER_STATE_MUTATION_SET_PINNED = 3;
  CLI_AGENT_SESSION_USER_STATE_MUTATION_CLEAR_PINNED = 4;
}

message MutateCliAgentSessionUserState {
  repeated string keys = 1;
  CliAgentSessionUserStateMutation mutation = 2;
  optional string alias = 3;
}

message MutateCliAgentSessionUserStateSuccess {
  CliAgentSessionUserState state = 1;
}

message MutateCliAgentSessionUserStateResponse {
  oneof result {
    MutateCliAgentSessionUserStateSuccess success = 1;
    FileOperationError error = 2;
  }
}
