    required_tests: [test_environment_projection_data_uses_canonical_navigation_key, test_session_navigator_alias_projection_uses_canonical_environment_navigation_key, test_materialized_sourceless_restore_does_not_apply_source_alias_and_preserves_pin, test_local_materialized_sourceless_restore_does_not_apply_source_alias_and_preserves_pin, test_sourceless_restore_binding_survives_leaf_snapshot_round_trip, test_runtime_placeholder_leaf_binding_survives_sqlite_round_trip, test_session_navigator_merge_does_not_project_or_preserve_pin_state, local_remote_parity_static_materialized_source_user_state_projection_guard]

  - id: RESTORE-IN-FLIGHT-PROJECTION-OWNERSHIP-28
    scenarios:
