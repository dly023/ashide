      - "indexed sessions、alias/pin user state 与 SessionNavigatorModel 都按同一个 Environment navigation key 分区；local、local:<root> 切换不得造成列表短暂缺项或状态不可见。"
      - "live container 的 alias/pin lookup 与 mutation keys 必须统一包含 PaneSessionBinding.source_identity_keys；container UUID 继续拥有 live identity，source keys 只负责用户状态连续性。"
