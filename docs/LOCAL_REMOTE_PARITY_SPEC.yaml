    verification_rule: "静态 contract test 锁定 direct DMG 输出、hdiutil verify、无 zip/裸 App fallback 与 workflow DMG upload；真实 release artifact 必须通过 image verify、checksum 和隐私解包扫描。"

  - id: TEST-HARNESS-SSH-FIXTURE-HERMETICITY-62
    source: LR-157
    capability: "Workspace Environment test fixture hermeticity"
    invariant: "Workspace Environment lifecycle/reconnect 测试必须从隔离 SQLite 中读取显式 saved-provider fixture；共享 fixture 禁止使用 ssh-config: connection ref，也不得读取开发者 ~/.ssh/config 才能通过。"
