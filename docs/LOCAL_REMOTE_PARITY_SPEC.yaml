  - id: SESSION-NAVIGATOR-STABLE-INLINE-EDIT-IDENTITY-47
    source: LR-138
    capability: "session navigator stable inline edit identity"
    invariant: "同一 canonical RowId 从 virtual source 切换为 placeholder/live carrier 时，alias editor 的 owner、buffer 与 focus 必须保持；physical session.id 只能用于打开编辑器当帧定位。"
