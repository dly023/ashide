  - id: ENVIRONMENT-INDEXED-SESSION-SCAN-TRANSACTION-51
    source: LR-142
    capability: "environment indexed-session scan transaction"
    invariant: "EnvironmentTable 必须按 canonical navigation key 原子拥有 indexed-session scan generation 与 collection；同一 runtime SessionId 的旧扫描结果不得覆盖后启动扫描的 canonical collection。"
    lifecycle: "EnvironmentBackend 在发起 scan 前向 EnvironmentTable 申请 generation token；completion 同时校验 navigation key、runtime SessionId 与 generation，只有当前 token 的完整成功快照才能替换 indexed rows，随后继续复用 SessionNavigatorModel + reducer Refresh 投影。"
    failure_rule: "失败、取消、旧 SessionId 或旧 generation 必须保留上一份 collection；禁止旧成功子集 destructive replace、UI list freeze、overlay、debounce、retry 或在 reducer 永久保留所有缺失行。"
    negative_space: ["target plus two unrelated indexed rows", "two scans complete out of order", "older success is a subset", "newer complete success", "scan failure", "reconnect changes SessionId", "local synchronous scan", "remote asynchronous scan"]
    verification_rule: "红测先证明旧成功子集会把三行缩成两行；修复后旧 token commit 被拒绝且 cardinality/RowId/order 不变，当前 token 完整提交后仍由既有 atomic model 渲染。"


  - id: SESSION-NAVIGATOR-COMMITTED-RENDER-PROJECTION-52
    source: LR-143
    capability: "session navigator committed render projection"
    invariant: "Session Navigator render/detail lookup 只能消费 EnvironmentTable 已提交的 canonical SessionNavigatorModel；只读 UI 查询不得执行 Refresh、分配 RowId/display_order 或把尚未提交的 source/live carrier投影成可见行。"
    lifecycle: "所有 source、live pane、provider binding 与 restore lifecycle mutation 先经既有 sync/action reducer path 原子提交 SessionNavigatorModel，再 notify；render 仅从 committed model 派生 focus decoration，不改变 membership/identity/order。"
    failure_rule: "禁止 render-time speculative Refresh、未提交 row fallback、UI cache/freeze/debounce/动画遮挡或 local/remote render 分支；若 source mutation 尚未 sync，UI 必须保持上一份 canonical model而不是显示推演态。"
    negative_space: ["target plus two unrelated rows", "indexed source committed before sync", "placeholder allocated before provider binding event", "provider title enrichment", "split/add/close AppStateChanged before render", "detail sidecar lookup", "local synchronous delivery", "runtime asynchronous delivery"]
    verification_rule: "红测先证明只提交 indexed source、不执行 sync 时 render model 会凭空增加新行；修复后 render 保持旧 canonical cardinality/RowId/order，显式 sync 后一次性提交新 model；split/add/close 的 AppStateChanged 也必须在下一次 render 前经同一 reducer owner 提交 membership/focus；static check 禁止 session_navigator_model 调用 reduce_session_navigator_refresh。"

  - id: SESSION-NAVIGATOR-COMMITTED-FOCUS-PROJECTION-59
    source: LR-154
    capability: "session navigator committed membership and focus projection"
    invariant: "任何 canonical SessionNavigator sync 都必须在同一次 reducer transaction 中提交最新 membership 与当前物理 focus projection；PaneFocused 只写 is_active 展示态，不修改 Environment-owned selection，因此调用方不得选择 membership-only 提交分支。"
    lifecycle: "source/live/persistence mutation 先 Refresh canonical collection，再用当前 focused pane logical identity 执行 PaneFocused projection，最后一次性替换 EnvironmentTable active SessionNavigatorModel；Delete、tab/pane close、Undo、Environment switch、split/materialize 与普通 source refresh 共用这一条 sync。"
    failure_rule: "禁止 reduce_session_navigator_refresh 的 inject-focus 布尔开关、sync(..., false)、调用方先 focus/close 后 membership-only Refresh、或在 render 层 fallback active row；新增调用方只能使用 canonical sync/focus action model。"
    negative_space: ["local same-Environment neighbor after Delete", "runtime same-Environment neighbor after Delete", "split pane direct fixture then Undo", "selection is None while a live pane is focused", "restoring placeholder maps focus to requested logical identity", "background source refresh", "tab reorder and close index shift"]
    verification_rule: "红测必须证明物理 focus 已落到 sibling/restored pane 但 membership-only sync 会产生零 active rows；修复后同一 sync 原子提交 cardinality、RowId、order 与 exactly-one focused active row。static check 必须禁止可选 focus 注入分支。"

  - id: TERMINAL-SESSION-EXECUTION-CONTEXT-53
    source: LR-144
    capability: "terminal session execution context ownership"
    invariant: "每个 terminal SessionId 拥有自己的完整 bootstrap execution context；Environment synthetic transport owner 只能由第一个真实 bootstrapped terminal 一次性建立 canonical execution context，后续 terminal 不得覆盖。有效 context 必须同时包含非空 shell_path、cwd、HOME、PATH；CODEX_HOME/CLAUDE_CONFIG_DIR 可合法 unset；ASHIDE_SESSION_EXECUTION_CONTEXT 只能由完整 snapshot 校验成功后派生。helper daemon 的 cwd/env 不是任何 Environment session 的配置权威。"
    lifecycle: "连接只建立 synthetic transport owner，不注册空 executor；首个 Environment terminal 以 target-config root 或目标 passwd home 启动，shell bootstrap 捕获 cwd/env 后，ModelEventDispatcher 必须先让 RemoteServerManager 原子提交 alias binding、exact terminal context，并以 insert-if-absent 方式建立 Environment owner context，然后才能调用 Sessions::initialize_bootstrapped_session 选择并固化该 terminal 的 CommandExecutor。依赖 RunCommand 的 heartbeat、roots/scan/read/mutate/Fork 只能由同一个 execution-carrier readiness gate 在 owner context 存在后释放；reconnect 通过同一 transport registry 重放 owner 以及仍存活的全部 alias contexts；alias 注销必须同时删除 manager record 与当前 helper ConnectionState executor，owner 注销必须删除 owner、全部 aliases 与整条 connection state。"
    failure_rule: "禁止 synthetic owner 空 context、alias-only 半状态、先初始化 Session/选择 NoOpCommandExecutor 再事后注册 execution context、任意 terminal last-writer-wins 覆盖 owner、只重放 owner 而丢失 aliases、alias 注销后 helper 继续保留 executor、继承 daemon cwd/env、shell_path 缺失时裸 shell-name fallback、missing HOME→workspace root 或 UI/current-app fallback；manager 与 helper 两侧都必须独立拒绝 malformed SessionBootstrapped。transport Connected 不等于 command-ready，缺失 canonical carrier 时 heartbeat 不得启动，roots/version probe 必须等待或显式失败。"
    negative_space: ["control session connected before any terminal bootstrap", "connected transport survives longer than one heartbeat interval without a carrier", "first matching execution context releases heartbeat and root resolution", "stale or unrelated execution context cannot release owner heartbeat", "incomplete marker-less snapshot", "marker present but cwd/HOME/PATH/shell_path missing", "custom absolute CODEX_HOME", "custom relative CODEX_HOME", "custom CLAUDE_CONFIG_DIR", "daemon has conflicting roots", "daemon has conflicting PATH", "owner plus terminal A and terminal B", "terminal B bootstraps after A", "owner reconnect replays all live aliases", "alias removed while current connection stays alive", "alias removed before reconnect", "owner teardown", "missing HOME", "per-command override does not mutate base context"]
    verification_rule: "协议测试必须证明 alias+context 原子注册、helper fail-closed、同一连接的两个 SessionId 分别使用各自 cwd/env、daemon 冲突值不可见、真实 wire replay 恢复 owner+aliases、alias 注销即时删除 executor 且 reconnect 不复活；Workspace 测试必须证明 connected+no-context 不调度 command heartbeat、不重连，matching context 建立后才开始 heartbeat，stale/unrelated context 保持 inert；真实 remote runtime 以非默认 Codex/Claude roots 完成 scan→read→mutate→Fork，并由目标 PATH 执行 codex --version。"

  - id: RELEASE-PRIVACY-TARGET-IDENTITY-60
    source: LR-155
    capability: "release privacy and fixture identity"
    invariant: "任何可公开的 source、SPEC、matrix、tracker、Release notes 与解包后的发布资产都不得包含开发者真实 SSH target/alias；测试和运行时证据只能使用 remote-fixture-* 匿名身份。"
    lifecycle: "提交前与 CI 扫描 git-tracked source；macOS packaging 与最终 upload job 再扫描发布目录和 ZIP/TAR/DMG 解包内容；Release create/update 始终用当前提交中的受检 notes 覆盖旧 body。"
