  - id: RELEASE-PRIVACY-BINARY-TEXT-BOUNDARY-63
    source: LR-158
    capability: "release privacy scanner binary/text ownership"
    invariant: "本机 private denylist 必须逐字节扫描源码、二进制和压缩载荷；通用 ssh-config/root-target 语法规则只解释 git 文本与解包后的结构化文本，禁止把编译二进制中的相邻字符串误判为一个 fixture。"
    lifecycle: "release privacy checker 先扫描 tracked text 与 private token bytes；对 ZIP/TAR/DMG 解包或挂载后，按 MIME 分类文本做通用 fixture 校验，同时继续对全部文件做 private token byte scan。"
    failure_rule: "二进制字符串相邻不得阻塞发布；压缩包内文本 target、挂载 DMG 文本 target 或任意载荷中的本机 private token 必须 fail closed。"
    negative_space: ["adjacent compiled string constants", "ELF helper", "Mach-O app", "raw DMG bytes", "archived text leak", "mounted DMG text leak", "private token embedded in binary"]
    verification_rule: "contract test 必须同时证明 binary adjacency 通过、bare ssh-config/root target 失败、archive text target 失败；真实 DMG 与 helper artifacts 必须通过扫描。"

  - id: RELEASE-ARTIFACT-FORMAT-MIGRATION-CHECKSUM-64
    source: LR-159
    capability: "release artifact format migration cleanup"
    invariant: "同一逻辑发布物从 ZIP 切换为 DMG 时，producer 必须原子删除旧文件、旧 sidecar 与 SHA256SUMS 旧 basename；最终 checksum manifest 只能引用实际存在的产物。"
    lifecycle: "make_release_artifacts 确定 current 与 obsolete 扩展，先删除 obsolete artifact/sidecar，再从 SHA256SUMS 同时移除 current/obsolete 行，最后写入新产物 checksum。"
    failure_rule: "checksum manifest 引用不存在文件、同一 logical name 同时保留 ZIP/DMG 行或格式迁移依赖人工清理时必须停止发布。"
    negative_space: ["old ZIP file absent but checksum remains", "old ZIP sidecar remains", "idempotent DMG rebuild", "CLI ZIP rebuild", "shared SHA256SUMS with helper artifacts"]
    verification_rule: "contract test 锁定 obsolete file/sidecar 与双 basename checksum cleanup；真实 SHA256SUMS 必须逐项 shasum -c 零失败且无 Ashide-macos.zip 条目。"

  - id: RELEASE-NOTES-VERSIONED-SOURCE-OF-TRUTH-65
    source: LR-160
    capability: "versioned GitHub Release notes ownership"
    invariant: "GitHub Release body 必须由当前 tag checkout 中的 docs/releases/<tag>.md 唯一生成；已有 Release 也必须用受检 notes 覆盖，禁止保留人工旧 body 或自动占位文本。"
    lifecycle: "validate job 要求 versioned notes 存在；upload job 对 existing Release 执行 gh release edit --notes-file，对新 Release 执行 gh release create --notes-file --draft；全部 producer、隐私扫描、完整 checksum manifest 校验和资产上传成功后，同一 canonical job 执行 gh release edit --draft=false --latest。"
    failure_rule: "notes 文件缺失、已有 Release 不覆盖 body、新 Release 使用 inline placeholder、producer/checksum/upload 未完成即公开，或 tag workflow 成功后仍遗留 Draft 时必须 fail closed。"
    negative_space: ["existing draft release", "existing public release rerun", "missing notes file", "stale manual body", "new release before assets", "tag retarget"]
    verification_rule: "release privacy contract 与 static checker 必须锁定 versioned path、existing edit、new draft create、notes-file 和 upload 后唯一 --draft=false transition；远端验证必须确认 Release 非 Draft、body 等于 versioned notes、target commit 等于 tag 且资产 digest/manifest 完整。"

  - id: RELEASE-MACOS-DMG-OPTIONAL-SIGNING-66
    source: LR-161
    capability: "direct macOS DMG with optional Developer ID signing"
    invariant: "macOS Release 必须直接产出可下载的 Ashide-macos.dmg；零签名凭据使用完整 ad-hoc seal，六项目标 Developer ID/notarization 配置齐全时自动升级为签名、公证和 Gatekeeper 验证，上传意图不得强制改变签名模式。"
    lifecycle: "shared resolver 仅按 0/6/partial 配置解析 adhoc/signed/error；bundle 与 packager 使用同一模式。两种模式都验证 App strict seal、版本身份、DMG hdiutil 与 checksum；signed 模式额外执行 Developer ID、hardened runtime、notarization、stapling 和 App/DMG Gatekeeper postcondition。"
    failure_rule: "缺 DMG、部分 secrets、硬编码 Team ID、模式在 bundle/packager 间漂移必须阻断；signed 模式缺 identity/runtime/notary ticket 或任一 spctl 拒绝也必须阻断，但零 secrets 不得阻断直接 DMG 发布。"
    negative_space: ["zero signing secrets", "partially configured secrets", "six complete secrets", "upload enabled without signing", "ad-hoc strict seal failure", "Developer ID without hardened runtime", "notarized but unstapled DMG", "rerun existing Draft"]
    verification_rule: "static checker 必须锁定上传意图与签名模式解耦、0/6/partial resolver、无硬编码 Team ID 和两种 bundle/packager 路径；contract test 必须原生解析所有 release Bash，并执行 adhoc/signed/partial 负空间；最终 runtime 证据必须来自远程直接 Ashide-macos.dmg、checksum 与 hdiutil 验证。"

  - id: RELEASE-MACOS-INDEPENDENT-ARTIFACT-JOBS-67
    source: LR-162
    capability: "independent macOS App/DMG and remote-helper artifact jobs"
    invariant: "macOS App/DMG 与 remote helper 是独立发布物，必须在独立 job/timeout domain 中并行构建并分别上传 workflow artifact；最终 Release upload 只负责在全部 producer 成功后汇合，helper 延迟不得吞掉已完成 DMG 的取证能力。"
    lifecycle: "build-macos-app 独占 App bundle、direct DMG、checksum、privacy 与 release-macos-app upload；build-macos-helpers 以 x86_64/aarch64 matrix 为每个架构建立独立 runner、timeout 与 release-macos-helper-<arch> upload。两类 producer 直接依赖 validate-release-identity，upload-release 同时依赖 matrix 聚合结果及其他平台 producer。"
    failure_rule: "禁止把 App/DMG 与 helper 串入同一 job、在 helper 完成后才上传 DMG、让任一 producer 绕过 identity gate，或由 upload-release 在 producer 未成功时发布不完整资产。增加 timeout 不能替代独立所有权。"
    negative_space: ["App succeeds while helper is slow", "one helper architecture is slow", "one helper architecture fails", "helper fails after DMG packaging", "App fails while helpers succeed", "workflow cancellation", "missing App upload", "missing helper upload", "upload-release missing one producer dependency", "ZIP or bare App fallback"]
    verification_rule: "static checker 与 Rust workflow contract 必须锁定两个 job 的 owner、步骤互斥、独立 upload、直接 identity dependency、独立 timeout 和 upload-release 汇合依赖；远程验证必须证明 App 与 helper jobs 并行运行并分别产生可下载 artifact。"

  - id: WINDOWS-WSL-EXPLICIT-SHELL-STARTUP-68
    source: LR-163
    capability: "Windows explicit WSL distribution terminal startup"
    invariant: "用户明确选择 WSL distribution 后，ShellStarter resolution、WSL command construction、ConPTY spawn 与 bootstrap 必须保持同一个 selected distribution identity；任一阶段失败都必须在该 terminal carrier 上显式呈现，禁止降级到 PowerShell、其他 Windows shell 或另一 distribution。"
    lifecycle: "AvailableShell 持有 selected distribution name；WslShellStarter 通过唯一共享 command contract 查询目标 installation 的 shell/HOME 并构造 spawn argv；TerminalManager 原样传播 resolution failure；Windows PTY 只消费已解析 starter 并启动 wsl.exe，成功后 Session 保存相同 ShellLaunchData::WSL identity。"
    failure_rule: "发行版探测命令失败、目标 shell 为空/不支持、wsl.exe 不可用、ConPTY CreateProcessW 失败或 bootstrap 失败时必须保留 WSL 选择上下文并显示原始阶段错误；禁止 Option 丢错、compute_fallback_shell、未文档化参数分叉或探测与 spawn 各写一套 argv。"
    negative_space: ["Debian 13 selected explicitly", "distribution name contains spaces", "wsl.exe missing", "WSL CLI rejects an option", "empty SHELL", "unsupported target login shell", "ConPTY spawn failure", "unrelated Windows default shell available"]
    verification_rule: "跨平台 focused tests 必须锁定共享、仅使用稳定 WSL CLI 参数的 discovery/spawn argv，以及显式选择失败不 fallback；Windows cargo check/build 必须通过；最终 verified 必须来自真实 Windows + WSL2 Debian 13 的 terminal bootstrap 与 persisted ShellLaunchData 证据。"

  - id: WINDOWS-SSH-CONFIG-SHARED-CATALOG-69
    source: LR-164
    capability: "Windows-safe SSH config source and committed candidate catalog"
    invariant: "SSH config 默认路径解析、文件读取、候选集合与 open target 必须由底层 source + 单一 app-global catalog 原子持有；Workspace picker、SSH Manager、candidate open 与 ssh-config runtime reconnect 只消费同一 committed snapshot。UI 禁止展开 ~、读取 HOME/USERPROFILE、拼接 .ssh/config、执行文件 IO 或按操作系统/环境分支。"
    lifecycle: "warp_ssh_manager 解析当前 installation 的默认 config source 并完成一次读取；SshTargetCatalog 在启动、显式 refresh action 或 saved-server mutation invalidation 时，把 config source 与 SQLite saved servers 作为一个 generation 原子提交，并保留 path/open target/outcome/candidates/include metadata；所有 UI render 与 runtime lookup 只读该 generation 的 committed snapshot。"
    failure_rule: "home/source 不可用时必须提交明确 unavailable/error 状态且 open target 为空；NotFound、IO error、empty 与 loaded 必须保持互斥。禁止 UI 编造 ~/.ssh/config、render 时同步 load、Workspace/SSH Manager 各自缓存、或 reconnect 再次直接读取磁盘。"
    negative_space: ["Windows home path with drive letter", "home unavailable", "config not found", "permission error", "empty config", "multiple candidates", "refresh changes candidate order", "picker renders repeatedly", "SSH Manager and Workspace open simultaneously", "ssh-config reconnect after refresh"]
    verification_rule: "static checker 必须锁定 app 生产源码中唯一 load_candidates owner、UI 禁用 dirs/home/.ssh literal/std::fs、所有 config alias lookup 消费 catalog snapshot；focused tests 覆盖 Windows 路径原样 open、unavailable 不编造路径、共享 snapshot 与 refresh 原子替换；cargo check 与 Windows xwin check 必须通过，最终 verified 需真实 Windows 打开 config 与连接别名证据。"
  - id: TERMINAL-IN-BAND-GENERATOR-CANCEL-70
    source: LR-166
    capability: "terminal in-band generator protocol completion versus command cancellation"
    invariant: "TerminalModel::IsReceivingInBandCommandOutput 是生成器 payload lifecycle 唯一 owner；ANSI OSC Start/End 是协议 transition，PtyController command execution 是 ownership cancellation。只有真实 OSC End 可以校验、decode 并发送 ExecutedInBandCommand。"
    lifecycle: "用户、AI、共享会话或 EnvVarCollection command 开始时幂等取消 receiver 并丢弃 partial payload；local TTY 与 network-backed PTY 共用 TerminalModel transition，差异只在 PTY output transport timing。"
    failure_rule: "禁止从 write_command 伪造 End、在 command takeover 时 decode partial payload、为 transport 复制 receiver state，或只屏蔽重复告警而不修 transition。"
    negative_space: ["idle receiver", "partial payload", "valid OSC End", "duplicate real End", "user command", "AI command", "network-backed PTY"]
    verification_rule: "static checker 必须扫描全生产 Rust 树并输出 End/cancel/takeover 的 path:line:enclosing-function inventory，锁定 ANSI parser 是 End 唯一 owner、take_command_output_ownership 是 cancel 唯一 wrapper、write_command 是 takeover 唯一 caller，并以非法直接 End、非法 wrapper、新生产文件三类负向 probe 证明 fail closed；write_command 级 focused tests 必须覆盖 idle no-op、partial discard、零 terminal error event；真实本机 PTY 必须分别执行 user 与 AI command，保存原始日志并证明 End 相关 warning/error 计数为零。"

  - id: UI-MENU-DEFERRED-ACTION-DISPATCH-71
    source: LR-167
    capability: "Menu deferred responder action ownership"
    invariant: "Menu 只拥有 selection 与 Close lifecycle；pointer 与 keyboard Enter 必须进入唯一 activate_selected_item primitive。该 primitive 先同步提交 Close intent，再把可选 item action 交给 pending effect；item action 只能在当前 Menu update 把 view 放回 window registry 后进入 responder chain。"
    lifecycle: "pointer 先以 MenuAction::Activate 选择目标，keyboard Enter 使用当前 active submenu selection，二者随后共用 activate_selected_item；有 action 时先 emit Close(via_select_item=true)，再登记 deferred action，view registry 恢复后 flush action。关闭订阅者可以销毁或重建 parent/menu，且 action 观察到的必须是已关闭状态。无 action 时不产生 Close、ItemSelected 或 responder action。without_item_action_dispatch 模式则依次 emit ItemSelected、Close，不登记 responder effect。"
    failure_rule: "禁止 render closure 直接分发 item action、pointer/Enter 各自实现 close/action 顺序、在 Menu update 栈内同步调用 parent action、action 先于 Close、consumer-specific circular-update workaround、捕获 Circular view update panic或增加 macOS-only 分支。"
    negative_space: ["keyboard Enter", "pointer select", "parent rebuilds same menu", "parent closes menu", "nested submenu", "item without action", "without_item_action_dispatch"]
    verification_rule: "static checker 必须扫描全生产源码树并打印 path:line/enclosing-function owner inventory，锁定 MenuAction::Activate 只从 pointer render 进入、deferred item action 只由 activate_selected_item 登记，并用直接调用、wrapper 与新文件绕过探针 fail closed；focused tests 覆盖 pointer/keyboard、Close-before-action、parent rebuild/close、nested submenu、无 action 与 without_item_action_dispatch。"

  - id: ENVIRONMENT-USER-STATE-MUTATION-GENERATION-72
    source: LR-168
    capability: "Environment session user-state optimistic mutation generation"
    invariant: "EnvironmentTable 必须按 canonical navigation key 原子持有 alias/pin projection 与 mutation generation；只有当前 generation 的 backend completion 可以提交成功或回滚失败。"
    lifecycle: "共享 UI 先在 EnvironmentTable 开始 generation 并提交 optimistic projection，再把 generation 交给 local/runtime backend；同步 local completion 立即提交，runtime callback 仅在 generation 仍当前时提交或回滚。"
    failure_rule: "禁止旧 success/failure 覆盖新 mutation、整份 previous_state 无 generation 回滚、Pending 立即显示成功、或 callback 绕过 EnvironmentTable 直接替换 projection。"
    negative_space: ["two runtime mutations complete out of order", "old failure after new success", "old success after new optimistic state", "canonical authority aliases", "synchronous local failure", "workspace owner dropped"]
    verification_rule: "focused tests 必须证明 stale success/failure 都被拒绝且较新 projection 保留；static checker 锁定 generation 从 begin 到 runtime completion 的唯一链路。"

  - id: REMOTE-HELPER-SSH-STDIN-UPLOAD-73
    source: LR-169
    capability: "remote helper dependency-free upload transport"
    invariant: "remote helper 上传只依赖已经建立的 SSH ControlMaster 与远端 POSIX shell；远端缺少 rsync 或 SFTP/SCP subsystem 时，必须通过 SSH stdin 把本地产物写入唯一临时文件，再由 installer 原子 promote 到最终路径。"
    lifecycle: "installer 先交叉编译当前 checkout 对应的 Linux musl helper，创建远端目录与唯一 temp path；可用时 rsync 增量上传，否则 canonical ssh_upload_file_for_target 流式写 temp；成功后 chmod、mv、stamp、停止旧 daemon 并执行协议/版本校验。"
    failure_rule: "禁止把 scp 当作 rsync fallback、直接覆盖正在执行的最终 binary、失败后回退 release helper、吞掉 SSH stdin/write/remote cat 错误，或在未 promote 前报告安装成功。"
    negative_space: ["remote has no rsync", "sshd has no SFTP subsystem", "large helper exceeds memory", "path contains shell metacharacters", "stdin write fails", "remote disk full", "concurrent reconnect", "protocol mismatch"]
    verification_rule: "static checker 锁定唯一 SSH stdin upload primitive 并禁止 helper installer 调用 scp；unit/contract tests 覆盖 shell quoting、无 rsync 分支和 temp→promote 顺序；修改后运行 cargo check、x86_64-unknown-linux-musl helper build 与 release workflow contract。"

  - id: TERMINAL-INTERACTION-OWNER-74
    source: LR-170
    capability: "terminal focus, IME composition and block-filter edit-session ownership"
    invariant: "pane focus 由 exact PaneFocusHandle 直接提交 PaneId 到 PaneGroupFocusState；IME composition 由 TerminalModel 固定 set 时的 screen/block carrier；block filter target 与 generation 由 BlockFilterEditor edit session 唯一持有。三者都不得依赖瞬时 responder ancestry 或关闭后的父 view 镜像。"
    lifecycle: "focus handle commit 触发 FocusChanged，由 PaneGroup 唯一更新 history 与 PaneFocused；SetMarkedText 建立 carrier，ClearMarkedText 幂等清理同一 carrier后结束 lifecycle；filter open 建立 {block_index,generation}，UpdateFilter 携 token，close 先结束 session再 reset，父层只接受 current token。"
    failure_rule: "禁止 HandleFocusChange child→ancestor action、扫描所有 pane 猜 focus、clear marked text 查询当前 active block、identity-less UpdateFilter、或 TerminalView 保留平行 active_filter_editor_block_index。"
