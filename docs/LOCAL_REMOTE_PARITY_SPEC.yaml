  - id: REMOTE-HELPER-PROTOCOL-REVISION-32
    source: LR-123
    capability: "remote helper explicit bidirectional protocol revision"
    local: "客户端与当前 checkout/release helper 使用同一 REMOTE_SERVER_PROTOCOL_REVISION；Initialize 请求和响应都携带该 revision。"
    remote: "helper 在写入 auth token 或执行任何请求前校验 client revision；客户端在接受 host_id 前校验 server revision。"
    invariant: "缺失、旧版或未知 protocol revision 必须在 Initialize 阶段显式失败；protobuf unknown-field/default-value 兼容不得把不兼容 helper 伪装成成功连接。"
    source_build_delivery: "source/dev helper 安装身份由 REMOTE_SERVER_PROTOCOL_REVISION 派生；当前 CLI-agent discovery outcome revision 使用 dev-pty-v6，禁止复用任何更低 revision helper。"
    release_delivery: "tag release helper 安装身份必须同时包含 release version 与 REMOTE_SERVER_PROTOCOL_REVISION（当前例如 v0.3.0-pty-v6）；同一 tag 下 protocol revision 变化时不得复用旧 helper。Initialize revision 仍是最终 fail-closed 证明，不能只依赖文件名或 --version/help 探针。"
    side_effect_order: "server revision 校验严格早于 auth_token mutation；失败连接不得改变 daemon credential 或进入业务 handler。"
    negative_space: ["new client + old helper response missing revision", "old client + new helper request missing revision", "wrong nonzero revision", "matching revision", "auth token supplied on mismatch"]
    verification_rule: "协议 round-trip、client rejection、server rejection/no-auth-mutation、source/dev slot、release version+protocol slot 与 static guard 必须同时覆盖。"

  - id: REMOTE-CONNECTION-HANDSHAKE-OWNERSHIP-33
    source: LR-124
    capability: "per-connection handshake state owns business-message eligibility"
    invariant: "每条 proxy connection 的 sender、Initialize phase 与 snapshot delivery state 由同一个 ConnectionState 原子持有；只有 Ready connection 可进入 Authenticate/SessionBootstrapped/Abort 和任何业务 RPC。"
    lifecycle: "register=AwaitingInitialize；matching revision Initialize 原子转 Ready；mismatch 保持 Awaiting；deregister 删除完整 ConnectionState；重复 Initialize 明确失败。"
    failure_rule: "未 Initialize、Initialize 失败或 connection 不存在时，业务请求返回 InvalidRequest 且不得创建 executor/PTY、读取或修改文件/session state；notification 也不得产生副作用。"
    owner_rule: "禁止 sender map、initialized HashSet 与 snapshot roots map 三份平行状态；连接生命周期字段必须随 ConnectionState 一起注册/注销。"
    negative_space: ["business request before Initialize", "Authenticate before Initialize", "wrong revision then business request", "successful Initialize then business request", "duplicate Initialize", "deregister then late message"]
    verification_rule: "逐阶段断言 phase、auth 与业务副作用；只证明正常 client 总会先 Initialize 不算 server contract。"

  - id: REMOTE-CONNECTION-RESOURCE-OWNERSHIP-34
    source: LR-125
    capability: "ConnectionState-owned command executors and in-flight requests"
    invariant: "SessionBootstrapped executor 与 cancellable in-flight request 必须存放在对应 ConnectionState 内；SessionId/RequestId 只在 owner connection 内唯一，禁止作为 daemon-global key。"
    lifecycle: "Ready connection 在自己的 ConnectionState 创建资源；相同 locator 可被不同 connection 独立使用；Abort/resolve 只能移除同一 connection 的 request；deregister/drop 原子删除 executor 并 abort 该连接全部 in-flight request。"
    failure_rule: "跨连接 session_id/request_id 碰撞不得覆盖、拒绝或删除另一连接资源；旧 request 完成不得误删同 locator 的新连接 request；stale executor 禁止跨 reconnect 存活。"
    negative_space: ["two connections reuse one SessionId", "two connections reuse one RequestId", "cross-connection Abort", "old request resolves after same locator is registered elsewhere", "disconnect with mixed owned/unowned requests"]
    verification_rule: "至少用 owner + other + 两个无关资源逐阶段覆盖 locator collision、cross-connection Abort、resolve cleanup、disconnect executor cleanup 与 disconnect request abort。"

  - id: REMOTE-PTY-CONNECTION-OWNERSHIP-35
    source: LR-126
    capability: "connection-owned remote PTY mutation and teardown"
    invariant: "RemotePty registry 由对应 ConnectionState 持有；WritePty/ResizePty/ClosePty 必须先定位当前 connection，再定位其 PTY，PTY id 不是跨连接授权凭据。"
    lifecycle: "CreatePty 只在 owner ConnectionState 注册；owner 可 write/resize/close；其他 connection 的同 id 操作无副作用；deregister/drop 关闭 owner 全部 PTY 并终止 child。"
    failure_rule: "跨连接 WritePty/ResizePty/ClosePty 必须按 unknown resource 处理，不得写入、改变窗口尺寸、关闭或劫持另一连接终端。"
    negative_space: ["foreign WritePty", "foreign ResizePty", "foreign ClosePty", "same numeric PTY locator in unrelated connection state", "disconnect owner while another connection remains"]
    verification_rule: "用可观察 PTY ownership registry 行为测试证明 foreign close 不移除、owner close 移除、disconnect 只清理 owner；static check 禁止 mutation handler 丢弃 conn_id。"

  - id: REMOTE-BUFFER-MUTATION-SERIALIZATION-36
    source: LR-127
    capability: "per-buffer async mutation queue and exact completion ownership"
    invariant: "同一 FileId 的 SaveBuffer/ResolveConflict 必须由 ServerBufferTracker 的单一 active mutation + FIFO queue 持有；一个 FileSaved/FailedToSave 只能完成一个 active intent，禁止按 kind 批量取走全部请求。"
    lifecycle: "handler 先 enqueue intent；idle queue 启动 head；完成/失败只 pop active 并启动下一项；queued intent 保留 request/connection/payload/order；active owner 断连只失去 response carrier，底层 mutation 完成前仍占据 serialization slot。"
    ordering_rule: "同文件 mutation 严格按接收顺序启动，后一次 save/resolve 不得与前一次并发写盘，也不得因前一次事件提前收到成功或失败。不同 FileId 可并行。"
    carrier_missing_rule: "queued request 的 connection 断开时可取消尚未开始的 intent；active mutation 不可伪装成已完成或直接释放 slot，必须等待真实 FileSaved/FailedToSave 后清理。"
    negative_space: ["two SaveBuffer requests for one file", "Save then ResolveConflict", "ResolveConflict then Save", "first fails second succeeds", "active owner disconnects", "queued owner disconnects", "unrelated file mutation"]
    verification_rule: "使用 active + 两个 queued + unrelated file 的集合测试逐阶段断言 cardinality/order；production ServerModel→ServerBufferTracker→GlobalBufferModel→FileModel→真实磁盘测试必须证明 ResolveConflict/SaveBuffer 按请求顺序响应、每次只完成一个 active head 并最终落盘。"

  - id: REMOTE-FILE-TRANSFER-CONNECTION-OWNERSHIP-37
    source: LR-128
    capability: "ConnectionState-owned inode-pinned file transfers"
    invariant: "read/write transfer handle map 必须由对应 ConnectionState 直接持有；ReadChunk/WriteChunk/Finish/Abort 先定位当前 connection namespace，再定位 opaque handle，禁止在 daemon-global map 的 value 中后补 owner。"
    lifecycle: "Begin 在 owner ConnectionState 注册 descriptor；chunk/finish/abort 仅访问 owner map；finish/abort 删除单 handle；deregister/drop 删除全部 handles，write staging 由 FileTransferState::Drop 清理。"
    failure_rule: "foreign handle 按 unknown resource 失败且无 descriptor/staging/final-path 副作用；两个 connection 即使复用同一 handle locator 也必须独立。"
    negative_space: ["foreign read", "foreign write", "foreign finish", "foreign abort", "same handle locator in two connections", "disconnect during staged upload"]
    verification_rule: "行为测试覆盖 foreign access、same-locator independence、disconnect staging cleanup；production dispatch 必须通过 Initialize gate、ClientMessage/ServerMessage wire envelope 和两条真实 connection 证明断开 A 不影响 B 的 descriptor/cursor/finish；static check 禁止 ServerModel global file_transfers 与 FileTransferState conn_id owner 字段。"

  - id: REMOTE-FILE-TRANSFER-SNAPSHOT-INTEGRITY-38
    source: LR-129
    capability: "inode-pinned transfer size and cursor integrity"
    invariant: "Read transfer 在 Begin 时固定 source inode 与 total_size；后续 chunk 只能返回该 snapshot size 范围内的字节。客户端必须以 begin total_size、chunk bytes 和 next_offset 共同验证连续游标，禁止只相信 eof 或单调递增。"
    lifecycle: "Begin(Read) 返回必填 total_size；server 每次最多读取 remaining bytes，source 提前截断显式失败，source 增长不泄露 snapshot 之外字节；client 完成前验证 next_offset=previous+bytes.len 且 eof 当且仅当 next_offset=total_size。Write chunk 必须验证 next_offset=previous+submitted.len。"
    failure_rule: "过大文件在读取首个 chunk 前拒绝并 Abort；截断、offset 跳跃、offset 回退、过早 eof、结束 size 不一致都必须失败并清理 transfer/staging，禁止把部分文件 commit 为成功。"
    owner_rule: "完整性规则复用 Environment Runtime transfer response types 和 ConnectionState-owned transfer state；不得在 file browser、CLI-agent reader 等调用方各写一套宽松 cursor 判断。"
    negative_space: ["source grows after Begin", "source truncates after Begin", "zero max_bytes before eof", "next_offset jumps beyond bytes", "premature eof", "begin total_size exceeds bounded reader limit", "listing size differs from pinned transfer size"]
    verification_rule: "server 行为测试覆盖 grow/truncate/zero-budget；production dispatch 必须经 Initialize gate 与 wire envelope 在真实临时文件上证明 Begin 后增长受 snapshot cap、截断不会伪 eof；共享 cursor validator 测试覆盖 exact offset、premature eof、size mismatch 与 write jump；static check 禁止 read==0 被解释为 eof 和调用方继续使用 <=/monotonic-only 判断。"

  - id: REMOTE-BUFFER-RESOLVE-TRANSACTION-39
    source: LR-130
    capability: "transactional remote conflict resolution"
    invariant: "ResolveConflict 的 client content、SyncClock 与 base_content_version 必须作为一个 staged mutation 提交；FileSaved 前 canonical buffer 维持最后一次已落盘状态，FailedToSave 必须丢弃 staging 且不得留下 memory/disk divergence。"
    lifecycle: "ServerBufferTracker 串行化 intent；GlobalBufferModel 验证 acknowledged version 后创建 staged resolve；FileModel save 成功事件原子 commit content/version/clock，失败事件只清 staging；随后 queue 才推进下一 intent。"
    failure_rule: "save initiation failure、FailedToSave、owner disconnect、queued Save/Resolve 和无关 file event 都不得提前改变 canonical content/sync clock；失败后下一 mutation 必须从最后 committed state 开始。"
    negative_space: ["resolve save fails", "resolve initiation fails", "save queued after failed resolve", "second resolve queued", "unrelated file save event", "buffer edit while resolve is staged"]
    verification_rule: "单元测试逐阶段断言 pre-save canonical state、success commit、failure rollback-by-nonmutation 与 queue advancement；production runtime 测试必须制造真实异步 FileModel save failure，证明 committed content/clock 不变且 queued SaveBuffer 随后从 committed state 成功落盘；static check 禁止 resolve_conflict 在 FileSaved 前 replace_all/set_version/sync clock。"

  - id: REMOTE-BUFFER-BINDING-OWNERSHIP-40
    source: LR-131
    capability: "stable transport binding and single-writer ownership for shared environment buffers"
    invariant: "一个 app-global Environment buffer 必须绑定一个稳定 runtime session/connection，所有 Open/Edit/Save/Close 使用同一 binding；daemon 对同一 FileId 只允许一个 writer connection。多个 UI consumer 共享该 buffer 时，只有最后一个 consumer release 才发送 CloseBuffer。"
    lifecycle: "首次 open 选择 session binding 并登记 consumer；重复 open 只增加 consumer lease，不重复 OpenBuffer；edit/save/close 按 stored session lookup 当前 reconnect client；最后 lease release 才 close；daemon disconnect/close 释放 writer owner后才允许其他 connection open。"
    failure_rule: "禁止每次按 host 从 HashSet 任取 client；禁止一个窗口关闭共享 buffer 时让其他窗口失去 sync/save；foreign connection 不能 edit/save/close 未拥有的 buffer；binding session 缺失必须显式失败或重开，不得静默迁移。"
    negative_space: ["two windows open same host/path", "one window closes while another remains", "two sessions share one host", "binding session reconnects", "binding session disappears while peer session remains", "second connection opens same server path", "foreign edit/save/close"]
    verification_rule: "测试覆盖 consumer cardinality、last-release close、stable session routing、same-host session churn、daemon writer exclusion 与 disconnect handoff；static check 禁止 GlobalBufferModel client_for_host 和 unowned server buffer mutation。"

  - id: SHARED-BUFFER-LOAD-EDITABILITY-41
    source: LR-132
    capability: "shared buffer loading state owns editability"
    invariant: "GlobalBufferModel buffer 在初始内容 materialize 前必须为 non-editable/selectable；BufferLoaded 后所有 consumer 同步变为 editable。加载窗口内不得产生随后被 replace_all 覆盖的 user edit；Loaded 快路径缺 canonical content 或 SyncClock 时不得用默认值伪造成功。"
    lifecycle: "open 创建 Loading canonical state；每个 editor consumer 从 model state 投影 InteractionState；BufferLoaded 原子安装 content/version/sync clock 后解锁；FailedToLoad 与 incomplete Loaded state 复用同一 owner cleanup，显式进入失败/可重试语义，不得伪装成已加载的远程新文件。"
    failure_rule: "禁止依赖 ContentChanged handler 在 sync_clock=None 时静默 return；禁止先允许输入再用 OpenBufferResponse replace_all；多个 consumer 必须观察同一个 loading transition。"
    negative_space: ["user types before OpenBufferResponse", "two consumers while loading", "open fails", "consumer closes during load", "late response after cleanup"]
    verification_rule: "测试断言 loading editor 不可编辑、load success 后统一解锁、失败不保留伪编辑内容、late response 不复活已关闭 state；static check 禁止保留已承认的 load-window overwrite TODO。"

  - id: REMOTE-TRANSPORT-SESSION-BINDING-42
    source: LR-133
    capability: "operation-scoped exact Environment Runtime transport binding"
    invariant: "HostId 只表示 canonical host identity；任何由具体 terminal、AI action、file tab、diff、skill inventory 或 SFTP Environment target 发起的 transport operation 必须携带并使用该 owner 的 exact SessionId。"
    lifecycle: "active session / EnvironmentRuntimeTarget 在入口确定 SessionId；CodeSource、FileBackend、SessionContext 与 inventory refresh args 保存 binding；delivery 时仅用 client_for_session 解析 reconnect 后的当前 client。可见 terminal SessionId 与 Environment owner SessionId 的等价判断必须复用 manager 的 session-alias canonicalization。"
    failure_rule: "bound SessionId 无 client 时显式失败；禁止按 HostId 从 session pool 任取连接、静默切换同 host peer session、用裸 SessionId 相等比较拒绝合法 terminal alias，或在下游重新推断 binding。"
    negative_space: ["two sessions share one host", "one session reconnects", "bound session disappears while peer remains", "terminal bootstrap SessionId aliases an Environment-owned control SessionId", "AI read/edit during peer connection churn", "SFTP browser and code diff opened from different windows", "remote file save after tab move"]
    verification_rule: "static check 全仓禁止 client_for_host API/调用，并要求 Environment navigation 复用 shared alias binding matcher；行为测试覆盖 Environment target 返回 host+session、FileModel remote backend round-trip exact binding、terminal/AI inventory 使用 active session id，以及 terminal alias 不被误判为 stale navigation。"

  - id: NATIVE-SESSION-TARGET-PROJECT-IDENTITY-43
    source: LR-134
    capability: "native CLI session target project identity"
    invariant: "SessionBridge native write plan 的 project/cwd/store slug 必须来自目标 execution environment 对 source project path 的 canonical resolution；不得直接使用可含 symlink alias 的 source spelling。"
    lifecycle: "local backend 在写 plan 前 canonicalize source project path（缺失时 canonicalize target home）；Environment backend 复用 resolve_environment_runtime_roots 在 exact SessionId 上执行 pwd -P；两者生成 NativeSessionProjectContext 后交给同一 plan builder。"
    failure_rule: "目标路径无法 canonicalize 时显式失败且不得写入 history/transcript；禁止按本机 realpath 代填远端、禁止 planner 自行猜测或 fallback 到未验证 lexical path。"
    negative_space: ["macOS /tmp to /private/tmp alias", "workspace opened through directory symlink", "remote symlink project root", "missing project path", "same source spelling resolves differently on local and remote", "Codex and Claude use the same target project context"]
    verification_rule: "行为测试覆盖 local symlink canonicalization、remote exact-SessionId pwd -P target context、Claude store slug/cwd 使用 canonical path；本地与远端真实 Claude resume 都必须从 symlink cwd 加载 canonical store 中的生成会话，并把历史 context 与新 prompt 发送给真实 consumer。"

  - id: REMOTE-CONTROL-MASTER-SESSION-OWNERSHIP-44
    source: LR-135
    capability: "environment-session-owned SSH ControlMaster resource"
    invariant: "每个 Environment-owned SessionId 必须拥有独立 ControlMaster socket；authority 只参与可读的稳定散列，不得单独充当外部进程资源身份。两个窗口打开同一 authority 时必须保留两条并行 transport，任何一条 teardown 都不能向 sibling socket 发送 ssh -O exit。"
    lifecycle: "Workspace 先从 app-global RemoteServerManager 分配 Environment-owned SessionId，再以 authority + SessionId 生成 control path；spawn/check/proxy/reconnect/deregister 全程携带同一路径；session teardown 只停止自己的 master。"
    failure_rule: "禁止 authority-only control path、共享 socket 的先 exit 后重建、通过 UI 阻止第二窗口、连接断开后把旧 terminal alias 静默迁移到 peer session，或用 reconnect 遮挡 sibling preemption。"
    negative_space: ["two windows open the same authority", "two sessions start concurrently", "one session disconnects while sibling remains", "one session deregisters and runs ssh -O exit", "same authority reconnect", "stale socket from a previous process", "different authorities with the same SessionId locator"]
    verification_rule: "单元测试证明同 authority 不同 SessionId 路径不同、同 SessionId 路径稳定且长度受限；真实双窗口验证同时保持两条 proxy，分别执行唯一 PTY marker、Ctrl-C 与目录导航，且第一连接不出现 EOF/Broken pipe/host binding 丢失。"

  - id: RESUME-CARRIER-BIRTH-BINDING-45
    source: LR-136
    capability: "session restore carrier identity at allocation"
    invariant: "SessionRestore 分配出的 terminal/placeholder carrier 在第一次可能触发 sync/notify 前就必须持有 PaneSessionBinding；任何可见帧都不得出现未绑定 generic live row。"
    lifecycle: "EnvironmentEntryIntent::SessionRestore 生成唯一 PaneSessionBinding；TerminalBootstrap 与 Runtime 都把该 binding 传入 add_tab_with_pane_layout_in_environment 的 initial_session_binding；delivery 返回后的 finalize 只校验 carrier、扩展 reducer RowId identity edge 并 Refresh，不再后补 pane binding。"
    failure_rule: "source 无 semantic binding、carrier 未带预期 binding、container UUID/authority 不匹配时显式失败；禁止先创建可见 pane 再 restore_session_binding、用 reducer collapse 掩盖第一帧重复行、或增加 local/remote UI overlay。"
    negative_space: ["local synchronous tab creation emits intermediate notify", "runtime placeholder before PTY materialization", "provider-native session id present", "sourceless restore", "two unrelated rows", "restore failure before bootstrap", "cold restored binding"]
