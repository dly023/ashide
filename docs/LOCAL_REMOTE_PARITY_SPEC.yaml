    failure_rule: "禁止 UI 分别调用 session_navigator_sessions 与 snapshot_session_navigator_state；禁止 physical fallback key、额外 render cache、列表冻结、debounce 或动画遮挡非原子 projection。"
    negative_space: ["new identity first appears during render refresh", "source temporarily missing while restoring", "source-to-placeholder-to-live", "two unrelated rows", "detail sidecar lookup", "local and runtime delivery timing"]
    verification_rule: "测试在未提交 Refresh state 时引入新 observed identity，并证明 render model 的 row 与 row_id_by_identity 同帧一致；static check 强制 Vertical Tabs 只消费 SessionNavigatorModel；真实高帧率 Resume 不再重建或跳动行。"

  - id: SESSION-NAVIGATOR-ATOMIC-ACTION-MODEL-50
    source: LR-141
    capability: "session navigator atomic action model"
    invariant: "所有 Pin、Reorder、Activate、Restore lifecycle、Delete 等 reducer action 必须从同一个刷新后的 SessionNavigatorModel 解构 sessions 与 state；禁止先读旧 state 再单独刷新 sessions。"
