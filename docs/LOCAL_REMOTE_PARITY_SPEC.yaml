    capability: "Session Navigator stable keyboard cursor and typed actions"
    invariant: "VerticalTabsPanelState owns an ephemeral keyboard cursor keyed only by SessionNavigatorRowIdentity. EnvironmentTable SessionNavigatorState remains the canonical selection owner. The cursor is normalized against the committed, query-filtered viewport rows and is never persisted or represented by list/tab/leaf indices."
    lifecycle: "search focus → query/projection normalization → Up/Down move stable cursor → ListState scrolls its containing canonical ReorderUnit visible → Enter dispatches ActivateRestoredWorkspaceSession → canonical lifecycle commits; Escape clears cursor and either clears query or restores active-tab focus. local/runtime differ only in committed revision timing."
    failure_rule: "禁止 keyboard cursor 写 reducer selected_row_id、SQLite 或 WorkspaceState；禁止用 viewport index/tab locator/EntityId 作 identity；禁止 keyboard 路径重扫 discovery、绕过 typed WorkspaceAction 或创建第二套 pin/rename/delete mutation。"
    negative_space: ["many unrelated rows", "split siblings", "query no-match", "pinned reorder", "virtual-to-live carrier replacement", "source deletion", "refresh reordering", "local/runtime timing", "restoring or inline-renaming row"]
    verification_rule: "focused tests lock stable identity normalization, query/removal/reorder behavior and typed Enter route; static checker locks transient ownership, index-free cursor and no reducer mutation with negative probes; cargo check validates Rust integration."

  - id: SESSION-NAVIGATOR-LOCAL-SCAN-COORDINATION-73
    source: LR-204
    capability: "Process-scoped local Session Navigator discovery coalescing"
    invariant: "同一进程内、scan input（enabled provider、prior observed provider、scope paths）完全相同的 local Workspace 必须共享一次 filesystem discovery。WorkspaceRegistry 仅拥有短生命周期 scan transaction；每个 recipient 仍以自己 EnvironmentTable 的 authority token 提交 canonical projection。"
    lifecycle: "Workspace local refresh → EnvironmentTable creates recipient token → WorkspaceRegistry starts or joins keyed source transaction → one blocking discovery worker → current generation fans out the same outcome to every live recipient token → each EnvironmentTable independently commits/preserves/finishes feedback. Explicit refresh replaces worker generation but retains passive recipients; stale worker has no delivery side effect."
    failure_rule: "禁止按 WindowId/tab/leaf 合并 source input；禁止 Registry 缓存或持久化 Navigator membership、直接写 SessionNavigatorModel 或绕过 EnvironmentTable commit；禁止 explicit refresh 让 passive token 永久 in-flight；禁止 stale worker 清理或投递新 generation。"
    negative_space: ["three restored windows with identical local inputs", "different workspace scopes", "different observed-provider sets", "explicit refresh during passive scan", "stale completion", "closed follower window", "source missing", "scan failure", "local/runtime separation"]
    verification_rule: "focused registry tests cover matching coalescing, scope separation and explicit preemption; static checker locks the one Registry coordinator, key fields, token fanout and no direct worker outside the coordinator; runtime cold start must show one scan transaction for equal restored local windows."
