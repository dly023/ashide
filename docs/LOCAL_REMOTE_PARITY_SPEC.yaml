      - "同一 source/target execution context 通过 pair resolver 只解析一次 roots，并把同一 resolved environment 交给 reader、writer 与 delete；不得在各 consumer 内重新 probe。"
      - "Fork writer 与 Navigator remote scan 复用同一 Environment root resolver；local/runtime 只在配置读取 transport 上不同，不维护 writer-only、scanner-only 或 daemon-only root resolver。Conversation/Ashide DB cold-read 不被 CLI roots 强耦合。"
      - "目标 roots 改变后的下一次 operation 重新解析完整 snapshot；一次 operation 内禁止分别读取环境变量造成 TOCTOU 或跨目录混用。"
