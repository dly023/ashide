    verification_rule: "static checker 禁止三类旧 owner；focused tests 覆盖 exact focus commit、late/idempotent composition clear、stale filter generation rejection与A/B隔离；cargo check 必须通过。"

  - id: AGENT-LAYERED-CAPABILITY-REGISTRY-75
    source: LR-171
    capability: "single layered Agent capability registry"
    invariant: "每个 Agent identity 只能有一个 registry record，分别声明 detect/live binding、index/list/cold restore、resume/attach、SessionBridge IR read、fork/edit preview、native write/derived launch；产品入口、Navigator、scanner、runtime 与 SessionBridge 禁止维护第二套 capability bool 或 provider match table。"
