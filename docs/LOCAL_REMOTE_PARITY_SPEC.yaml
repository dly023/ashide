# Ashide 本地/远程能力一致性规范
#
# 跨 backend 的共享行为先在此定义，再进入 capability matrix、静态门禁和测试。
# Session Navigator 的专用状态模型仍以 docs/SESSION_NAVIGATOR_SPEC.yaml 为权威。

spec_version: 43
last_updated: "2026-07-27"

application_lifecycle_contracts:
  single_gui_process:
    id: APP-SINGLE-INSTANCE-MAC-01
    capability: "single GUI process with app-internal multi-window support"
    invariant: >-
      每个 channel / OS user session 只能有一个 Ashide GUI 进程；第二次启动必须把 URL/目录/new-window
      intent 转发给既有进程并退出。多窗口只能由该进程内部创建，禁止用第二个进程模拟多窗口。
    enforcement_layers:
      os_bundle: "macOS Info.plist 声明 LSMultipleInstancesProhibited，阻止 LaunchServices 显式创建第二实例。"
      process_lock: "所有 GUI channel（包括 script/run 生成的 dev/local/preview bundle）在 UI/SQLite 初始化前获取自动随进程释放的 advisory lock；锁已占用时不得继续初始化。release_bundle 只能控制资源打包，禁止控制 lifecycle correctness。"
      startup_ipc: "锁已占用时重试连接既有进程的固定本地 IPC，将启动参数转成 typed URL intent 后退出。"
      fail_closed: "检测到 owner 但 IPC 暂不可用时等待有界 server-ready 窗口并显式失败；禁止回退启动第二 GUI。"
    channel_scope: >-
      lock 与 IPC 地址只由 ChannelState::app_id application identity 决定；同一 .app 即使以不同
      WARP_DATA_PROFILE 启动也必须竞争同一个 owner namespace。data profile 只隔离 SQLite、日志与缓存，
      禁止拆分 GUI ownership；不同 bundle/channel app id 仍可并行。
    worker_exclusion: "terminal-server、remote helper、CLI/worker subcommand 不参与 GUI singleton。"

  startup_intent_ipc:
    id: APP-SINGLE-INSTANCE-IPC-02
    capability: "bounded framed startup-intent transport"
    invariant: >-
      singleton owner 与第二启动进程必须通过显式长度帧交换 typed URL intent；listener 的 nonblocking
      accept 策略不得泄漏到 accepted stream 的消息读取语义，也不得依赖 EOF/half-close 判断一条消息结束。
    enforcement_layers:
      framing: "client 先在内存中序列化完整 payload，再发送固定宽度长度头和有上限的 JSON body；server 用 read_exact 读取一帧。"
      accepted_stream: "每个 accepted stream 在读帧前显式恢复 blocking mode，并设置有界 read/write timeout。"
      acknowledgement: "server 只有在完整解帧、解析并入队后才返回 ACK；拒绝帧返回 REJECTED，禁止提前关闭造成 Broken pipe。"
      observability: "server 对 framing、JSON、queue rejection 记录明确原因；client 区分 serialization、payload size 与 transport failure。"
    failure_rule: "owner 已检测到时任何 framing/IPC 错误都 fail-closed；禁止因此启动第二 GUI，也禁止静默丢弃目录/URL intent。"

  startup_owner_before_shared_side_effects:
    id: APP-SINGLE-INSTANCE-SIDE-EFFECT-ORDER-03
    capability: "single-instance ownership before shared process side effects"
    invariant: >-
      release GUI 必须在共享日志初始化、日志轮转、SQLite 预热和其他 owner-only 副作用之前完成 owner claim
      或 startup-intent forwarding；第二启动进程只允许执行无共享副作用的参数解析和 ownership transport。
    enforcement_layers:
      startup_order: "run_internal 对 LaunchMode::App 先执行 pass_startup_args_to_existing_instance，owner 才进入 init_common。"
      logging: "非 owner 禁止调用 warp_logging::init，不能截断、轮转或重新绑定既有 owner 的日志文件。"
      static_check: "presubmit 校验 run_internal 中 singleton claim 的源码顺序严格早于 init_common。"
      runtime: "第二启动退出后 owner 的日志 fd 与当前 ashide.log 保持同一活动日志链，历史内容不被覆盖。"
    failure_rule: "ownership 未决前禁止新增任何写共享目录、注册服务、初始化持久化或启动后台线程的步骤。"

  cross_platform_preinit_singleton:
    id: APP-SINGLE-INSTANCE-CROSS-PLATFORM-04
    capability: "cross-platform fail-closed singleton arbitration before shared initialization"
    invariant: >-
      macOS、Linux、FreeBSD 与 Windows release GUI 都必须在 init_common、logging、SQLite 与后台线程前完成
      owner claim 或 framed startup forwarding；owner 已存在时任何 IPC/协议错误都 fail-closed，禁止继续第二 GUI。
    enforcement_layers:
      shared_entry: "run_internal 通过一个 platform-neutral preinit singleton entry 完成所有 desktop OS arbitration。"
      platform_transport: "各 OS 只实现 claim/forward transport，不决定是否允许 fail-open。"
      static_check: "presubmit 校验所有 platform forwarding 调用严格早于 init_common 且删除 post-init 分支。"
    failure_rule: "除了 NoExistingInstance / update 完成后的新 owner，任何结果都不得进入共享初始化。"

release_build_contracts:
  locked_dependency_graph:
    id: RELEASE-LOCKED-DEPENDENCIES-01
    capability: "reproducible desktop app and remote-helper release builds"
    invariant: >-
      macOS App、Linux helper 与 CLI release 的每个实际 cargo build 都必须消费已提交的 Cargo.lock；
      bundle wrapper 不得在 tag 构建时隐式重新解析依赖。
    enforcement_layers:
      macos_app: "先用 cargo fetch --locked 获取完整锁定依赖图并显式 cargo build --locked，再让 cargo-bundle 以 CARGO_BUNDLE_SKIP_BUILD=1、CARGO_NET_OFFLINE=true 仅基于本地 locked dependency graph 装配 .app。"
      remote_helper: "make_release_helper_artifacts 对每个 musl target 使用 cargo build/zigbuild --locked。"
      ci: "release workflow 只调用上述唯一生产入口，不得复制第二套未锁定构建命令。"
    failure_rule: "Cargo.lock 与 manifest 不一致时发布必须立即失败，禁止临时更新 lockfile 或继续打包旧 binary。"

  offline_bundle_metadata:
    id: RELEASE-BUNDLE-OFFLINE-METADATA-02
    capability: "deterministic cargo-bundle metadata assembly"
    invariant: >-
      macOS bundle 入口必须先显式获取完整 locked dependency graph；主二进制构建完成后，
      cargo-bundle 的 metadata 与 App 装配不得再次访问 registry 或根据网络状态重新解析依赖。
    enforcement_layers:
      fetch: "script/macos/bundle 在构建与装配前执行 cargo fetch --locked。"
      assembly: "cargo-bundle 仅在 CARGO_NET_OFFLINE=true 与 CARGO_BUNDLE_SKIP_BUILD=1 下运行。"
      static_guard: "release_builds_are_reproducibly_locked 同时锁定 fetch、build、skip-build 与 offline assembly 四段合同。"
    failure_rule: "完整 locked graph 缺失时必须在显式 fetch 阶段失败，禁止在 cargo-bundle 内隐式长时间联网或回退未锁定解析。"

  state_driven_macos_dmg:
    id: RELEASE-MACOS-DMG-STATE-03
    capability: "repository-owned state-driven macOS DMG assembly"
    invariant: >-
      macOS DMG 必须由 script/macos/create_ashide_dmg 唯一生产；镜像创建、挂载、收缩和压缩只使用
      diskutil image API，Finder layout 只按可观察状态 readiness 推进，禁止 create-dmg、废弃 hdiutil
      lifecycle API 和无条件固定等待。最终只读 DMG 必须重新挂载并复验结构及持久化布局。
    enforcement_layers:
      image_lifecycle: "RAW APFS 经 diskutil image create blank/attach/resize/create from --format UDZO 完成，并以 --readOnly 重挂最终产物。"
      finder_persistence: ".DS_Store 必须非空、相对配置前 hash 已变化且连续稳定；writable→read-only 重挂验证前先关闭旧 container-window generation，再从最终 .DS_Store 打开；Finder window size 固定为 761×500，但全局 origin 由当前 display/Space 决定且不得进入发布合同；icon position 与 backgroundType 同时复验。"
      atomic_output: "最终只读 Finder 复验未通过时必须删除 OUTPUT_DMG；压缩完成但未验证的镜像不属于 release artifact。"
      contents: "DMG 顶层只允许 Ashide.app、Applications symlink 与 .background，禁止把 staging dmg/ 目录复制进产物。"
      static_guard: "macos_dmg_is_repository_owned_state_driven_and_verified 锁定唯一入口、API、readiness 与最终只读复验。"
    failure_rule: "任何 layout、.DS_Store、Applications link、background 或只读重挂 postcondition 缺失都必须让发布失败。"

  fail_closed_third_party_licenses:
    id: RELEASE-LICENSE-FAIL-CLOSED-04
    capability: "version-pinned fail-closed third-party license generation"
    invariant: >-
      所有 release OS 必须精确使用 cargo-about 0.9.1，并以 --features cli 安装；许可证生成必须覆盖
      workspace、冻结依赖解析并在未知/无法解析许可证时失败，禁止缓存中的旧 cargo-about 或 warning-only
      输出进入发布产物。
    enforcement_layers:
      installer: "Unix、Windows 与 release workflow 都检查精确 cargo-about 0.9.1；不匹配时执行 cargo install --locked --force --features cli cargo-about@0.9.1。"
      generation: "prepare_bundled_resources 在 Unix/Windows 上统一执行 cargo about generate --workspace --frozen --fail。"
      static_guard: "third_party_license_generation_is_version_pinned_and_fail_closed 同时锁定版本、CLI feature 与 fail-closed flags。"
    failure_rule: "版本不精确、生成退出非零或 THIRD_PARTY_LICENSES.txt 缺失/为空时不得继续 bundle。"

  complete_license_dependency_graph:
    id: RELEASE-CROSS-PLATFORM-LICENSE-GRAPH-07
    capability: "cross-platform complete license dependency graph"
    invariant: >-
      Unix 与 Windows 的唯一 bundled-resource 入口必须在 frozen cargo-about 读取完整 workspace metadata 前执行
      cargo fetch --locked；release workflow 不得依赖前序 target/feature build 偶然下载的依赖子集。
    enforcement_layers:
      resource_entrypoint: "script/prepare_bundled_resources 与 script/windows/prepare_bundled_resources.ps1 在 license generation 内共同拥有 locked fetch。"
      offline_generation: "fetch 成功后才允许 cargo about generate --workspace --frozen --fail；fetch 或 generation 任一失败立即终止 bundle。"
      static_guard: "complete_license_dependency_graph_is_fetched_by_resource_entrypoints 锁定 Unix/Windows 两个入口的 fetch-before-generate 顺序。"
    failure_rule: "clean runner 缓存不完整时必须由资源入口补齐 locked graph；禁止在 workflow 临时补命令或放宽 --frozen。"

  platform_complete_remote_helper_assets:
    id: RELEASE-REMOTE-HELPER-PLATFORM-MATRIX-05
    capability: "platform-complete remote-helper release assets"
    invariant: >-
      RemotePlatform 接受的每个 OS/arch 组合都必须由唯一 helper 生产入口从当前 checkout 显式构建，
      并出现在 release workflow 上传清单与最终 SHA256SUMS 中；禁止从碰巧存在的 App、旧 target
      或 /Applications 二进制推断 helper 产物。
    enforcement_layers:
      platform_matrix: "Linux 与 macOS 各自生产 x86_64/aarch64 两个 helper；不支持的平台在参数解析阶段显式失败。"
      build_ownership: "script/make_release_helper_artifacts 对每个 target 执行带 --locked 的 cargo build/zigbuild，输出只来自专用 target/release-helper。"
      workflow: "Linux 与 macOS job 都调用同一脚本并上传各自双架构 tarball；upload-release 对所有最终主资产重新生成完整 SHA256SUMS。"
      static_guard: "presubmit 同时锁定 RemoteOs/RemoteArch 支持矩阵、脚本 target 矩阵、CI 上传清单、禁止 stale binary fallback 与最终 checksum 聚合。"
    failure_rule: "任一 runtime 可探测平台缺少 release 资产、checksum 未覆盖或 helper 不是当前 checkout 的显式 locked build 时，发布必须失败。"

  semantic_release_helper_static_guard:
    id: RELEASE-HELPER-STATIC-GUARD-08
    capability: "format-independent release-helper static guard"
    invariant: >-
      release helper 合同测试必须分别验证每个受支持 target 的显式 build 调用，不得把 shell 缩进、相邻布局或格式化结果
      当作行为合同；脚本重排但 target 集不变时测试保持稳定，任一 target 调用删除时测试失败。
    enforcement_layers:
      semantic_assertions: "Rust 合同测试分别匹配 Linux x86_64 与 aarch64 build invocation。"
      parity_guard: "script/check_local_remote_parity 锁定两个独立断言，禁止恢复 whitespace-coupled multiline match。"
    failure_rule: "静态测试不得因合法缩进失败，也不得用一个脆弱的连续字符串替代逐 target 资产检查。"

  source_ref_product_version_separation:
    id: RELEASE-SOURCE-REF-PRODUCT-VERSION-14
    capability: "independent release source and product version identities"
    invariant: >-
      release workflow 的 checkout source ref 与产品 release tag 是两个独立身份：workflow_dispatch 必须始终以
      inputs.tag 作为产品版本，即使当前 source ref 本身是 candidate tag；正式 v* push 才以 github.ref_name
      作为产品版本。candidate/branch/commit source 名禁止进入 plist、installer、artifact 或 GitHub Release identity。
    enforcement_layers:
      source_identity: "SOURCE_REF 只记录 github.ref，用于审计实际 checkout 来源，不参与产品版本生成。"
      product_identity: "RELEASE_TAG 按 event_name 选择 workflow_dispatch inputs.tag 或正式 tag push 的 github.ref_name；concurrency 也按同一产品身份串行化。"
      fail_fast: "独立 validate-release-identity job 在任何跨平台长编译前验证 vMAJOR.MINOR.PATCH，并让三个 build job 显式依赖该 gate。"
      static_guard: "Rust workflow contract test 与 parity checker 锁定事件分支表达式、SOURCE_REF 分离、前置 validation dependency，并禁止恢复 ref_type 优先表达式。"
    failure_rule: "source ref 与产品版本再次混用、非 semver 产品 tag 进入构建、或长编译可绕过 identity validation 时，发布合同失败。"

  unsigned_macos_bundle_seal:
    id: RELEASE-MACOS-UNSIGNED-BUNDLE-SEAL-17
    capability: "complete macOS app bundle seal without Developer ID credentials"
    invariant: >-
      macOS release runner 未配置 Developer ID/notarization secrets 时，--nosign 只能跳过 Developer ID 与 Apple notarization，
      不能跳过 .app bundle seal。最终 App 必须以完整 ad-hoc bundle signature 绑定 Info.plist、主 executable 与 Resources；
      禁止把 linker-signed 主 Mach-O 与未 sealed resources 组合成半签名 App 后打入 DMG。
    enforcement_layers:
      assembly: "script/macos/bundle 在 CODESIGN=false 且 SELFSIGN=false 的 app 路径执行 codesign --force --deep --sign - --timestamp=none。"
      postcondition: "所有 app 签名模式在创建 DMG 前统一执行 codesign --verify --deep --strict --verbose=4。"
      packaging_gate: "script/make_release_artifacts 在读取版本并打包 DMG/ZIP 前再次验证最终 APP_BUNDLE，失败立即终止发布。"
      static_guard: "Rust release contract test 与 parity checker 锁定 ad-hoc seal、统一 postcondition、packaging fail-closed 和 workflow 日志语义。"
    failure_rule: "App 只有 linker ad-hoc executable signature、Info.plist not bound、Sealed Resources=none 或 codesign strict verify 非零时，禁止生成或上传 macOS release artifact。"

  public_macos_distribution_identity:
    id: RELEASE-MACOS-DMG-OPTIONAL-SIGNING-66
    capability: "Developer ID signed, notarized and Gatekeeper-accepted public macOS distribution"
    invariant: >-
      完整 ad-hoc bundle seal 只证明开发产物内部完整，不能证明其可公开分发。任何 tag push 或
      upload_to_release=true 的 macOS App 必须由显式 Developer ID Application identity 签名并启用 hardened runtime，
      DMG 必须经 Apple notarization、stapling 与 stapler validation，App 和 DMG 必须分别通过 Gatekeeper assessment；
      local/dev 非发布构建才允许显式 --nosign。禁止把 codesign --verify 成功当成公开发布授权。
    enforcement_layers:
      credential_owner: "Developer ID certificate/password、临时 keychain password、Apple ID app password 与 Team ID 全部来自 GitHub Actions secrets；bundle、entitlements 与 runtime 禁止硬编码 Team ID、猜 signing identity 或用本机配置代填。"
      workflow_gate: "release workflow 在长编译前要求六项 macOS signing/notarization secrets 全部存在；缺失或部分配置立即失败，tag/public upload 禁止追加 --nosign。"
      bundle_postcondition: "script/macos/bundle 从导入 keychain 中解析唯一且 Team ID 匹配的 Developer ID Application identity，签名后验证 Authority、TeamIdentifier、runtime flag、App Gatekeeper、DMG notarization ticket 与 DMG Gatekeeper。"
      runtime_authority: "无 App Extension 共享需求的 local-first App 不声明 App Group entitlement，也不维护 Team-ID-prefixed secure-state 路径；非 OSS 自动更新从当前运行 bundle 的真实签名读取 TeamIdentifier，并用它验证 staged App，禁止编译期常量。"
      packaging_gate: "script/make_release_artifacts 对 oss/stable/preview App 重跑 Developer ID identity、hardened runtime、stapler 与 App/DMG Gatekeeper postcondition，任一失败禁止复制到 target/release-artifacts。"
      publish_gate: "GitHub Release upload job 只能依赖通过上述 postcondition 的 macOS artifact job；公开转换前仍须下载远程 DMG 做同一 Gatekeeper 验证。"
      static_guard: "Rust contract test 与 parity checker 锁定六项 secret、零 ad-hoc public fallback、目标配置 Team ID、Developer ID/runtime/notarization/stapling/Gatekeeper 双层验证。"
    failure_rule: >-
      缺少任一凭据、Team ID/identity 在脚本/entitlements/runtime 中硬编码、Authority 不是 Developer ID Application、TeamIdentifier 不匹配、
      runtime flag 缺失、notarization/stapling 无票据或 spctl 拒绝 App/DMG 时，正式 macOS Release 必须 fail closed 并保持 Draft。

  dynamic_search_source_current_query:
    id: SEARCH-DYNAMIC-SOURCE-CURRENT-QUERY-09
    capability: "generation-owned dynamic search source registration"
    invariant: >-
      SearchMixer 已存在 current query 时，后注册且匹配该 query 的 async source 必须立即参与同一 generation；
      禁止依赖用户再次输入、机器负载或 source 恰好在 view 创建前初始化。旧可见结果可按原子提交策略保留，
      但在新 source 完成或 initial timeout 提交前不得把旧 query 的可见结果标记为 current-query committed，也不得接受旧 selection。
      新 source 的结果必须由当前 query ownership 驱动并受后续 generation abort 约束。
    enforcement_layers:
      mixer_contract: "add_async_source 注册完成后统一检查 current query/filter；已提交 query 重新建立 pending buffer/readiness，保留旧结果仅作视觉占位，再通过 run_query_internal 启动匹配 source。"
      lifecycle: "HistoryEvent::Initialized 只负责注册 history source；是否补跑当前 query 由 SearchMixer 统一保证，CommandSearchView 不维护第二套时序分支。"
      selection_guard: "CommandSearchView 只在 mixer 确认 visible results 已提交给 current query 后接受 selection；旧 query 结果即使仍显示也不可执行。"
      regression: "mixer unit tests 固定 query-before-source、已提交结果保留但 readiness 重开；history integration tests 覆盖 histfile/SQLite enrichment 与 workflow metadata。"
      static_guard: "parity checker 锁定 mixer current-query hook、current-query commit predicate、selection guard、确定性单测与 LR-100 tracker/matrix。"
    failure_rule: "动态 source 晚到后 current query 没有自动执行、旧结果仍被当作当前 query 接受、或只能靠额外按键/测试串行化恢复时，视为产品行为失败。"

  environment_runtime_remote_session_cache:
    id: ENV-RUNTIME-REMOTE-SESSION-CACHE-18
    capability: "environment runtime remote session cache"
    invariant: >-
      Remote environment sessions live only in the remote authority's runtime-scoped indexed cache.
      The local app must not persist a second copy of remote session history, and disconnect must
      clear the authority cache so reconnect performs fresh remote discovery instead of replaying
      stale remote rows from local storage.
    enforcement_layers:
      authority_scope: "EnvironmentTable and SessionNavigator partition remote rows by authority only while the remote authority is connected."
      disconnect_semantics: "disconnect_environment_runtime_state clears the authority-scoped indexed cache before releasing the retained runtime owner."
      reconnect_semantics: "reconnect_retained_environment_runtime_authority resolves transport through the committed SshTargetCatalog, then re-discovers remote rows into the same authority partition."
      local_store_boundary: "No local persistence layer may materialize or mirror remote session rows as a long-lived local source of truth."
      runtime_only: "Remote session rows are projected only while the remote authority is connected and remain part of the runtime cache contract, not the local data model."
    failure_rule: "If remote rows survive a disconnect as a local persistent copy, reconnect bypasses the committed transport catalog, or reconnect does not perform a fresh remote discovery into the authority-scoped runtime cache, the contract fails."

  current_frame_interaction_position:
    id: UI-INTERACTION-CURRENT-FRAME-10
    capability: "current-scene ownership for saved-position interaction"
    invariant: >-
      SavedPosition 的长期几何缓存可继续服务布局锚点，但任何模拟指针交互与交互 readiness 必须只接受最新完成场景中
      实际 paint 的 position id；元素从渲染树消失后，旧坐标不得继续被点击并把事件误路由到父级或重用坐标处的新元素。
    enforcement_layers:
      position_cache: "每次 Presenter build_scene 开始新 frame ownership，paint 时登记本帧 position id，同时保留既有长期几何查询语义。"
      integration_driver: "WithSavedPosition、WithSavedPositionFn 与 saved-position readiness 统一查询 current-frame position，不得读取仅存于历史 committed cache 的目标。"
      regression: "PositionCache 单测证明长期坐标跨帧仍可查询，但未在新场景 paint 时不再具备 pointer-interaction 资格。"
    failure_rule: "测试或自动化若能点击未在最新场景 paint 的 stale position，或用菜单 model-open 代替实际元素 paint readiness，则合同失败。"

  explicit_negative_interaction_geometry:
    id: UI-NEGATIVE-INTERACTION-GEOMETRY-11
    capability: "explicit geometry ownership for negative pointer tests"
    invariant: >-
      普通 saved-position 点击只能命中最新完成场景中的交互目标。只有当负向测试明确验证“目标消失后，原屏幕坐标不再触发该目标”时，
      才能通过单独命名的 API 读取最后一次 committed geometry；该 API 不得作为等待慢渲染、绕过 readiness 或恢复 stale target 的通用 fallback。
    enforcement_layers:
      typed_event: "IntegrationTestEvent 携带 SavedPositionRequirement，默认构造器固定为 CurrentScene，负向几何复用必须显式选择 LastCommittedGeometry。"
      narrow_entry: "with_click_on_last_committed_saved_position 的名称、文档和唯一调用点都表明它只用于元素已故意失效后的负向断言。"
      regression: "safe-mode 测试先建立 secret cell 几何，再禁用 secret interaction，点击同一屏幕点并断言 tooltip 仍关闭；普通 prompt/menu 测试继续受 current-scene guard 约束。"
      static_guard: "parity checker 锁定 typed requirement、窄入口、safe-mode 负向用例与 LR-102 tracker/matrix。"
    failure_rule: "若普通 pointer helper 可读取历史 geometry，或负向 helper 被用作等待/重试/交互 readiness fallback，则合同失败。"

  nonempty_pointer_hit_geometry:
    id: UI-INTERACTION-NONEMPTY-HIT-12
    capability: "non-empty current-scene geometry before pointer dispatch"
    invariant: >-
      position id 在当前场景出现只证明元素参与了 paint，不证明其异步布局已产生可命中的面积。所有 saved-position pointer dispatch 与 readiness
      必须同时要求 current-scene ownership、正 width 和正 height；零面积中心点不得被派发到相邻或底层元素。
    enforcement_layers:
      position_cache: "interactive_position_painted_in_current_frame 在 current-scene ownership 之上统一过滤零宽或零高矩形。"
      integration_driver: "普通 click/right-click/hover 与 saved-position readiness 只调用 interactive position API，不各自复制几何判断。"
      regression: "PositionCache 单测固定零面积 position 已 paint 但不可交互；prompt context-menu integration test 在高负载下等待 prompt 完成布局后才右键。"
      static_guard: "parity checker 锁定 interactive API、统一调用点、零面积回归与 LR-103 tracker/matrix。"
    failure_rule: "若自动化可向零面积 saved position 派发 pointer event，或 current-frame presence 被直接当作 hit readiness，则合同失败。"

  retryable_layout_assertions:
    id: UI-ASYNC-LAYOUT-ASSERTION-13
    capability: "retryable assertions for asynchronously committed layout"
    invariant: >-
      integration assertion callback 中读取窗口、pane 或 element layout 时，未完成布局必须返回 AssertionOutcome::Failure 以驱动下一帧，
      禁止使用 panic 型近似断言把暂态零尺寸变成不可重试的测试失败。
    enforcement_layers:
      assertion_contract: "布局断言使用 async_assert 返回 retryable outcome；driver 在失败后统一 maybe_render_frame，直至提交布局或真实 deadline。"
      source_guard: "integration 测试源禁止 assert_approx_eq!；近似布局判断必须显式表达 epsilon 并返回 AssertionOutcome。"
      regression: "Agent Mode minimum width 与 custom window size tests 覆盖 entity 已创建但 layout 尚未提交的阶段。"
      static_guard: "parity checker 禁止 integration 测试中的 panic 型 approximate assertion，并锁定 LR-104 tracker/matrix。"
    failure_rule: "若异步 layout assertion 在 deadline 前因暂态值 panic，或通过 sleep/固定等待代替 frame-driven retry，则合同失败。"

  signal_target_readiness:
    id: TEST-SIGNAL-TARGET-READINESS-15
    capability: "process-owned readiness before terminal signal assertions"
    invariant: >-
      integration test 向前台命令发送 Ctrl-C 等终端信号前，必须由实际信号目标在安装 handler 后输出唯一 readiness marker；
      shell Preexec、BlockState::Executing、long-running UI 状态与 input focus 都不是 foreground process 已可接收信号的充分证据。
    enforcement_layers:
      target_protocol: "测试命令在子 shell 内先安装 SIGINT trap，再输出 CTRL_C_READY_MARKER，随后进入无界工作循环。"
      event_order: "Run step 必须先观察 active block 的 marker 与 executing/long-running 状态，后续 step 才允许派发 Ctrl-C。"
      forbidden_masking: "禁止用固定 sleep、放宽 step timeout、nextest retry 或串行化掩盖 Preexec→foreground readiness 窗口。"
      static_guard: "parity checker 锁定 marker、trap-before-marker 顺序、active output assertion，并禁止 test_ctrl_c 恢复 sleep 999。"
    failure_rule: "若信号可在目标自证 readiness 前派发，或测试只能靠时间/重试稳定，则终端 signal lifecycle 合同失败。"

  declared_ci_static_check_toolchain:
    id: RELEASE-CI-STATIC-CHECK-TOOLCHAIN-06
    capability: "repository-declared static-check toolchain"
    invariant: >-
      clean Linux CI 与本地开发必须通过同一 repository-owned dependency 入口获得 parity checker
      所需工具；checker 启动时先验证全部非 POSIX 依赖，禁止把 command not found 扩散为大量伪合同缺失。
    enforcement_layers:
      provisioning: "script/linux/install_build_deps 显式安装 ripgrep；CI 只调用该统一依赖入口，不维护第二份隐式工具清单。"
      fail_fast: "script/check_local_remote_parity 在执行任何合同搜索前验证 rg 与 python3，缺失时只报告精确 toolchain error 并立即退出。"
      static_guard: "checker 自身锁定 spec、tracker、capability matrix、Linux dependency marker 与 required_commands marker。"
    failure_rule: "clean checkout 缺少 checker 依赖或统一依赖入口删除该工具时，CI 必须以单一明确错误失败；禁止继续输出伪 parity violation。"

  generated_macos_plist:
    id: RELEASE-BUNDLE-PLIST-CONTRACT-01
    capability: "generated macOS App Info.plist contract"
    invariant: >-
      进程生命周期护栏必须存在于 cargo-bundle 最终生成的主 App Info.plist；CLI plist、开发运行模板和
      binary 内嵌 plist 都不能替代 release bundle 的实际产物合同。
    enforcement_layers:
      assembly: "script/macos/bundle 在 normalize_cargo_bundle_app 中写入 LSMultipleInstancesProhibited=true。"
      postcondition: "资源装配完成、codesign 前重新读取最终 Info.plist；缺失或非 true 时发布立即失败。"
      static_guard: "Rust contract test 与 local/remote parity check 都必须覆盖主 bundle 的唯一装配脚本。"
    failure_rule: "禁止仅因模板 plist 含目标 key 就判定通过；最终 .app 未满足合同即视为 release 构建失败。"

filesystem_contracts:
  symlink_transfer:
    id: LR-FILE-TRANSFER-SYMLINK-01
    capability: "file byte transfer without link-preserving protocol"
    invariant: >-
      只要协议不能表达 readlink/create-symlink，所有 upload/download 入口都必须拒绝
      symlink inode；禁止把 link 静默降级成 target bytes，也禁止覆盖目标路径上的 symlink。
    enforcement_layers:
      ui_planning: "Workspace File Browser 与 SFTP Browser 在创建 transfer task 前拒绝 symlink。"
      backend_boundary: >-
        SftpBackend 与 Workspace File Browser 的实际 source/destination open 再次校验 lexical inode；
        Unix 文件句柄使用 O_NOFOLLOW，destination 任一已存在 ancestor 为 symlink 时整体拒绝。
      remote_protocol: "ReadFileChunk/WriteFileChunk 在 helper 端 lstat 末级路径并拒绝 symlink，不能依赖客户端自律。"
      remote_conflict: >-
        远端目标为 symlink 时不得进入 Overwrite；staging promotion 在最终 mv 前重新检查 final path，
        禁止规划后替换绕过。
    lexical_identity: "导航可跟随 symlink-to-directory，但 mutation 和 transfer capability 始终读取 link inode kind。"
    destination_rule: "上传目标已存在且为 symlink 时必须失败；禁止 OpenOptions 跟随链接覆盖 target。"
    future_extension: "若要支持 symlink 传输，先新增类型化 ReadLink/CreateSymlink RPC，再开放 UI capability。"

  atomic_directory_tree_reload:
    id: LR-FILE-TREE-ATOMIC-01
    capability: "atomic expanded directory tree reload"
    invariant: >-
      File Browser 的 root listing 与所有待恢复 expanded child listing 是同一个 snapshot transaction；
      只有全部目录成功时才能替换 UI tree，任一 child Error 都必须保留旧 snapshot。
    enforcement_layers:
      fetch: "reload_directory_tree 对 root 与 expanded child 使用同一 Result 链，禁止吞掉 child error。"
      commit: "finish_directory_reload 只接收完整 DirectoryTreeReload；Error 只更新错误状态，不提交 partial rows/expanded set。"
      extension_rule: "若未来需要 partial tree，必须新增显式 partial snapshot 与逐目录 error，不能复用 Success。"
    ordering: "成功 snapshot 内各目录仍使用唯一共享排序规则；原子性不得通过重排或删除失败 subtree 伪造。"

  complete_directory_listing:
    id: LR-FILE-LIST-COMPLETE-01
    capability: "directory listing snapshot"
    invariant: >-
      目录枚举的 Success 必须代表完整、可解释的 lexical snapshot；任何 iterator、file_type
      或 lexical metadata 错误都必须返回显式 Error，禁止静默跳过 entry 或伪造降级 metadata。
    enforcement_layers:
      local_backend: "Terminal/InMemory/SFTP backend 保持 fail-closed：read_dir entry 与 symlink_metadata 错误直接失败。"
      remote_helper: "ListDirectory 通过统一 collector 收集全部 entry；不得使用 read_dir.flatten/filter_map(Result::ok)。"
      lexical_symlink: "symlink inode metadata 与 target metadata 分离；broken/不可达 target 只映射 target_kind，不能删除 lexical row。"
    ordering: "只有完整收集成功后才按 name 排序并返回 Success。"
    extension_rule: "需要 best-effort listing 时必须新增显式 partial-result 协议和逐项 error，不得复用 Success。"

  lexical_symlink_rename:
    id: LR-FILE-SYMLINK-RENAME-01
    capability: "filesystem watcher lexical rename projection"
    invariant: >-
      watcher 对 rename source/destination 的存在性判断必须观察路径自身 inode，而不是跟随
      symlink target；dangling symlink 的新 lexical path 必须被归类为 added，旧 lexical path
      必须被归类为 deleted，禁止等待完整重扫才能恢复 row。
    enforcement_layers:
      watcher_boundary: "RenameMode::Any 只允许通过统一 lexical path state resolver 分类；禁止使用 Path::exists、metadata 或 canonicalize。"
      incremental_projection: "同一 rename debounce batch 必须把 old lexical path 移除并插入 new lexical path；Project Explorer 不得短暂或永久丢失 link row。"
      repository_metadata: "增量 upsert 必须使用 symlink_metadata 重建 Entry::Symlink，并保留 SymlinkTargetKind::Missing。"
    error_rule: >-
      lexical metadata 的 NotFound 表示 Missing；其他错误属于 Unknown，必须显式中止该批归一化并记录错误，
      禁止把不可判定状态静默降级成 delete。
    identity_rule: "directory symlink rename 后仍保持 link inode identity 与新的 lexical children namespace，不得切换到 canonical target namespace。"

remote_protocol_contracts:
  required_oneof_result:
    id: LR-REMOTE-REQUIRED-RESULT-01
    capability: "remote helper request/response outcome"
    invariant: >-
      proto response 一旦声明 oneof result，该 result 就是 required outcome；缺失 result
      是协议破坏，不是成功、未找到、已保存或幂等完成。
    enforcement_layers:
      transport_boundary: "RemoteServerClient::send_request 在把 response 交给任何业务方法前统一拒绝缺失的 required result。"
      application_boundary: "业务转换函数仍穷尽匹配 Success/Error/None，None 只允许映射为显式错误，禁止领域默认值。"
      static_contract: "静态检查从 proto 枚举所有 oneof result response，并要求 transport validator 覆盖；同时禁止 None 与 Success 共用成功分支。"
    error_mapping: "缺失 result 统一返回 ClientError::UnexpectedResponse；server 返回的显式 error result 保留原领域错误。"
    extension_rule: "新增 oneof result response 时必须同步进入 transport validator 和 contract test，否则 presubmit 失败。"

  typed_resolve_path_result:
    id: LR-REMOTE-RESOLVE-PATH-RESULT-02
    capability: "typed remote path existence outcome"
    invariant: >-
      ResolvePath 必须穷尽区分 Success、NotFound、Error 与缺失 result；只有 helper 明确返回 NotFound
      才能映射为 Option::None，permission、I/O 与协议错误必须保留为 Err。
    enforcement_layers:
      protocol: "ResolvePathResponse oneof 提供独立 not_found variant，禁止用 FileOperationError 文本猜测不存在。"
      helper: "symlink_metadata 的 ErrorKind::NotFound 映射 NotFound；其他 io::Error 映射 Error。"
      client: "Success→Some、NotFound→None、Error→Err、None→UnexpectedResponse，match 必须穷尽。"
      consumer: "upload conflict scan 只把 typed NotFound 当作可创建目标，其他失败中止 mutation。"
    failure_rule: "任何无法分类的 response 都 fail-closed，禁止为了继续上传而伪装目标不存在。"

session_consistency_contracts:
  source_authority_locator:
    id: SESSION-SOURCE-AUTHORITY-01
    capability: "authority-bound CLI-agent source locator"
    invariant: >-
      远程 CLI-agent source identity 必须作为 authority、agent、source 与 provider session id 的不可拆 typed locator 传播；
      encoded authority 与 snapshot authority 不一致时读取和删除都必须 fail-closed。
    enforcement_layers:
      parser: "source id 解码一次并返回 typed locator，禁止解析后丢弃 authority。"
      mutation: "read/delete executor 只消费 locator 自带 authority，禁止由当前 UI snapshot 覆盖。"
    failure_rule: "authority 不一致、缺失或不可解析时不得发起远程文件操作。"

  canonical_codex_ingress:
    id: SESSION-CODEX-CANONICAL-INGRESS-02
    capability: "canonical Codex identity at every ingress"
    invariant: >-
      OSC/plugin、scan、SessionBridge reader 与 persistence 进入 live model 或 IR 前必须共享 canonical UUID validator；
      expected provider id 与 transcript session_meta id 不一致时必须报错。
    enforcement_layers:
      ingress: "所有 event/apply/read 路径在 mutation 前 canonicalize。"
      reader: "expected id 与 transcript id 做 canonical equality check，禁止静默覆盖。"
    failure_rule: "非 canonical 或 mismatch 的 Codex id 不得进入 pane binding、SessionIr 或 resume command。"

  complete_remote_session_scan:
    id: SESSION-REMOTE-SCAN-ATOMIC-03
    capability: "complete-or-error remote CLI-agent scan"
    invariant: >-
      remote scan Success 中每条 record 都是 required outcome；任何 malformed record 使整个 scan 失败并保留旧 cache，
      禁止 filter_map 静默提交部分列表。
    enforcement_layers:
      decoder: "record decoding 返回 Result<Vec<_>> 并保留精确字段错误。"
      cache: "只有完整 Success 才替换 authority cache。"
    failure_rule: "缺失 agent/source/id 等 required field 时返回 typed error。"

  remote_native_append:
    id: SESSION-REMOTE-APPEND-04
    capability: "owning-host atomic append for native sessions"
    invariant: >-
      remote native Append 必须由 owning host 以 O_APPEND/server-side append 原子执行；禁止 client read-modify-truncate，
      并发 provider 写入不得丢失。
    enforcement_layers:
      protocol: "append 是独立 typed operation，不复用 whole-file write。"
      executor: "helper 打开一次并 append_all，不读取或重写既有 bytes。"
    failure_rule: "helper 不支持原子 append 时显式失败，禁止降级为 read+rewrite。"

  single_native_write_plan:
    id: SESSION-NATIVE-WRITER-PLAN-05
    capability: "single deterministic native session write plan"
    invariant: >-
      Codex 与 Claude 每种格式只能有一个 deterministic write-plan builder；local/remote 仅 executor 不同，
      version、registry enrichment、backup、验证与 rollback 语义不得漂移。
    enforcement_layers:
      planner: "local 与 remote 都先生成同一 NativeSessionWritePlan。"
      executor: "本地和远程 executor 对同一 operation 集执行并报告逐项结果。"
    failure_rule: "禁止保留直接本地 writer 与 remote planner 两套格式生成器。"

  canonical_action_authority:
    id: SESSION-ACTION-AUTHORITY-CANONICAL-21
    capability: "canonical Environment authority on every Session Navigator action"
    invariant: >-
      WorkspaceSessionActionTarget 在创建时必须把缺失的 snapshot authority 规范化为 TerminalBootstrap canonical authority；
      action matching、rename、pin、delete、resume 与 context menu 只比较显式 authority，禁止在 Navigator 高层把 None 再解释为 local。
    enforcement_layers:
      target: "WorkspaceSessionActionTarget.environment_authority_key 是非 Optional canonical authority。"
      projection: "所有 row/action target 通过同一 constructor 从 snapshot authority 生成 canonical authority。"
      matching: "workspace_session_matches_action_target 只调用共享 session_authority_matches，不包含 local/runtime/legacy 分支。"
    failure_rule: "authority-less action、None-as-local compatibility 或 id-only wildcard matching 必须静态失败。"

environment_runtime_contracts:
  authority_capability_restore_dispatch:
    id: ENV-RUNTIME-RESTORE-DISPATCH-01
    capability: "typed authority restore backend dispatch"
    invariant: >-
      restore backend 只能由 typed authority capability 决定；只有 TerminalBootstrap 可创建 current-app terminal，
      SavedSsh/Runtime 缺 materializer 时保留 virtual row 并显式失败。
    failure_rule: "runtime_connection_ref 只能作为 transport enrichment，禁止充当 backend discriminator。"

  pane_owned_intent_retry:
    id: ENV-RUNTIME-INTENT-RETRY-02
    capability: "retryable pane-owned runtime restore intent"
    invariant: >-
      reconnect/helper/bootstrap failure 必须保留 pane-owned restore intent、startup command、selection 与 durable identity；
      只有 pane/tab 明确取消或成功 commit 才能消费 intent。
    failure_rule: "authority transport failure 禁止 authority-wide drain pending intents。"

  all_close_path_retiring_lease:
    id: ENV-RUNTIME-RETIRING-LEASE-03
    capability: "retiring durable ownership on every close path"
    invariant: >-
      window、tab、pane、hidden/undoable close 都必须在 terminal model exit 前持有 app-wide Retiring lease；
      undo-retained close 不得 shutdown PTY，restore 必须按 durable identity + terminal entity 取消 lease；
      permanent close 或 undo discard/expiry 必须显式 shutdown PTY，并继续持有 lease 直到 model exit。
    failure_rule: "UI 容器 detach 不等于 process ownership 释放；保留 undo 的 detach 也不等于 permanent process shutdown。"

  single_environment_delivery_home:
    id: ENV-ENTRY-DELIVERY-HOME-04
    capability: "single EnvironmentBackend delivery home"
    invariant: >-
      plain terminal、restored conversation、fork/new-tab 等行为层只构造 intent 并调用 EnvironmentBackend；
      local 同步 spawn 与 runtime 异步 materialize 的差异只能存在于 backend deliver 层。
    failure_rule: "调用点禁止自行 if local/remote 或直接调用 runtime 专用 open 入口。"


  shared_navigation_container_activation:
    id: ENV-NAVIGATION-BACKEND-22
    capability: "shared EnvironmentBackend navigation-container activation"
    invariant: >-
      delete 后重选、SplitPane conversation restore 与其他需要激活目标 Environment 的行为层只提交 canonical authority/snapshot；
      TerminalBootstrap 创建或激活 current-app container、Runtime 激活或重建 inert placeholder 的差异只存在于 EnvironmentBackend；
      Session Navigator historical Conversation 激活不得指定 NewTab override，必须复用共享 conversation layout preference。
    enforcement_layers:
      snapshot: "产品 action 只调用 EnvironmentTable.entry_target_snapshot，禁止自行按 local/runtime 重建 EnvironmentSnapshot。"
      activation: "EnvironmentBackend.activate_navigation_container 是唯一 backend 分叉；Navigator 和 conversation restore 不判断 uses_terminal_bootstrap。"
      split_delivery: "SplitPane restore 在 local/runtime 都复用目标 Environment tab，只新增一个 pane；runtime connecting carrier 只能排队 ForkedConversation，不得生成 PlainTerminal intent。"
      layout_selection: "Session Navigator historical Conversation 激活把 restore_layout 留空，由 restore_or_navigate_to_conversation 读取用户 preference；禁止调用方硬编码 NewTab。"
      side_effects: "激活 navigation container 不隐式排队 replacement runtime terminal；后续 entry delivery 仍由显式 intent 决定。"
    failure_rule: "Navigator delete hook、conversation restore 或其他行为层出现 local/runtime activation branch，或 Navigator Conversation 入口硬编码 NewTab 时静态失败。"

  typed_authority_construction:
    id: ENV-AUTHORITY-CONSTRUCTION-05
    capability: "single typed Environment authority construction"
    invariant: >-
      authority parse 与 construction 都只能由 environment_authority.rs 的 typed API 提供；SFTP/runtime lookup 禁止手拼 ssh:{node_id}。
    failure_rule: "raw prefix format/parse 出现在共享 home 外时静态门禁失败。"

  explicit_failed_environment_reselection:
    id: ENV-RUNTIME-ERROR-RESELECT-06
    capability: "explicit retry when a failed runtime Environment is reselected"
    invariant: >-
      runtime Environment 进入 Error 后不得由后台 render、restore 或 browser unavailable 事件隐式重试；
      但用户通过 Environment Strip 的 SwitchEnvironment、键盘标签切换或 Session Navigator 显式重新激活该 Environment 时，
      必须把这次 activation 解释为 reconnect intent，推进同一 Environment transport owner 的新 connection generation，
      不得替换 owner SessionId 或丢失其 terminal alias graph。
    enforcement_layers:
      restore_boundary: "EnvironmentTable::from_snapshot 必须保留持久化 Error；仅 Connected/Connecting/Installing 的无 transport 冷恢复降为 Dormant。"
      activation_gateway: "所有用户可见 tab/Environment 导航统一调用 activate_tab_for_user_visible_navigation；SwitchEnvironment 禁止手写 queue/ensure/open 序列。"
      activation_boundary: "prepare_active_environment_after_visible_tab_activation 在 Error 状态调用唯一 reconnect_environment_runtime_authority，不走普通 implicit ensure。"
      implicit_boundary: "ensure_current_environment_runtime_transport_if_needed 继续拒绝 Error 的后台自动重试，避免失败循环。"
      state_machine: "同一 retained Environment 的 reconnect 必须保留 environment-owned SessionId，只推进 heartbeat/preparation/transport generation 并忽略旧 generation 的晚到结果；只有显式 teardown 后的新 Environment owner 才能分配新 SessionId。"
    failure_rule: "UI 若提示重新选中即可恢复，则 Local→failed remote 后仍停留 Error 属于状态机破坏；禁止要求重启 App 或删除持久化状态。"

  stable_environment_runtime_reconnect_owner:
    id: ENV-RUNTIME-RECONNECT-OWNER-54
    capability: "stable Environment transport owner across reconnect"
    invariant: >-
      retained Environment 的 synthetic SessionId 是 transport、terminal aliases、execution contexts、host binding 与 pending operations 的共同 owner identity；
      heartbeat、显式重新激活、client unavailable 和 transport disconnect 触发 reconnect 时必须保留该 identity。
      reconnect 只替换 transport resources 与 connection generation，不得 deregister owner、删除 alias registry 或分配 replacement owner。
    enforcement_layers:
      owner: "EnvironmentTable.synthetic_session_id 在 retained reconnect 全程保持不变；只有显式 Environment teardown 才清除。"
      transport: "RemoteServerManager 在同一 canonical owner 下重启/重连 transport，并保留 SessionExecutionRegistry owner + aliases。"
      projection: "Workspace、Project Explorer、FileModel 与 Navigator 始终携带原 exact SessionId；高层禁止猜测 newest/active owner。"
      cleanup: "显式 disconnect 才原子删除 owner、全部 aliases、execution contexts、host index 与 pending operations。"
    failure_rule: "reconnect 中调用 owner deregistration、clear_runtime_handle 后重新分配 SessionId，或让旧 live alias 失去 client/host resolution，均为模型破坏。"

  typed_environment_runtime_heartbeat:
    id: ENV-RUNTIME-HEARTBEAT-LIVENESS-55
    capability: "transport liveness is distinct from target command execution"
    invariant: >-
      Environment heartbeat 只能根据 transport/client liveness 或明确的 disconnected protocol error 驱动 reconnect；
      target shell command 的非零退出、cwd 删除、权限错误、SESSION_NOT_FOUND 与其他 execution-domain failure 必须保持 typed semantics，
      不得被字符串化后统一解释为 transport disconnect。
    enforcement_layers:
      protocol: "heartbeat 结果必须保留 transport failure 与 RunCommand response failure 的类型边界。"
      lifecycle: "只有 disconnected/closed transport 进入 reconnect；execution failure 保留 owner、aliases、client、host 与 canonical projection。"
      root_recovery: "cwd/root 不存在时由 root/path lifecycle 显式处理，不得通过 replacement transport owner 伪装恢复。"
    failure_rule: "以 Result<_, String> 合并 transport 与 command errors 后在任意 Err 上 reconnect，或用 retry/debounce 掩盖 cwd failure，必须静态失败。"

sftp_file_mutation_contracts:
  recursive_delete_identity:
    id: SFTP-RECURSIVE-DELETE-IDENTITY-01
    capability: "inode-bound recursive SFTP delete"
    invariant: >-
      destructive recursive delete 必须携带并重验选择时 lexical kind/opaque identity，递归过程固定同一 directory fd/inode；
      directory 被替换为 symlink 时不得遍历 target。
    failure_rule: "确认与执行间 identity 变化时返回 conflict。"

  transfer_handle:
    id: SFTP-TRANSFER-HANDLE-02
    capability: "opaque inode-pinned chunk transfer handle"
    invariant: >-
      begin-transfer 首次 actual-open 后返回 opaque handle；后续 chunk 仅操作同一 fd/object，禁止每 chunk 按 path 重开。
    failure_rule: "unknown/expired handle 或 identity 变化时终止 transfer。"

  sftp_actual_open_nofollow:
    id: SFTP-ACTUAL-OPEN-NOFOLLOW-03
    capability: "shared nofollow actual-open for SFTP transfers"
    invariant: >-
      SFTP 与 Workspace 共用逐级 nofollow source/destination opener；planner 检查不能替代 execution actual-open，
      source swap 与 destination ancestor symlink 必须 fail-closed。
    failure_rule: "任一级 symlink 或非 regular source 都拒绝。"

  atomic_operation_staging:
    id: SFTP-ATOMIC-STAGING-04
    capability: "operation-owned atomic SFTP staging"
    invariant: >-
      upload/download 使用同目录 O_EXCL 唯一 staging 并在完成后原子 promotion；失败保留旧 final，cleanup 只能删除本 operation identity。
      Unix identity 来自 dev/inode；Windows identity 必须来自稳定 Win32 file handle 的 volume serial/file index，
      commit/drop 前以 OPEN_REPARSE_POINT 重开 lexical path 并拒绝 identity 变化，禁止依赖 unstable std MetadataExt 或 path-only 检查。
    failure_rule: "禁止直接 truncate final、复用固定 .sftp_partial 文件名、用零 identity 或忽略 expected identity。"

  exact_promotion_commit:
    id: WORKSPACE-PROMOTION-COMMIT-05
    capability: "verified exact Workspace promotion commit"
    invariant: >-
      promotion success 必须证明每个 staging 被消费到精确 final；no-clobber 冲突返回 typed error，多文件 batch 返回准确 committed/failed 集。
    failure_rule: "mv -n skip、部分提交或未知结果不得报告整体成功。"

  exact_remote_rename:
    id: REMOTE-RENAME-EXACT-TARGET-06
    capability: "exact-target remote rename"
    invariant: >-
      remote rename destination 已存在时必须 typed conflict，禁止 mv 将 source 隐式移入目录；UI 只在 backend 返回实际 committed path 后更新缓存。
    failure_rule: "backend committed path 不等于 requested target 时操作失败并刷新。"

  listing_generation_ownership:
    id: SFTP-LISTING-GENERATION-07
    capability: "generation-owned SFTP directory listing"
    invariant: >-
      listing completion 必须绑定 connection、lexical path 与 generation；过期 completion 不得更新 rows、selection、loading 或 error 状态。
    failure_rule: "导航后返回的旧请求结果一律丢弃且无状态副作用。"

engineering_guard_contracts:
  parity_presubmit_ci:
    id: LR-PARITY-PRESUBMIT-CI-01
    capability: "mandatory local/remote parity merge gate"
    invariant: >-
      SPEC、matrix、tracker、静态检查和 cargo check 必须接入 PR/push CI 必经路径，
      不能依赖开发者或 AI 手工记得运行本地 presubmit。
    required_steps:
      - "cargo fmt --all -- --check"
      - "./script/check_local_remote_parity"
      - "cargo check --locked"
    failure_rule: "任一步失败时 CI job 失败；release workflow 不能替代日常 parity gate。"

  tracker_matrix_referential_integrity:
    id: LR-PARITY-TRACKER-MATRIX-REF-01
    capability: "tracker to capability-matrix referential integrity"
    invariant: >-
      tracker 中每个 capability_matrix 引用必须精确对应 capability matrix 的唯一 capability 行；
      capability matrix 与 inconsistencies tracking CSV 都必须保持固定列数并由标准 CSV parser 可读；
      禁止 tracker 已记录而 matrix 漏项、拼写漂移、重复 capability 或未引用逗号破坏 tracking row。
    enforcement_layers:
      static_check: "script/check_local_remote_parity 枚举全部 tracker 引用并与 CSV capability 列双向核对缺失与重复，同时用标准 CSV parser 检查 capability/inconsistencies 两份 tracking CSV 的固定列数。"
      focused_test: "Rust contract test 使用仓库内嵌 tracker/matrix 复核同一引用完整性，避免 shell 门禁自身回归。"
    failure_rule: "任一引用不存在或 capability 重复时 presubmit/CI 失败，禁止把 tracking list 当作无约束备注。"

session_bridge_contracts:
  conversation_source_environment_independence:
    id: SESSION-BRIDGE-CONVERSATION-SOURCE-23
    capability: "conversation SessionBridge cold-read independent of execution Environment"
    invariant: >-
      Ashide conversation transcript 的持久化权威始终是当前 app SQLite；source Environment authority
      只描述该会话的执行/后续 fork 目标上下文，不得改变 Conversation source 的读取 backend。
      local 与 runtime authority 必须复用同一个 current-app Conversation store reader；
      Conversation 不得被强行塞入只服务于 CLI-agent installation roots 的 SessionBridgeEnvironment。
    enforcement_layers:
      source_owner: "Conversation ID 由 current-app Ashide SQLite store 解释；Environment authority 不是其 source locator。"
      backend: "read_conversation_session_bridge_blocking 是唯一 cold-read 边界；SessionBridgeEnvironment 只处理需要 target CLI-agent roots 的 source/read/write。"
      action: "show_session_bridge_edit_dialog 只保留 live-memory fast path；cold read 调用共享 current-app store reader，禁止内联 SQLite 或按 Environment 分支。Fork 到 Ashide 完成后必须把 action 已持有的 source Environment authority 显式传给共享 conversation restore 入口，禁止依赖新 Conversation 自带 Environment、当前焦点或再次扫描推断。"
      async_boundary: "SQLite cold read 在 spawn_blocking 中执行，UI action 不同步阻塞数据库。"
    failure_rule: "runtime authority 不能使已持久化 Ashide conversation 的编辑入口报 unavailable；远程 CLI source Fork 到 current-app Ashide store 后必须在原 source Environment 中交付新 Conversation，且不能建立第二个 remote conversation store。"

ux_matrix:
  - id: APP-SINGLE-INSTANCE-SIDE-EFFECT-ORDER-03
    scenarios:
      - "owner 正常运行时第二次启动：intent 转发并退出，owner 当前日志文件不被截断或轮转。"
      - "第二启动 IPC 失败：进程显式报错退出，仍不得初始化共享日志或 SQLite。"
      - "无 owner：首进程 claim 成功后才初始化日志、资源限制、TLS 与 SQLite。"
      - "运行态诊断：第二启动前后的 owner 日志 fd 仍指向当前活动日志链。"
    required_tests:
      - mac_single_instance_claim_precedes_shared_logging_initialization

  - id: APP-SINGLE-INSTANCE-MAC-01
    scenarios:
      - "从 Finder/Dock 重复打开 Ashide：只激活既有进程。"
      - "直接执行当前 .app/Contents/MacOS/ashide：启动 intent 转发后第二进程退出，Dock 仍只有一个图标。"
      - "script/run 构建的 AshideDev.app 直接执行两次：第二进程同样转发退出；不得因未启用 release_bundle feature 绕过 owner lock。"
      - "同一 AshideDev.app 的 owner 以 WARP_DATA_PROFILE=codex-dev 启动、第二次无该变量直接执行 bundle binary：仍命中同一 lock/socket 并转发退出。"
      - "带目录或 ashide:// URL 启动：既有进程接收并处理 intent。"
      - "owner 已持锁但 IPC server 尚未 ready：第二进程有界重试，不得打开第二 GUI。"
      - "owner 崩溃后 lock 自动释放；下一次启动可成为新 owner。"
    required_tests:
      - mac_single_instance_contract_is_fail_closed
      - desktop_singleton_is_not_release_feature_gated
      - desktop_singleton_ignores_data_profile_namespace
      - release_bundle_declares_multiple_instances_prohibited

  - id: APP-SINGLE-INSTANCE-IPC-02
    scenarios:
      - "owner listener 使用 nonblocking accept：accepted stream 仍完整读取首帧，不因 WouldBlock 提前关闭。"
      - "第二启动携带目录 URL：owner 完整解帧并 ACK，第二进程以 0 退出。"
      - "payload 超过协议上限：发送端或接收端显式拒绝，不分配无界内存。"
      - "client 只发送部分 frame 后停顿：server 在 timeout 后拒绝该连接，继续接受后续健康启动 intent。"
      - "JSON 非法或 UI queue 已关闭：server 返回 REJECTED 并记录具体协议阶段。"
    required_tests:
      - startup_ipc_nonblocking_listener_round_trips_one_framed_intent
      - startup_ipc_rejects_oversized_frame

  - id: LR-FILE-TRANSFER-SYMLINK-01
    scenarios:
      - "SFTP Browser 下载 symlink-to-file：显示不支持错误，不生成下载任务。"
      - "SFTP Browser 上传本地 symlink：显示不支持错误，不读取 target 内容。"
      - "上传覆盖远端 symlink-to-file：失败且 target 内容保持不变。"
      - "规划后把 upload source 替换成 symlink：actual open 失败，不读取 target。"
      - "download destination 或任一既有 ancestor 是 symlink：actual open 失败，不写入 target tree。"
      - "conflict scan 后把 final path 替换成 symlink：promotion 再检查并失败。"
      - "直接调用 daemon ReadFileChunk/WriteFileChunk 处理 symlink：返回显式 error result。"
      - "symlink-to-directory 仍可导航；broken symlink 仍可选中、重命名、删除。"
    required_tests:
      - sftp_transfer_policy_rejects_symlink_entries
      - sftp_backend_rejects_symlink_upload_and_download
      - file_chunk_rpc_rejects_symlink_instead_of_reading_or_overwriting_target
      - download_save_as_revalidates_stable_path_after_listing_reorder
      - workspace_upload_execution_rejects_source_symlink_after_planning
      - workspace_download_rejects_symlink_destination
      - workspace_upload_promotion_rechecks_remote_symlink

  - id: LR-FILE-TREE-ATOMIC-01
    scenarios:
      - "root listing 成功但任一 expanded child 失败：旧 rows 与 expanded set 完整保留。"
      - "全部 root/child listing 成功：一次性提交新的完整 snapshot。"
      - "失败 child 不得被解释为目录消失，也不得生成缺 subtree 的 Success。"
    required_tests:
      - file_browser_tree_reload_failure_preserves_previous_snapshot

  - id: LR-REMOTE-REQUIRED-RESULT-01
    scenarios:
      - "WriteFile/RenameFile 返回空 result：操作显示失败，禁止假报成功。"
      - "SaveBuffer 返回空 result：编辑器不得显示已保存。"
      - "ResolvePath 返回空 result：不得伪装成路径不存在。"
      - "CLI-agent mutation 返回空 result：不得假报删除完成。"
      - "任意未来 oneof result response 未被 validator 覆盖：static check/contract test 失败。"
    required_tests:
      - required_result_response_names_match_proto_contract
      - empty_required_result_is_rejected_at_transport_boundary
      - write_and_rename_empty_response_are_not_false_success

  - id: LR-REMOTE-RESOLVE-PATH-RESULT-02
    scenarios:
      - "目标不存在：helper 返回 typed NotFound，client 映射 None。"
      - "目标 permission/I/O error：client 返回 Err，upload conflict scan 中止。"
      - "result 缺失：transport 返回 ClientError::UnexpectedResponse。"
      - "symlink path 存在：返回 Success(kind=Symlink)，不得映射 NotFound。"
    required_tests:
      - resolve_path_not_found_is_distinct_from_remote_error

  - id: LR-PARITY-PRESUBMIT-CI-01
    scenarios:
      - "PR/push 修改本地/远程实现：CI 强制运行 format、parity static check、cargo check --locked。"
      - "静态门禁失败：CI 失败，不能合并。"
      - "仅 release workflow 存在但日常 CI 缺失：contract test 失败。"
    required_tests:
      - ci_workflow_runs_local_remote_parity_gate

  - id: LR-PARITY-TRACKER-MATRIX-REF-01
    scenarios:
      - "tracker 新增 capability_matrix 引用但 CSV 漏行：static check 与 focused test 同时失败。"
      - "matrix 出现重复 capability：门禁失败，禁止两个状态来源竞争。"
      - "tracker 与 matrix 引用一一对应：门禁通过，状态仍分别按 fixed/verified 语义维护。"
    required_tests:
      - tracker_capability_matrix_references_are_complete

  - id: LR-FILE-LIST-COMPLETE-01
    scenarios:
      - "目录中任一 read_dir entry 读取失败：远程返回显式 listing error，不显示静默缺项的成功列表。"
      - "普通文件 lexical metadata 读取失败：listing 整体失败，不生成 kind/size 错误的 row。"
      - "broken symlink：保留 link row，kind=Symlink、target_kind=Missing。"
      - "symlink-to-file 的 size/modified 来自 lexical inode，不得偷换为 target metadata。"
      - "完整 listing 成功后按 name 稳定排序。"
      - "Terminal File Browser 任一 lexical symlink_metadata 失败：整体返回 listing error，不静默缺 row。"
    required_tests:
      - list_directory_entry_error_is_not_silently_dropped
      - list_directory_broken_symlink_preserves_lexical_row
      - list_directory_returns_sorted_metadata
      - list_directory_modified_time_error_is_not_silently_dropped
      - terminal_directory_listing_metadata_error_is_not_silently_dropped
      - terminal_directory_listing_modified_time_error_is_not_silently_dropped
      - terminal_directory_listing_is_sorted_by_name

  - id: LR-FILE-SYMLINK-RENAME-01
    scenarios:
      - "broken symlink 重命名：旧 row 消失、新 lexical row 立即出现且 target_kind=Missing，无需重扫。"
      - "新 broken symlink 路径收到 RenameMode::Any：归类为 added，不得因 target 不存在而归类为 deleted。"
      - "旧路径收到 RenameMode::Any 且 lexical inode 已不存在：归类为 deleted。"
      - "重命名后的 broken symlink 仍可选中、再次重命名和删除。"
      - "directory symlink 重命名后，children 继续显示在新 lexical link namespace 下。"
      - "symlink_metadata 返回非 NotFound 错误：该批显式失败，不产生 false delete。"
    required_tests:
      - rename_any_classifies_broken_symlink_destination_as_added
      - rename_any_classifies_missing_source_as_deleted
      - broken_symlink_rename_remains_visible_without_rescan

  - id: SESSION-SOURCE-AUTHORITY-01
    scenarios:
      - "encoded source authority 与 snapshot authority 不一致：read/delete 均 fail-closed。"
      - "同路径存在于两个 remote authority：mutation 只到 locator 所属 authority。"
    required_tests: [remote_cli_agent_source_id_rejects_authority_mismatch, remote_cli_agent_source_delete_never_crosses_authority]

  - id: SESSION-CODEX-CANONICAL-INGRESS-02
    scenarios:
      - "plugin/OSC 上报 msg_ id：model mutation 前拒绝。"
      - "expected UUID 与 transcript session_meta UUID 不同：reader 返回 mismatch。"
    required_tests: [codex_plugin_event_rejects_noncanonical_session_id_before_model_commit, codex_reader_rejects_expected_vs_transcript_session_id_mismatch]

  - id: SESSION-REMOTE-SCAN-ATOMIC-03
    scenarios:
      - "一条 malformed remote record：整个 scan Error 且旧 cache 保留。"
    required_tests: [environment_cli_agent_scan_rejects_malformed_record, remote_scan_malformed_record_preserves_cached_rows]

  - id: SESSION-REMOTE-APPEND-04
    scenarios:
      - "provider 并发写 history 时 SessionBridge append 不覆盖已有或并发 bytes。"
    required_tests: [remote_native_append_preserves_concurrent_provider_write, remote_native_append_does_not_rewrite_existing_file]

  - id: SESSION-NATIVE-WRITER-PLAN-05
    scenarios:
      - "同一 IR 与同一 target context 的 local/remote plan 完全等价；host executor 只消费 plan 声明的 operation/backup paths。"
    required_tests: [local_and_remote_native_write_plans_are_equivalent, remote_native_write_executor_consumes_only_declared_backup_paths]

  - id: ENV-RUNTIME-RESTORE-DISPATCH-01
    scenarios:
      - "custom/container/WSL runtime 无 connection_ref：不得落入本地 terminal bootstrap。"
    required_tests: [test_custom_runtime_restore_never_falls_back_to_terminal_bootstrap, test_virtual_session_restore_dispatches_by_authority_capability_not_connection_ref]

  - id: ENV-RUNTIME-INTENT-RETRY-02
    scenarios:
      - "stale reconnect/bootstrap 失败：placeholder 和 pane-owned restore intent 可重试。"
    required_tests: [test_stale_client_reconnect_failure_preserves_pane_owned_restore_intent, test_runtime_bootstrap_failure_preserves_all_authority_pending_intents]

  - id: ENV-RUNTIME-RETIRING-LEASE-03
    scenarios:
      - "普通 permanent tab close：shutdown PTY，且 PTY exit 前仍禁止同 UUID resume。"
      - "hidden undo close：保留 PTY 与 Retiring lease；restore 取消 lease，discard/expiry 才 shutdown。"
    required_tests: [test_add_and_close_session, test_closed_nonfinal_tab_retains_durable_owner_until_terminal_exit, test_restored_closed_tab_returns_retiring_owner_to_live, test_discarded_closed_tab_shuts_down_retained_terminal, test_hidden_closed_pane_reserves_durable_owner_while_undoable, test_discarded_hidden_pane_shuts_down_retained_terminal, test_closed_window_tracks_every_duplicate_durable_terminal_owner_until_exit, test_transferred_tab_placeholder_is_permanently_shutdown_on_adoption]

  - id: ENV-ENTRY-DELIVERY-HOME-04
    scenarios:
      - "plain terminal 与 restored conversation 的 local/runtime 路径调用同一 backend deliver。"
    required_tests: [test_plain_terminal_entry_uses_shared_environment_backend_for_local_and_runtime, test_restored_conversation_new_tab_uses_shared_fork_delivery]

  - id: ENV-AUTHORITY-CONSTRUCTION-05
    scenarios:
      - "saved SSH node runtime lookup 使用 typed constructor 且 connected-without-client 返回 None。"
    required_tests: [saved_ssh_node_runtime_lookup_uses_shared_authority_identity, sftp_runtime_lookup_rejects_connected_target_without_client]

  - id: ENV-RUNTIME-ERROR-RESELECT-06
    scenarios:
      - "SSH 首次连接失败进入 Error；网络恢复后用户切到 Local 再重新激活该 Environment：保留同一 runtime owner SessionId 并进入 Connecting，而不是永久停留 Error或替换 alias owner。"
      - "仅发生 background render/restore/browser unavailable：Error 不自动循环重试。"
      - "冷启动从 tab snapshot 恢复 Error：EnvironmentTable 仍为 Error，browser unavailable 不创建 transport generation。"
