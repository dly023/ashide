    negative_space: ["private alias in Rust fixture", "private alias in tracker evidence", "stale existing Release body", "compressed ZIP/TAR payload", "mounted DMG payload", "new non-generic ssh-config alias", "local-only denylist absent in CI"]
    verification_rule: "script/check_release_privacy 必须同时有当前仓库零命中证明、local-only private token 负向探针、non-generic authority 负向探针，并在 CI、presubmit、release source validation、macOS packaging 与 final upload 复用。"

