  - id: SESSION-NAVIGATOR-ATOMIC-RENDER-MODEL-49
    source: LR-140
    capability: "session navigator atomic render model"
    invariant: "Vertical Tabs 每一帧必须消费同一个 SessionNavigatorModel 中的 sessions 与 state；禁止用刷新后的 rows 配刷新前的 RowId/selection/render state。"
