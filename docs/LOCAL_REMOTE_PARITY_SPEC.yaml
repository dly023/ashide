  - id: ENVIRONMENT-TARGET-HOME-MATERIALIZATION-48
    source: LR-139
    capability: "environment target HOME materialization refresh"
    invariant: "Environment indexed-session scan 只能在 exact runtime SessionId 的 target HOME 成功 materialize 后开始；root/HOME transition 完成后必须通过 EnvironmentBackend::refresh_indexed_sessions(PassiveProjection) 投影历史 rows。"
