  - id: AGENT-SESSION-DISCOVERY-OWNER-78
    source: LR-174
    capability: "shared Agent session discovery plan with transport-only local/runtime split"
    invariant: "统一 registry 生成 discovery plan，共享 parser 生成 stable identity 与 metadata；EnvironmentTable 原子持有 scan generation 与 canonical collection。local filesystem/native client 与 runtime RPC 只负责执行同一 plan，不拥有 provider policy、排序或删除语义。"
    lifecycle: "scan start 保留 committed collection；每个 provider 必须返回带 provider identity 的 Complete/SourceMissing/PermanentlyDeleted/Failed/Cancelled outcome。只有 current generation 的全 provider complete success 原子替换；任一 provider source 暂失、parse failure、cancel 与 stale completion保留完整旧 collection，PermanentlyDeleted 只删除该 provider 且保持其余 identity/order。"
    failure_rule: "禁止 local/remote 各自枚举 provider、使用 global observed_source 让一个 provider 掩盖另一个 provider missing、用未观察到解释永久删除、提交部分 record、或 transport adapter 重排业务结果。"
    negative_space: ["zero sessions", "target plus two unrelated sessions", "source temporarily missing", "source permanently deleted", "malformed one of many records", "out-of-order completions", "cancel", "provider removed"]
    verification_rule: "集合测试至少包含目标 provider 与两个无关 provider 并逐阶段检查 cardinality/identity/order；Jcode Stage A 只调用公开 session list CLI，测试用 provider-scoped plan/fixture hermetic 执行且不依赖本机 jcode 版本；static inventory 扫描全生产源码树，打印 path:line/enclosing-function，并锁定 plan execute、provider scan、local/runtime adapter 的 canonical owner 与负向 wrapper/new-file probe。"

  - id: SESSION-BRIDGE-TYPED-INTENT-PROVENANCE-79
    source: LR-175
    capability: "typed SessionBridge intent, provenance and atomic publication"
