    failure_rule: "共享 helper 出现 ssh-config:、fixture 未注册、测试通过依赖 load_candidates() 或开发者机器 alias 时必须 fail closed；禁止给失败测试逐条注入 fallback。"
    negative_space: ["empty user SSH config", "unrelated user SSH aliases", "parallel workspace tests", "repeated initialize_app", "saved fixture already exists", "config-provider parser-specific tests"]
