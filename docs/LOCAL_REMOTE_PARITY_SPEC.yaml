    failure_rule: "禁止 action 接入层分别调用 snapshot_session_navigator_state 与 session_navigator_sessions/raw_session_navigator_sessions；禁止在 action 前后补 sync、retry、list freeze 或 render overlay 掩盖半事务 model。"
    negative_space: ["new identity appears immediately before Resume", "target plus two unrelated rows", "source temporarily missing", "local synchronous carrier", "runtime asynchronous placeholder", "failure and cancel cleanup"]
