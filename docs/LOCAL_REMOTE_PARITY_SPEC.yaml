    verification_rule: "static checker 输出全生产树 path:line inventory，并锁定 project_agent_actions 唯一消费 owner、两个一级域构造 owner、Edit intent target 到 shared dialog 的显式透传，以及旧 provider 顶层 New/Fork/Edit、source-derived Edit target、生产硬编码 readiness 零命中；领域模型 tests 覆盖 capability/context filtering、顶层 cardinality 与 cancel/failure 零副作用；hermetic UI tests 覆盖 zero-installed 一级域、Claude/Codex New 与 Fork/Edit 二级投影、pointer/keyboard 共事件链、tab/pane/Navigator source 和 remote Connected authority；dialog test 用不同 source/intent target 证明 intent target 被预选；cargo check 与 lib test no-run 必须通过。"

  - id: GEMINI-CLI-HARD-CUT-77
    source: LR-173
    capability: "remove Gemini CLI integration while preserving Gemini model providers"
    invariant: "Gemini CLI provider identity、harness/plugin/assets、detection、menu/settings、listener/index/resume、persistence parsing、SessionBridge 与文档测试必须零残留；Gemini 模型/API provider 和通用模型推理能力必须保持。"
