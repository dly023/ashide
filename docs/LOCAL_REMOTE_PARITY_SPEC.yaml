  - id: AGENT-ACTION-SIDECAR-IA-76
    source: LR-172
    capability: "capability-driven hierarchical Agent actions"
    invariant: "Environment Strip 的 Agent 入口与 session context actions 共用同一 action projection；顶层不得按 provider × action 平铺。选择 Agent 或 action intent 后，sidecar 只展示当前 context 可执行的 New、Resume、Attach、Fork、Edit、Write-back。"
