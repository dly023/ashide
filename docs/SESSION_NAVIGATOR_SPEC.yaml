# Ashide Session Navigator 语义规范 v7
#
# 这是 Session Navigator 排序、合并、置顶、删除、恢复、focus/active/selection
# 行为的唯一权威定义。代码实现和所有测试必须与此 spec 一致。
# 当 spec 与代码冲突时,以 spec 为准;修改行为先改 spec 再改代码。
#
# v7 变更摘要:
#   - 所有 live pane 的身份统一收敛到 PaneConfiguration.container_uuid
#   - LeafSnapshot/SQLite 显式持久化 container UUID；terminal runtime UUID 不再兼任 UI 容器身份
#   - live container 缺 UUID 立即失败，禁止退回 tab/leaf locator
#   - runtime placeholder 与 Welcome 等非 terminal pane 同样获得稳定身份
#
# v6 变更摘要:
#   - app-state pane tree 在进入 SQLite 前统一裁剪不可恢复 leaf 并折叠 branch
#   - read-only transcript/provider/runtime-only pane 不得冷恢复成另一种可写语义
#   - SQLite 只接受结构完整的 persistable tree，禁止遍历期间静默跳 leaf
#
# v5 变更摘要:
#   - live terminal 稳定容器身份改为 pane UUID；tab:X:leaf:Y 降级为纯 locator
#   - identity/user-state key 统一归属 WorkspaceSessionSnapshot，删除各层重复拼 key
#   - local/remote sidecar 主动清理历史 tab/source:tab 键，不保留位置身份兼容债
#   - merge 对 source 顺序无关；virtual 先到时 live owner 仍必须接管 pane UUID/container
#
# v4 变更摘要:
#   - Environment 成为状态分区第一层;每个环境独立保存 rows/order/selection/lifecycle
#   - 新增稳定 RowId + identity registry;virtual/live 是同一行生命周期而非排序身份
#   - RowId 是 reducer 单调分配的 opaque row:N，永不复用 physical/durable/logical identity
#   - 位置状态与 active/focus/restoring 解耦;事件只能修改授权 state slice
#   - 删除 physical/durable 双 order 与 max/min 猜测桥接
#   - 外置 alias/title/pin 等 enrichment 在初次 scan/Refresh 即合并，不依赖 Resume
#
# v3 变更摘要:
#   - 新增 focus/active/selection 优先级链 (§6)
#   - 新增纯 reducer 契约 (§7): 所有列表变化走同一 reducer
#   - 修正 tie-breaker: 用 logical_key 不用 volatile id (§3)
#   - 修正删除流程: 统一 focus 决策,消除 preselect/reselect 重复 (§8)
#   - 修正 materialization 追踪: 显式迁移,不靠猜测 (§6.4)
#   - 新增边界条件全量覆盖 (§9)
#   - 新增测试矩阵: 序列测试 + oracle + 排序稳定性 + tie-break (§10)
#
# v2 = codex commit 8aef2d2 的隐式语义 (已废弃)
# v1 = 更早的隐式语义 (已废弃)

spec_version: 7
last_updated: "2026-07-12"

# ─────────────────────────────────────────────────────────
# 0. 内聚状态模型 (Cohesive State Model)
# ─────────────────────────────────────────────────────────
state_model:
  root:
    type: "SessionNavigatorModel"
    fields:
      active_environment: "EnvironmentKey"
      environments: "HashMap<EnvironmentKey, EnvironmentNavigatorState>"
    invariant: "任何行状态必须且只能属于一个 canonical EnvironmentKey；authority alias 与 transport generation 不是 EnvironmentKey"

  environment_partition:
    type: "EnvironmentNavigatorState"
    owns:
      rows: "HashMap<RowId, RowState>"
      order: "Vec<RowId> / 等价稳定 position map"
      selected_row: "Option<RowId>"
      restoring: "HashMap<RowId, RestoreAttempt>"
      deleting: "HashSet<RowId>"
      deleted: "HashSet<RowId> durable tombstone"
      identity_registry: "stable container/durable/logical identity → RowId（不含 tab/leaf locator）"
      next_row_id: "opaque RowId 单调分配器"
    isolation: "后台或前台事件只能修改事件所属环境分区"

  row_identity:
    row_id: "reducer 首次观察时单调分配的 opaque row:N；在 virtual/restoring/live 生命周期中不变，绝不等于或复用任何 identity"
    stable_container_identity: "所有 live pane 使用 PaneConfiguration.container_uuid（pane:<uuid>）；经 LeafSnapshot 与 pane_container_identities 跨 tab/pane 重排和冷启动持久化"
    physical_locator: "tab:X:leaf:Y 只用于当前布局 action 路由；禁止进入 identity registry、alias、pin、selection 或 display order"
    durable_identity: "agent/conversation binding；可增加，不直接拥有 position"
    key_ownership: "logical/durable/observed/user-state key 只能由 WorkspaceSessionSnapshot 生成；组件/reducer/Workspace/remote adapter 禁止重复拼 key"
    materialization: "只把 stable container/durable identity 绑定到既有 RowId，不创建新 position"
    conflict_reconcile: "若异步时序曾让同一 observed row 的 durable/container alias 指向不同 RowId，Refresh 必须选择 durable canonical RowId，并原子迁移 selection/lifecycle/order/全部 aliases，禁止留下孤儿 RowId"
    command_detection: "普通 live pane 后续识别出 agent binding 时仍保留原 RowId"
    deletion_reuse: "删除只 tombstone 旧 RowId；释放 volatile pane alias 后，未来复用相同 tab/leaf 坐标的新 session 必须分配新 RowId"

  metadata_enrichment:
    ownership: "alias/title/pin/cwd/provider metadata 是逻辑会话的投影输入，不是独立 row，也不拥有 display position"
    loading: "外置 metadata 必须在初次 scan/Refresh 时按 durable session identity 与实体 source 聚合；Activate/Resume/materialize 不得作为加载前置条件"
    budgeting: "limit/pagination 按逻辑会话计算；同一会话的 rollout/index/user-state 等 backing source 不互相竞争配额"
    discovery_limit: "local initial scan、local Refresh、remote scan 共用 WORKSPACE_SESSION_NAVIGATOR_LOGICAL_LIMIT；禁止各调用点写独立魔法数字"
    isolation: "metadata 只能 enrich 同 EnvironmentKey + durable identity 的 row，不得跨环境串写"
    failure_boundary: "metadata/user-state 读取失败不得丢弃已成功扫描的实体 rows；保留该 Environment 已缓存 enrichment 并允许后续 Refresh 重试"
    binding_persistence: "live terminal 的 cli_agent/command/origin/provider session id 必须由 pane owner 落盘并在冷启动恢复；Started/SessionUpdated 必须触发 app-state save，禁止把 Resume 当成 identity 恢复机制"
    user_state_key_hygiene: "local/remote alias/pin sidecar 只允许稳定 key；历史 tab:* 与 *::source:tab:* 必须在读取时清除并重写，禁止兼容债继续扩散"

  app_state_persistence:
    live_authority: "WindowSnapshot.tabs 是 live pane 唯一持久化权威；restored_workspace_sessions 只保存 virtual restore targets"
    tree_boundary: "PaneNodeSnapshot::into_persistable 是 pane 可恢复性的唯一结构边界；必须在写 SQLite 前递归裁剪不可恢复 leaf"
    transient_semantics: "read-only terminal transcript、provider editor/browser、runtime-only code pane 不可跨重启恢复，禁止降级成可写或空 pane"
    structural_normalization: "branch 裁剪后 0 child 删除整 branch，1 child 折叠为 child，多 child 保留；SQLite 禁止二次静默跳 leaf"
    container_identity: "PaneConfiguration.container_uuid 是所有 leaf pane 身份的运行时唯一归属，经 LeafSnapshot.container_uuid 写入 pane_container_identities；terminal UUID 只属于 terminal runtime"
    hard_cut: "旧 pane tree 不含 container UUID，migration 为每个现存 leaf 一次性分配随机 UUID；禁止从 tab index、leaf index、数据库自增 id 或 terminal runtime UUID 猜测迁移"

  write_ownership:
    position:
      allowed_events: ["Refresh.FirstObserved", "Reorder"]
      forbidden_events: ["Activate", "Resume", "Materialized", "Focus", "RefreshExisting", "EnvironmentSwitched"]
    selection:
      allowed_events: ["Activate", "Resume", "Materialized", "ExplicitSessionCreated", "DeleteSelectedFallback"]
      forbidden_events: ["PaneFocused", "TabActivated", "RefreshOrder", "BackgroundEnvironmentUpdated"]
    lifecycle:
      allowed_events: ["RestoreStarted", "RestoreFinished", "Delete", "DeleteRolledBack", "DeleteCommitted", "Refresh.Materialized"]
      forbidden_events: ["Reorder", "Pin", "EnvironmentSwitched"]
    active_environment:
      allowed_events: ["EnvironmentSwitched", "EnvironmentDisconnectedFallback"]

  action_write_ownership:
    state_slices:
      position: ["display_order", "next_display_order"]
      identity: ["row_id_by_identity", "next_row_id"]
      selection: ["selected_row_id"]
      lifecycle: ["restoring_row_ids", "deleting_row_ids", "deleted_row_ids"]
    actions:
      Delete: ["identity", "selection", "lifecycle"]
      Activate: ["identity", "selection", "lifecycle"]
      SelectionChanged: ["identity", "selection"]
      RestoreStarted: ["identity", "selection", "lifecycle"]
      RestoreFinished: ["selection", "lifecycle"]
      DeleteRolledBack: ["lifecycle"]
      DeleteCommitted: ["identity", "lifecycle"]
      Pin: []
      Refresh: ["position", "identity", "selection", "lifecycle"]
      TabActivated: []
      PaneFocused: []
      Reorder: ["position"]
    direct_write_boundary: "除 session_navigator_reducer.rs 与测试夹具外，生产代码禁止直接修改以上 state slices；adapter 只能发送 typed action"

  environment_switch:
    save: "保存来源环境自己的 selected row 与 last-active tab/pane"
    restore: "投影目标环境自己的 rows/order/selection 与 last-active tab/pane"
    forbidden: "不得 reconcile 其他环境顺序；不得用来源 focus 覆盖目标 selection"
    background_update: "非 active environment 的 refresh/materialize 只更新其分区，不抢焦点"

# ─────────────────────────────────────────────────────────
# 1. 容器模型 (Container Model)
# ─────────────────────────────────────────────────────────
container_model:
  live_container:
    description: "由真实 pane 支撑的会话 (from_tabs 产出, id=tab:X:leaf:Y)"
    identity: "所有 pane 使用 pane:{container_uuid} 稳定容器身份；id=tab:X:leaf:Y 仅负责当前 action 路由"
    missing_identity: "模型错误并立即失败；禁止 fallback 到 source:tab:*"
    is_live_container: true
    is_pinned_initial: false
    pin_inheritance: "不继承 durable pin key"

  virtual_container:
    description: "无真实 pane 支撑的会话 (restored / indexed / historical)"
    identity: "durable 身份 agent:{agent}:{session_id} 或 conversation:{id}"
    is_live_container: false
    is_pinned_initial: "由 snapshot 构建器通过 is_pinned_by(&pinned_set) 预赋值"
    pin_inheritance: "virtual row 保留自己的 pin 状态,直到被 live consume"

  consume_rule:
    description: "virtual row 的 binding 匹配 live container 时被 consume"
    pin_transfer: "被 consume 的 virtual row 强制 is_pinned=false"

# ─────────────────────────────────────────────────────────
# 2. 排序意图链 (Sort Intent Chain)
# ─────────────────────────────────────────────────────────
sort_intent_chain:
  - key: "is_pinned (降序)"
    intent: "pinned 行优先"
    applies_when: "always"

  - key: "same_window_group_order (降序)"
    intent: "同一 tab 的 split pane 相邻;用同 tab 所有 pane 的最大 display_order（越大越靠顶）"
    applies_when: "id 可解析为 tab:X:leaf:Y"

  - key: "same_window_split leaf index (升序)"
    intent: "同 tab 内按 leaf 序号排"
    applies_when: "同 tab 的 pane 之间"

  - key: "display_order (降序)"
    intent: "稳定序号，越大越靠顶/越新。一旦分配不因 updated_at 变化而重排"
    applies_when: "已 sync/reconcile 的行"
    fallback_when_empty: "order=0（未分配时排在非 pin 段末尾）"

  - key: "updated_at_unix_ms (降序, None 排最后)"
    intent: "最近更新排前面 —— 仅在 order 未分配时生效"
    applies_when: "两行 position 相同或尚未分配；正常已 reconcile 行不依赖它重排"

  - key: "original_position (升序)"
    intent: "merge 后的原始位置作为 tiebreaker"
    applies_when: "always"

  - key: "logical_key (升序)"
    intent: "确定性兜底 —— 用 logical_key 不用 volatile id"
    applies_when: "always"
    note: "v3 修正: v2 用 id 做 tie-breaker,但 id 在 materialize 时从 agent:... 变成 tab:...,导致 order 丢失"

# ─────────────────────────────────────────────────────────
# 3. display_order 分配策略 (Reconcile Strategy)
# ─────────────────────────────────────────────────────────
reconcile_strategy:
  description: "为新行分配稳定序号（越大越靠顶）"
  allocation_order: |
    候选按 pinned DESC → updated_at DESC → logical_key ASC（newest-first）排出;
    对需要新 order 的行从旧到新（oldest-first）依次 next++，使最新拿到最大号
  not_depends_on: "不依赖 merge 的输出顺序"
  existing_row: "已有 order 的行跳过"
  identity_lookup: "所有 observed identity 先经 registry 解析 RowId；只有 RowId 没有 position 才分配 next"
  tie_breaker: "pinned DESC → updated_at DESC (None 排最后) → logical_key ASC"
  new_row_position: "新增行拿到更大 order，排在非 pin 组顶端"
  note: "v3 修正: tie-breaker 从 id ASC 改为 logical_key ASC,因为 id 是 volatile"

# ─────────────────────────────────────────────────────────
# 4. display_order 键策略 (Key Strategy)
# ─────────────────────────────────────────────────────────
key_strategy:
  row_id:
    description: "display_order 只以稳定 RowId 为 key"
    lookup: "identity_registry[observed identity] → RowId → position"
  alias_registration:
    virtual_first: "durable identity 建立 RowId；materialize 后 container UUID identity 指向同一 RowId"
    live_first: "container UUID identity 建立 RowId；后续 agent detection 只新增 durable alias"
    restoring_conflict: "正在 restoring/selected 的 RowId 优先，确保 Resume 原位替换"
  forbidden:
    - "同一行同时保存 primary_order 与 durable_order"
    - "用 max/min 在读取阶段猜测哪个 order 正确"
    - "materialization 为 physical key 分配新 position"

# ─────────────────────────────────────────────────────────
# 5. merge_for_session_navigator 职责
# ─────────────────────────────────────────────────────────
merge_responsibility:
  does:
    - "合并去重:按 logical_key 合并同源行"
    - "consume:virtual row 的 binding 匹配 live container 时合并到 live row"
    - "pin 守卫:被 consume 的 virtual row 强制 is_pinned=false"
    - "pin 补齐:未被 consume 的 virtual row 执行 is_pinned_by 补齐"
  does_not:
    - "排序"
    - "分配 display_order"
    - "决定 active/focus"

# ─────────────────────────────────────────────────────────
# 6. Focus / Active / Selection 优先级链 (v3 新增)
# ─────────────────────────────────────────────────────────
#
# 三个概念:
#   - focus: 物理输入焦点 (pane group 的 focused_pane_id)
#   - active: Session Navigator 中高亮的行 (snapshot.is_active)
#   - selection: 当前 Environment 独立保存的恢复/选择标记 (state.selected_row_id)
#
# 这三者可能指向不同行。mutation 之后谁说了算,由下面的优先级链决定。

focus_active_selection:
  # 6.1 active 行的唯一决定规则 (按优先级从高到低)
  active_priority_chain:
    - rule: "live container focused pane"
      priority: 1
      description: "pane group 的 focused pane 对应的 live session → is_active=true"
      overrides: "一切虚拟标记"
      
    - rule: "restoring session"
      priority: 2
      description: "restoring_workspace_session_keys 中的 session → is_active=true"
      overrides: "当前 Environment 的 virtual/restored selection"

    - rule: "EnvironmentNavigatorState.selected_row_id"
      priority: 3
      description: "当前 Environment 的恢复/选择标记指向 virtual row → is_active=true"
      overridden_by: "规则 1 (live focus) 和规则 2 (restoring)"

    - rule: "其余"
      priority: 4
      description: "is_active=false"

  # 6.2 冲突解决
  conflict_resolution:
    live_vs_virtual: "live container focused pane 总是胜出 —— 物理焦点 > 虚拟标记"
    restoring_vs_restore_key: "restoring 中的 session 胜出 —— 正在恢复 > 已点击待恢复"
    multiple_active: "Refresh/reducer 保证至多一行 is_active; 测试辅助 normalize_session_navigator_active_state 仍可用于静态断言"

  # 6.3 mutation 后的 focus 决策
  focus_after_mutation:
    delete:
      - condition: "被删 session 在多 visible pane 的 tab 中"
        focus_target: "同 group 的 prev_pane (pane_history 优先,其次位置相邻)"
        close_action: "close_pane_permanently"
        rule: "不 preselect 到别的 tab;让 pane group 的 focus_next 自己处理"

      - condition: "被删 session 是 tab 的唯一 visible pane"
        focus_target: "同 environment 的邻居 tab (优先同 env,其次任意)"
        close_action: "close_tab"
        rule: "由 remove_tab 的 tab 选择逻辑处理 focus"

      - condition: "被删 session 是窗口的唯一 tab 的唯一 pane"
        focus_target: "无 (不关窗) 或新建空 tab"
        close_action: "close_pane (保留空 tab)"
        rule: "不关窗,留空 tab"

      - condition: "被删 session 是 virtual row (无 live pane)"
        focus_target: "不改 focus"
        close_action: "只删 provider source + 清 user state"
        rule: "virtual row 删除不影响物理焦点"

    activate_restore:
      - condition: "target 已 materialize (有 locator)"
        focus_target: "focus_pane(target locator)"
        side_effect: "set active_restored_key + clear restoring"

      - condition: "target 是 Ashide conversation"
        focus_target: "restore_or_navigate_to_conversation (新 tab)"
        side_effect: "set active_restored_key + clear restoring"

      - condition: "target 是 virtual row (需 spawn)"
        focus_target: "不抢 focus (用户可能已切走)"
        side_effect: "set restoring + set active_restored_key + spawn terminal"

    pin_unpin:
      - condition: "always"
        focus_target: "不改 focus / active / selection"
        rule: "pin 只改排序组,不碰焦点"

    split_pane_fork:
      - condition: "always"
        focus_target: "focus_pane(新创建的 pane)"
        rule: "新 split pane 获得焦点"

    tab_switch:
      - condition: "always"
        focus_target: "activate_tab → focus_active_tab (pane group 的 focused pane)"
        rule: "切 tab 时由 pane group 的 focus_state 决定焦点"

    pane_focus_projection:
      - condition: "PaneFocused / TabActivated"
        focus_target: "只计算本帧 snapshot.is_active"
        rule: "不得把 focused live logical key 写回 EnvironmentNavigatorState.selected_row_id"

  # 6.4 Materialization identity reconcile
  materialization_tracking:
    old_behavior: "找不到 stored session 就假设 materialized,返回 live active key"
    new_behavior: |
      Refresh.reconcile_identity:
        - 所有 observed physical/durable/logical identity 先查 identity registry
        - virtual 与 live 有任一 durable alias 相交 → 全部 alias 绑定既有 opaque RowId
        - alias 冲突时 durable identity 所属 RowId 为 canonical，并原子迁移 competing RowId 的 selection/lifecycle/order/aliases
        - selected_row_id 始终保存 RowId，不随 logical/physical identity 变化
        - 只有真正首次观察且无任何 alias 命中时才 allocate row:N + position
        - Refresh 不因瞬时 source 消失主动清除 in-flight selection
    deletion_behavior: "session 被删时不做 active 转移猜测;走 focus_after_mutation.delete 的决策"
    rationale: "猜测是不可靠的 —— 被删和 materialize 都表现为'stored session 不在了',但需要不同处理"
    workspace_path: "sync 只 apply reduce(Refresh) 的 state; 已删除 preferred_active_* 双轨"

# ─────────────────────────────────────────────────────────
# 6.5 Environment 导航上下文 UX 矩阵
# ─────────────────────────────────────────────────────────
environment_navigation_context:
  identity:
    current_app: "authority=local 与 local:<root> 归一为同一个 navigation key: local"
    remote: "remote authority_key 本身就是 navigation key"
    comparison_rule: "环境导航、关闭后的同环境选择与 strip 去重一律比较 navigation key,不比较完整 EnvironmentSnapshot"

  memory:
    owner: "Workspace 的 EnvironmentTable"
    key: "canonical environment navigation key"
    value: "上次激活 tab 的 pane_group EntityId"
    forbidden: "不得记录 tab index;reorder/insert/close 会让 index 失效"
    update_point: "所有 tab 激活与 active tab 环境归属变更的统一入口"
    stale_value: "remembered EntityId 已关闭或已移到其他环境时,回退到同环境第一个 tab,激活后立即重写记忆"

  navigator_state_partition:
    owner: "EnvironmentTable.session_navigator_state_by_navigation_key"
    key: "canonical environment navigation key"
    current_app_aliases: "local、local:<root> 共用同一分区"
    remote_reconnect: "同一 remote navigation key 的 transport 重连复用原分区"
    forbidden: "不得把 Session Navigator state 挂在单次 authority entry/connection generation 上"

  switch_matrix:
    - id: "ENV-SW-01"
      transition: "current-app/local → remote"
      expected: "记住 local 当前 tab,恢复 remote 上次激活 tab 及该 tab 内已有 focused pane"
    - id: "ENV-SW-02"
      transition: "remote → current-app/local"
      expected: "恢复 local 上次激活 tab,不固定选择该环境第一个 tab"
    - id: "ENV-SW-03"
      condition: "remembered tab 已关闭"
      expected: "确定性回退到同 navigation key 的第一个 tab并重写记忆;没有 tab 才创建环境 tab"
    - id: "ENV-SW-04"
      condition: "remembered tab 被 reorder"
      expected: "按 EntityId 恢复同一 tab,不受 index 变化影响"
    - id: "ENV-SW-05"
      condition: "用户切走后 remote connect/root-resolution 异步完成"
      expected: "只更新目标 authority 的 runtime/table/tab 状态,不得抢 focus、不得改 active authority、不得把 pending entry 投递到当前 local tab"
    - id: "ENV-SW-06"
      condition: "关闭 active tab"
      expected: "优先选择同 canonical navigation key 的邻居;root/label/lifecycle 元数据变化不应造成跨环境跳转"
    - id: "ENV-SW-07"
      condition: "disconnect 一个拥有多个 tab 的 remote environment"
      expected: "关闭该 authority 的全部 tab并清除导航记忆,不得留下 stale remote tab;若该环境原本 active,恢复 current-app/local 上次激活 tab"
    - id: "ENV-SW-08"
      condition: "在切换完成后新建 tab、agent 或 split"
      expected: "新内容继承当前 active environment;切回 local 后不得投递到 remote,切回 remote 后不得投递到 local"

  entrypoint_rule:
    applies_to:
      - "Environment Strip 点击"
      - "Environment provider open/switch"
      - "session restore environment activation"
      - "ensure/recreate environment tab"
    invariant: "所有入口必须调用同一个 preferred-tab 选择规则,不得各自 position() 选择第一个 tab"

  checks:
    canonical_identity: "environment_navigation_key_collapses_current_app_authority_aliases"
    stable_memory: "remembers_last_active_tab_by_navigation_key"
    round_trip_restore: "test_switching_between_environments_restores_each_last_active_tab"
    active_pane_restore: "test_switching_between_environments_preserves_each_active_pane"
    stale_and_reorder: "test_environment_last_active_tab_fallback_and_reorder"
    async_no_focus_steal: "test_environment_runtime_root_resolution_updates_non_active_environment_tab_without_stealing_focus"
    close_boundary: "test_closing_active_tab_prefers_same_navigation_environment"
    disconnect_cleanup: "test_disconnect_environment_closes_all_authority_tabs_and_restores_local"
    build_gate: "cargo check"

# ─────────────────────────────────────────────────────────
# 7. 纯 Reducer 契约 (v3 新增)
# ─────────────────────────────────────────────────────────
#
# 所有列表变化都走同一个纯 reducer。reducer 只描述可观察结果,
# 不描述内部实现机制 (如 focus-restorer)。
#
# 输入: (当前 sessions 快照, action)
# 输出: (new sessions, side_effect)

reducer_contract:
  input:
    sessions: "Vec<WorkspaceSessionSnapshot> — 当前排序后的 session 列表"
    state: "SessionNavigatorState — 包含 selected_row_id, restoring_row_ids, deleting_row_ids, display_order"
    action: "SessionNavigatorAction"
    pane_group_info: "PaneGroupInfo — 各 tab 的 visible pane 数、focused pane、pane_history"

  output:
    sessions: "Vec<WorkspaceSessionSnapshot> — 更新后的 session 列表"
    state: "SessionNavigatorState — 更新后的状态"
    side_effect: "Option<SideEffect> — 需要执行的外部操作 (focus_pane / close_pane / close_tab / spawn_terminal / write_user_state)"

  actions:
    Delete:
      input: "session_id: String"
      output: |
        1. 从 sessions 中移除被删 session
        2. 加入 deleting_row_ids
        3. 根据 focus_after_mutation.delete 决定 side_effect
        4. 如果被删 session 的 key == selected_row_id → 清除 selected_row_id

    Activate:
      input: "session_id: String"
      output: |
        1. 如果 target 已 materialize → side_effect = FocusPane
        2. 如果 target 是 virtual → 加入 restoring_row_ids, side_effect = SpawnTerminal
        3. 解析或分配 target RowId，并设置 selected_row_id = target RowId

    SelectionChanged:
      input: "session_logical_key: Option<String>"
      output: |
        1. 显式 Navigator 选择或显式新建会话 deliver 完成后，解析/分配对应 RowId
        2. 设置当前 Environment 的 selected_row_id；None 只用于 placeholder 阶段清除旧选择
        3. 普通 PaneFocused / TabActivated 禁止借用此 action 反写 selection

    Pin:
      input: "session_id: String, pinned: bool"
      output: |
        1. 不改 sessions 的 is_active / focus
        2. side_effect = WriteUserState
        3. 下一次 refresh 时 is_pinned 由 user_state 预赋值

    Reorder:
      input: "ordered_logical_keys: Vec<String> — Workspace 按拖动单元 flatten 后的 keys；[0]=列表顶"
      output: |
        1. 按 keys 重写 display_order（顶行最大号，底行最小号；配合降序 sort）
        2. 不改 selected_row_id / restoring_row_ids；active projection 继续解析同一 RowId
        3. side_effect = None
      invariants:
        - "同 tab 的 live split leaf 在结果中必须连续"
        - "同组 leaf 相对序 (leaf index) 不因 Reorder 改变"
        - "UI 拖动单元 = 同屏组 (tab 多 pane) 或单行; 落点只在单元边界"

    Refresh:
      input: "new_raw_sessions: Vec<WorkspaceSessionSnapshot>"
      output: |
        1. merge + reconcile + sort
        2. reconcile_identity (§6.4 durable + binding)
        3. 根据 active_priority_chain 重新计算 is_active
        4. 清除已 materialize 的 restoring_row_ids

    TabActivated:
      input: "无 payload；当前 pane 拓扑由 pane_info 单向提供"
      output: |
        1. 不修改持久 state；pane focus 由 PaneFocused projection 单独提供
        2. 保留当前 Environment 自己的 selection/lifecycle/position

    PaneFocused:
      input: "session_logical_key: Option<String>；只表达 active projection 所需 identity"
      output: |
        1. 对应 live session 的 is_active = true
        2. 其他 live session 的 is_active = false
        3. 不改 EnvironmentNavigatorState.selected_row_id / lifecycle / position

  side_effects:
    FocusPane: "PaneViewLocator — 调用 workspace.focus_pane"
    DeleteEffects: |
      一次 Delete action 的复合副作用 (仍算「一个 side_effect」):
        focus: Option<PaneViewLocator> — 先执行 (多 pane ClosePane 时可由 close_pane focus_next 代劳)
        close: ClosePane(locator) | CloseTab(tab_index) | None
    SpawnTerminal: "session: WorkspaceSessionSnapshot — 调用 activate_restored_workspace_session 的 spawn 路径"
    WriteUserState: "authority, keys, mutation — 调用 mutate_workspace_session_user_state"
    NoEffect: "无副作用 (pin/refresh 只改数据模型)"

  invariants:
    - "reducer 是纯函数: 相同输入 → 相同输出, 无隐藏状态"
    - "reducer 只认 stable id (logical_key), 不认 volatile id 或 index"
    - "sort/pin policy 和 focus restore 分开: sort 决定位置, focus 决定高亮"
    - "contract 只描述可观察结果, 不描述内部机制"
    - "一次 action 只产生一个 side_effect (Delete 用 DeleteEffects 复合携带 focus+close)"
    - "pin/unpin 不产生 focus 副作用"

# ─────────────────────────────────────────────────────────
# 8. 删除流程 (v3)
# ─────────────────────────────────────────────────────────
delete_semantics:
  unified_flow:
    step_1: "snapshot PaneGroupInfo + SessionNavigatorState"
    step_2: "reducer.Delete → DeleteEffects { focus, close }"
    step_3: "validate_transition (log on failure)"
    step_4: "apply DeleteEffects: Focus (若需要) → ClosePane/CloseTab"
    step_5: "adapter_hooks (见下)"
    step_6: "异步删 provider source"
    step_7: "finish: 只清 user state + sync, 不再 reselect"

  adapter_hooks:
    description: "纯 reducer 无法表达的 Workspace 兜底,在 apply 末尾执行"
    ensure_environment_tab: "删光某 env 的 live session 后 → ensure_environment_tab_for_authority"
    terminal_bootstrap: "切本地邻居 tab / 空窗口时 add_explicit_terminal_bootstrap_default_tab"
    refuse_last_pane: "唯一 tab 唯一 pane 且 CloseWindow 未启用 → 拒绝关闭并 toast"

  source_not_found: "视为成功 (Ok)"
  pinned_state_clear_failure: "只 log::warn, 不阻断"
  session_state_write_failure: "返回 Err 但不 panic"
  navigator_cache_cleanup: "从 deleting_workspace_session_keys 过滤"

  historical_v2:
    note: "已废弃,仅作考古。生产路径不再调用 preselect/reselect。"
    old_flow: |
      1. preselect_workspace_session_before_delete
      2. close_live_workspace_session_for_delete
      3. reselect_workspace_session_after_delete
    old_problems:
      - "preselect 可能跳到别的 tab, close_pane focus_next 无法留在同屏兄弟"
      - "preselect + reselect 重复选, 焦点跳两次"
      - "split pane 删除后焦点不留在同屏兄弟"

# ─────────────────────────────────────────────────────────
# 9. 边界条件全量覆盖 (v3 新增)
# ─────────────────────────────────────────────────────────
edge_cases:
  - id: "EC-01"
    name: "删除 split tab 中的一个 pane"
    expected: "focus 留在同 tab 的兄弟 pane, 不跳到别的 tab"
    reducer_rule: "delete → 多 pane → close_pane + FocusPane(prev_pane)"
    ship_status: covered

  - id: "EC-02"
    name: "删除唯一 pane 的 tab"
    expected: "focus 切到同 env 邻居 tab, 不重复选"
    reducer_rule: "delete → 唯一 pane → close_tab + FocusPane(邻居)"
    ship_status: covered

  - id: "EC-03"
    name: "删除窗口唯一 tab 的唯一 pane"
    expected: "不关窗 (adapter refuse 或留空/bootstrap tab)"
    reducer_rule: "delete → CloseTab, focus=None; adapter 可拒绝关窗"
    ship_status: covered

  - id: "EC-04"
    name: "当前聚焦项被删, 别的项还 selected"
    expected: "focus 给同 group 兄弟, 其他 selection 不变"
    reducer_rule: "delete → 多 pane → FocusPane(prev_pane)"
    ship_status: covered

  - id: "EC-05"
    name: "active session 被删 → 恢复 → pin"
    expected: "恢复后 active 跟随新 pane; pin 不改 focus"
    reducer_rule: "delete → Activate → Pin, 每步独立"
    ship_status: covered

  - id: "EC-06"
    name: "列表为空时插入新项"
    expected: "新项 is_active=false, order=0"
    reducer_rule: "Refresh → reconcile 分配 order"
    ship_status: covered

  - id: "EC-07"
    name: "多项同一时刻创建"
    expected: "updated_at 相同 → logical_key 升序兜底, 排序稳定"
    reducer_rule: "reconcile tie_breaker = logical_key ASC"
    ship_status: covered

  - id: "EC-08"
    name: "reorder 后 focus 跟随稳定 id"
    expected: "focus 不因 reorder 丢失, 跟随 logical_key; 同屏 split 邻接不被拆散"
    reducer_rule: "Reorder → 只改 display_order; selected_row_id 不变; same_window leaf 连续且相对序不变"
    ship_status: covered

  - id: "EC-09"
    name: "最后一项被删除时的 fallback focus"
    expected: "不关窗, 留空 tab"
    reducer_rule: "delete → 唯一 tab 唯一 pane → 不 FocusPane"
    ship_status: covered

  - id: "EC-10"
    name: "pin/unpin 后不改 selection 或 focus"
    expected: "pin 只改排序组, is_active / selected_row_id / focus 不变"
    reducer_rule: "Pin → NoEffect (focus)"
    ship_status: covered

  - id: "EC-11"
    name: "virtual row consume 时 RowId 连续"
    expected: "selected_row_id 保持原 opaque RowId；live identity 只新增 alias"
    reducer_rule: "Refresh → identity registry bind alias；禁止迁移 selection 或新建 position"
    ship_status: covered

  - id: "EC-12"
    name: "restoring 中用户切走"
    expected: "物理 highlight 跟随用户 focus；restoring lifecycle 与 Environment selection 保留"
    reducer_rule: "active_priority_chain: restoring > selected_row_id, live focus > restoring"
    ship_status: covered

  - id: "EC-13"
    name: "被删 session 的 active 不猜测转移"
    expected: "被删 session 是 active → 清除 selected_row_id, 走 focus 决策, 不猜 materialize"
    reducer_rule: "Delete: 清 selected RowId + lifecycle tombstone；identity reconcile 不猜测 active 转移"
    ship_status: covered

  - id: "EC-14"
    name: "跨 environment 删除"
    expected: "删除后 focus 留在被删 session 的 environment"
    reducer_rule: "delete → focus target 限同 env"
    ship_status: covered

  - id: "EC-15"
    name: "split pane fork 后焦点"
    expected: "新 pane 获得焦点"
    reducer_rule: "split_pane_fork → FocusPane(new_pane)"
    ship_status: covered

  - id: "EC-16"
    name: "tab 关闭后 focus"
    expected: "优先同 env 邻居 tab"
    reducer_rule: "delete → 唯一 pane → close_tab → 同 env 邻居"
    ship_status: covered

  - id: "EC-17"
    name: "同屏 split 组拖拽重排"
    expected: |
      拖组内任意行 = 整组平移; 落点不能插入同组 leaf 之间;
      展示不全仍以 tab:X 组为单位; selected_row_id 不变; 组内 leaf 相对序不变
    reducer_rule: "Workspace build_reorder_units → flatten → Reorder; validate same_window adjacency"
    ship_status: covered

# ─────────────────────────────────────────────────────────
# 9.5 可执行 UX 契约矩阵 (新增事件必须补一行并绑定测试)
