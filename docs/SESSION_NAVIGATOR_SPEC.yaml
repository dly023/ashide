    rule: "ID/test 唯一；字段完整；test 必须存在；action_write_ownership 与 reducer action/permissions 精确一致；生产 adapter 直接写 state slice 必须为 0；authority 与 transcript metadata parser 不得在 shared home 外出现第二套实现"

# ─────────────────────────────────────────────────────────
# 9.1 面向 AI 编程的原生变更契约
# ─────────────────────────────────────────────────────────
ai_change_contract:
  typed_boundary: "UI/adapter 只能发送 SessionNavigatorAction；不得直接拼接一套平行排序/激活流程"
  exhaustive_ownership: "transition_permissions 对每个 action 穷尽声明 position/selection/lifecycle 写权限；新增 variant 必须先通过编译器这一关"
  canonical_identity: "代码和测试统一使用 EnvironmentKey/RowId/identity registry 概念；禁止把 authority alias、tab index、volatile pane id 当领域身份"
  projection_boundary: "focus/hover/spinner 等渲染输入不得回写持久 selection/order，除非 SPEC 明确授权"
  persistence_boundary: "pane 可恢复性只能由 PaneNodeSnapshot::into_persistable 归一化；container identity 只能走 PaneConfiguration → LeafSnapshot → pane_container_identities；禁止在 SQLite saver/loader 或单个 UI 调用点补第二套身份/过滤分支"
  parallel_path_ownership_inheritance: "为性能/异步/热路径重写 projection、delivery 或 persistence 时，旧路径已执行的所有权门禁必须同次迁移到新路径的 static check，并附负向探针；只为新目标（不卡 UI、少锁）加门禁而遗漏同域 ownership 不得标 verified"
  live_identity_failure: "任何 is_live_container=true 的 WorkspaceSessionSnapshot 缺 container_uuid 必须立即失败；禁止为了容错退回 tab/leaf locator"
  stable_traceability: "每个用户可见契约使用稳定 matrix ID，并绑定一个真实存在的 test 函数"
  native_session_target_project_identity:
    owner: "NativeSessionProjectContext 是 shared native write plan 唯一可消费的 provider project identity；SessionIr.project_path 只属于 source metadata"
    local_resolution: "local backend 在目标文件系统 canonicalize source path；无 source path 时 canonicalize target home"
    environment_resolution: "Environment backend 使用 exact SessionId 调 resolve_environment_runtime_roots，并以 pwd -P 返回的 workspace_root 构造同一 NativeSessionProjectContext"
    failure: "目标路径不存在、不可进入、不可 canonicalize、runtime probe 失败或返回空路径时 fail closed，禁止创建部分 native history"
    forbidden_parallel_paths: ["source lexical project path 直接生成 Claude slug/cwd 或 Codex cwd", "用本机 canonicalize 代替 remote resolution", "planner fallback 到 SessionIr.project_path", "Claude/Codex 各自实现第二套 project resolver"]
  change_protocol: ["SPEC", "UX_MATRIX", "CHECK", "TEST", "GUI_VERIFY"]
  comment_policy:
    explain: ["状态所有权", "身份稳定性", "为什么某事件无权写某 state slice", "跨环境边界"]
    avoid: ["复述语法", "保留已删除旧路径的历史说明", "用临时 workaround 冒充领域规则"]

ai_programming_ux_principles:
  spatial_memory: "Resume/materialize 原位完成；agent 从历史记录变成 live terminal 时行不跳，用户不用重新寻找上下文"
  environment_memory: "每个 Environment 记住自己的 tab、pane、Session 顺序与 selection；在本地/远程代码库间往返像切 workspace，而不是重置 UI"
  background_safety: "后台 agent refresh、remote connect、状态更新只更新所属环境，不抢输入焦点、不改变当前排序"
  identity_continuity: "同一个 agent session 在 indexed/virtual/restoring/live 阶段保持同一 RowId，状态 chip 或 spinner 变化不制造新行"
  compact_native_actions: "Resume、Pin、Reorder、Fork/SessionBridge 使用同一行上下文与 typed action，避免跳转到管理页打断编码流"
  deterministic_feedback: "恢复中、失败、删除中等生命周期由 state machine 投影；重复点击可判定，失败可回滚，不依赖时间猜测"

# ─────────────────────────────────────────────────────────
# 10. 测试矩阵 (v3 新增)
# ─────────────────────────────────────────────────────────
test_matrix:
  # 10.1 单步 fixture 测试 (已有, 保留)
  single_step:
    - "pin 组切换不重排"
    - "refresh 已有 order 的行不跳"
    - "新建行置顶（更大 display_order）"
    - "resume 不跳"
    - "hidden 恢复原位"
    - "merge 不断言排序结果"
    - "sort 覆盖各排序键"

  # 10.2 序列型测试 (v3 新增)
  sequences:
    - name: "live/virtual rename → commit/cancel → cold restore"
      steps:
        - "一个 split Tab 含两个 live leaf，并有两个无关 virtual rows；每个 leaf 拥有不同 container UUID"
        - "从 Session Navigator 重命名第一个 live row → 只更新该 leaf 的 custom_vertical_tabs_title；兄弟 leaf、Tab group custom_title、virtual aliases 与顺序不变"
        - "Enter/Blur 在规范化标题变化后各只触发一次 App State save；Escape 不 mutation、不保存"
        - "重排 Tab/leaf 后同一 container UUID 保持标题；坐标复用的新 container 不继承旧标题"
        - "SQLite round-trip 后两个 leaf 标题按 container 恢复，Tab group title 仍独立"
        - "重命名 local 与 runtime virtual row → UI 共用 alias action，底层分别写 sidecar/RPC；materialize 后 alias 不覆盖 live title"
        - "空标题分别清除 live pane override 或 virtual alias，不生成空 owner"

    - name: "Resume keeps scanned title on live container"
      steps:
        - "local 与 runtime 各有一条 indexed virtual row（Specific 扫描标题）与两个无关 virtual rows"
        - "Resume 分配 placeholder/terminal → 种子写入 focused pane 的 custom_vertical_tabs_title，不写 Tab custom_title 作为 leaf label"
        - "RestoreStarted alias + Refresh collapse 后 Navigator 主标题仍是扫描标题，不退化为 agent 名 / OSC prompt / environment.label"
        - "用户再 Rename live row → Specific pane title 覆盖 indexed；清空 pane title 后再次吸收 indexed Specific"

    - name: "create → activate → pin → reorder → remove → restore focus"
      steps:
        - "新建 terminal pane → 检查 is_active=true"
        - "activate 另一个 session → 检查 focus 切换"
        - "pin 当前 session → 检查排序变但 focus 不变"
        - "reorder 列表 → 检查 selected_row_id 仍指向同一 opaque RowId"
        - "remove 当前 session → 检查 focus 到兄弟"
        - "restore 被删 session → 检查 focus 到新 pane"

    - name: "split → fork → delete one pane → focus stays"
      steps:
        - "split pane → 检查新 pane focused"
        - "fork conversation → 检查新 pane focused"
        - "delete 一个 pane → 检查 focus 留在兄弟"

    - name: "split group → drag group → adjacency preserved"
      steps:
        - "同 tab 两个 leaf + 旁侧 virtual 行"
        - "拖组内任一行跨过 virtual → 整组平移"
        - "两 leaf 仍相邻且 leaf 相对序不变"
        - "selected_row_id 不变"

    - name: "window A materialize → window B activate same durable session"
      steps:
        - "两个 Workspace 都显示同一 virtual CLI-agent session"
        - "window A Activate → 建立 live binding 或 pane-owned pending intent"
        - "window B Activate → 查询 app-wide owner"
        - "检查 window B 不创建 tab、不执行第二次 resume，并聚焦 window A owner pane"
        - "关闭 window A owner → durable terminal 进入 UndoRetainedRetiring，PTY 保持运行"
        - "让 undo item discard/expire → 主动 shutdown PTY，但继续持有 Retiring lease"
        - "PTY 未确认 exit 前 window B 再次 Activate → 不创建第二个 resume"
        - "TerminalModel 确认 exit 后再次 Activate → window B 才可 materialize"

    - name: "multi-tab delete → same-env neighbor"
      steps:
        - "创建 3 个 tab (2 local + 1 remote)"
        - "删除中间的 local tab → 检查 focus 到另一个 local tab"

    - name: "virtual → live materialize → active 迁移"
      steps:
        - "有 virtual row, selected_row_id 指向它"
        - "activate 它 → spawn terminal"
        - "terminal materialize → 检查 selected_row_id 保持原 opaque RowId"
        - "检查 live identity alias 解析到同一 RowId，且 position 未变化"

    - name: "restoring → user switch away → materialize"
      steps:
        - "activate virtual row → restoring"
        - "用户切到另一个 pane"
        - "spawn 完成 → materialize"
        - "检查 restoring 行保持 active highlight, 但物理焦点在用户选的 pane"

  # 10.3 纯 reducer oracle 对照测试 (v3 新增)
  reducer_oracle:
    description: "对每个 action, 用独立实现的 oracle 验证 reducer 输出"
    oracle_inputs:
      - "各种 session 组合 (live + virtual + mixed)"
      - "各种 pane group 结构 (单 pane / 多 pane / 多 tab)"
      - "各种 active/restoring/deleting 状态组合"
    oracle_checks:
      - "is_active 只有一个 true (或零个)"
      - "focus target 存在且稳定"
      - "deleting session 从列表消失"
      - "pin 不改 is_active"
      - "sort 结果与 sort_intent_chain 一致"

  # 10.4 排序稳定性测试 (v3 新增)
  sort_stability:
    - "相同 sort key 的多个 session, 排序结果稳定 (多次排序结果相同)"
    - "updated_at 变化后, 已有 order 的行不跳"
    - "新增行拿到更大 order, 排在非 pin 组顶端, 不影响已有行相对序"
    - "pin 组切换后, 组内顺序不变"
    - "reorder 不得拆散 same_window split 邻接 (EC-17)"

  # 10.5 tie-break 测试 (v3 新增)
  tie_break:
    - "同一时刻创建的多个 session → logical_key 升序"
    - "updated_at 为 None 的行排最后"
    - "label 相同 → logical_key 兜底"
    - "materialize 后 identity 变化 → order 不丢 (用 opaque RowId)"

  # 10.6 预检查 / state transition validator (v3 新增)
  validator:
    description: "纯确定性检查, 在每次 action 前后运行"
    checks:
      - "每个操作的前后状态完整 (sessions 非空时至少有一个 active 或有 focus target)"
      - "newest-first 的插入位置正确"
      - "focus restoration 的目标存在且稳定"
      - "新建并激活后不能 pin / move-to-top (如果适用)"
      - "deleting session 不在 sessions 中"
      - "restoring session 的 key 存在于 sessions 中 (除非已 materialize)"
      - "selected_row_id 指向的 session 存在于 sessions 中 (除非正在 restoring)"
      - "Reorder 后同 tab live leaf 必须连续且 leaf 相对序不变"

  environment_navigation:
    - "ENV-SW-01/02: local 与 remote 往返均恢复各自上次激活 tab"
    - "ENV-SW-03: remembered tab 关闭后同环境 fallback 并修正记忆"
    - "ENV-SW-04: tab reorder 后仍按 pane_group EntityId 恢复"
    - "ENV-SW-05: background remote connect/root resolution 不抢 local focus"
    - "ENV-SW-06: 同 authority snapshot 元数据变化后关闭 active tab仍留在同环境"
    - "ENV-SW-07: disconnect multi-tab remote 清除全部 remote tabs 与 remembered tab"
    - "ENV-SW-09: 多窗口 Environment runtime 使用 app-global SessionId；transport 事件只能进入拥有该 session 的 Workspace"
    - "ENV-SW-08: switch 后 new tab/agent/split 继承当前环境"
    - "SN-CROSS-AGENT-SPLIT-LAYOUT-PARITY-01: split-pane agent 无论 local、connected runtime 或 connecting placeholder，均插入 root-right，并优先保证 400px；仅当空间不足时，按其余可见 pane 的硬性最小尺寸计算最大可行宽度；materialize 不改变布局合同"

# ─────────────────────────────────────────────────────────
# 11. 标签名解析 (Label Resolution)
# ─────────────────────────────────────────────────────────
label_resolution:
  priority_chain:
    - "live container: PaneConfiguration.custom_vertical_tabs_title (通过 LeafSnapshot 投影；alias 无权覆盖)"
    - "virtual container: durable alias (user_state.aliases, 通过 durable key 查找)"
    - "display_title (agent session 的 query → summary → fallback_title)"
    - "Tab/pane-group custom_title 只用于 Tab group，自身不进入 leaf/session label"
    - "environment_label (环境名, 最后兜底)"
  enrichment_contract:
    initial_visibility: "Codex session_index.thread_name、Claude history title、Ashide user alias 必须在列表首次 scan/Refresh 即可见"
    lifecycle_independence: "Resume/Activate 只能改变 selection/lifecycle/physical binding，禁止承担 label metadata 加载"
    source_quota: "实体 source 与 sidecar metadata 先按 durable identity 聚合，再按逻辑会话数量应用 limit"

# ─────────────────────────────────────────────────────────
# 11.1 刷新交付与 UI 线程边界 (Refresh Delivery)
# ─────────────────────────────────────────────────────────
refresh_delivery:
  id: "SESSION-NAVIGATOR-REFRESH-ASYNC-01"
  canonical_owner: "EnvironmentTable 的 authority-scoped IndexedCliAgentSessionScanToken + Workspace refresh generation"
  local: "UI action 只捕获 enabled_agents / observed_agents 并开始 token；provider store 的目录、JSON/JSONL 读取必须经 spawn_blocking 在 worker 执行。完成回调只能提交 current token 的 typed outcome。"
  runtime: "UI action 只开始 token；RPC 由 async transport 执行。完成回调遵守与 local 相同的 current-token atomic commit 与 refresh-generation feedback 规则。"
  coalescing: "同 navigation authority 的有权 PassiveProjection 遇到 in-flight token 时只合并，不得创建 replacement token；UserInitiated 必须创建 replacement token 以抢占停滞 worker，随后有权 passive event 合并到该 token。"
  trigger_ownership: "PassiveProjection 的生产调用方集合必须 fail-closed：初始 Workspace authority discovery、history-enabled 设置变化、provider source mutation 成功、runtime target HOME 首次物化、agent-bound carrier 移除，以及通用 passive action wrapper。TerminalSessionBootstrapped/split/普通 terminal 新建关闭无权启动 provider discovery。"
  forbidden: ["在 WarpUI action/render/main callback 内同步扫描 provider store", "用 debounce/sleep/TTL 猜 source freshness", "generic terminal bootstrap 或 split 启动 provider discovery", "被动 lifecycle event 连续替换同 authority token令所有 completion stale", "stale completion 覆盖 rows 或 refresh feedback", "source-missing/failure/cancel 清空 canonical rows"]
  visible_semantics: "扫描期间旧会话列表保持可交互；只有显式用户 Refresh 的当前 Navigator header 图标显示 spinner，完整成功后静默结束 spinner 并只重绘一次 committed projection；失败、取消或 source-missing 保留已提交 collection。显式失败可发一个 operation-keyed transient error，绝不显示全局开始/成功 toast 或将 partial preserved 称为完整成功。"

# ─────────────────────────────────────────────────────────
# 12. 测试约束 (Test Constraints)
# ─────────────────────────────────────────────────────────
test_constraints:
  isolation: "所有测试用 tempfile::TempDir 隔离"
  snapshot_helper:
    test_workspace_session_in_environment: "is_live_container 是显式来源事实；所有 live fixture 必须提供稳定 container_uuid，禁止由 tab locator 推断身份"
    test_indexed_session_snapshot: "构建后立即 is_pinned_by 预赋值"
  merge_test_rule: "merge 测试断言 sources 原始顺序, 不断言排序结果"
  sort_test_rule: "排序测试覆盖: pin 组切换不重排 / 新建置顶 / refresh 已有行不跳 / resume 不跳 / hidden 恢复原位"

# ─────────────────────────────────────────────────────────
# 13. 本发布覆盖状态 (ship checklist)
# ─────────────────────────────────────────────────────────
ship_coverage:
  production_delete: "unified_flow via reduce(Delete) + DeleteEffects; no preselect/reselect"
  production_activate: "live FocusPane + virtual SpawnTerminal via apply_session_navigator_side_effect"
  production_focus: "activate_tab_internal + Event::PaneFocused → notify/sync; restored marker not overwritten by live key"
  production_refresh: "single reduce(Refresh) path; identity reconcile owns §6.4; no preferred_active_* dual-path"
  production_reorder: "group-aware UI (split tab = one drag unit) → flatten → reduce(Reorder); selected_row_id + same_window adjacency preserved"
  workspace_integration:
    - "EC-01 test_deleting_split_pane_session_keeps_focus_on_sibling_in_same_tab"
    - "EC-02/16 test_deleting_local_tab_session_focuses_same_env_neighbor_tab"
    - "EC-03/09 test_deleting_only_live_local_session_does_not_close_window"
    - "EC-08/17 test_reorder_session_navigator_sessions_keeps_selected_row_id + split group reorder"
    - "EC-10 test_pin_workspace_session_does_not_change_focus"
    - "EC-14 env delete suite (test_deleting_*_environment_*)"
    - "ENV-SW-01/02 test_switching_between_environments_restores_each_last_active_tab"
    - "ENV-SW-PANE-01 test_switching_between_environments_preserves_each_active_pane"
    - "ENV-SW-03/04 test_environment_last_active_tab_fallback_and_reorder"
    - "ENV-SW-05 test_environment_runtime_root_resolution_updates_non_active_environment_tab_without_stealing_focus"
    - "ENV-SW-06 test_closing_active_tab_prefers_same_navigation_environment"
    - "ENV-SW-07 test_disconnect_environment_closes_all_authority_tabs_and_restores_local"
    - "ENV-SW-09 test_environment_runtime_session_ids_are_global_across_workspaces"
    - "EC-19 test_cross_window_activation_reuses_existing_durable_session_owner"
    - "EC-20 canonical_codex_session_id_rejects_runtime_object_ids + shared_codex_metadata_never_promotes_response_item_message_id + test_codex_explicit_resume_command_uses_cli_session_uuid"
    - "EC-21 test_closed_window_retains_durable_session_ownership_until_terminal_exit"
    - "SN-INTRA-READONLY-PERSIST-01 persistable pane tree 在 SQLite 前裁剪只读/transient leaf 并折叠 branch"
    - "SN-INTRA-CONTAINER-PERSIST-01 所有 leaf pane 的 container UUID 独立于 terminal runtime UUID 跨冷启动保持"
    - "SN-ENV-PLACEHOLDER-IDENTITY-01 runtime placeholder 跨 Environment 往返不退回布局坐标身份"
    - "ENV-SW-08 existing environment-scoped new terminal/agent/split inheritance suite"
    - "SN-CROSS-AGENT-SPLIT-LAYOUT-PARITY-01 test_agent_mode_pane_minimum_size + agent_split_layout_contract_is_shared_by_real_and_loading_panes"
  reducer_unit: "session_navigator_reducer_tests (EC-01..17 + sequences + combinatorial oracle + validator)"
  deferred: []
