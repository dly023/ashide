# Ashide Session Navigator 语义规范 v42
#
# 这是 Session Navigator 排序、合并、置顶、删除、恢复、focus/active/selection
# 行为的唯一权威定义。代码实现和所有测试必须与此 spec 一致。
# 当 spec 与代码冲突时,以 spec 为准;修改行为先改 spec 再改代码。
#
# v42 变更摘要:
#   - Omp 顶层 JSONL 只有在 metadata prefix 含合法 session header 时才是可恢复会话；
#     provider 自身产生的 headerless diagnostic-only 文件不是 malformed session，必须从候选集合排除
#   - 合法 header 的 id/filename 不一致及读写/解析错误仍使完整 generation 失败；local/runtime 共用分类器
#
# v41 变更摘要:
#   - PassiveProjection 只允许由可能改变 provider 历史集合的语义事件触发：初始 authority
#     discovery、history-enabled 设置变化、source mutation 成功、runtime HOME 首次就绪、
#     agent-bound carrier 移除；generic terminal bootstrap/split 只提交 live projection，禁止扫描 provider store
#   - 显式 Refresh 仍无条件重扫；现有 authority token 合并、完整提交与失败保留语义不变
#
# v40 变更摘要:
#   - Session Navigator 只有显式 Refresh action 才拥有用户可见 refresh generation；进度只投影到
#     Navigator header 图标，完整成功静默收敛，失败才按同一 operation identity 给出一次 transient toast
#   - PassiveProjection（启动、设置、pin/reorder/source/runtime reconciliation）合并现有 scan，绝不抢占、
#     不改变用户 progress、也不发全局反馈；SourceMissing/Cancelled/partial preserved 不得伪称完整成功
#
# v39 变更摘要:
#   - local TerminalBootstrap 的普通 live terminal 不属于 Session Navigator；只有
#     canonical PaneConfiguration binding 或 Ashide conversation 的 AgentTerminal 可作为 live row
#   - 关闭 agent-bound pane/tab 后立即对其 authority 发起一次 passive native-history refresh；
#     live carrier 消失后由已提交/刷新到的 native virtual history 接管，禁止把 tab 坐标另存为历史
#   - local session_state.json 与 WindowSnapshot restored targets 在读写边界清理旧的
#     generic local pane key / non-agent virtual row，不保留错误 terminal 历史配置
#
# v38 变更摘要:
#   - Session Navigator 直接扩展既有 AgentSessionDiscoveryPlan，不创建第二套 AI Vault；
#     Droid/OpenCode/Copilot/Pi/Cursor/Antigravity 与 Claude/Codex/Omp 共用
#     EnvironmentTable generation、完整提交、身份、排序、Resume 与 local/runtime 语义
#   - provider store 由 registry descriptor 穷尽声明 root/source shape/parser/resume；
#     OpenCode legacy JSON 与 SQLite 先按 provider session id 去重，SQLite 为新格式正本
#   - 当前 Environment 工作目录中的旧会话不受全局 recent limit 淘汰；任何 provider
#     解析失败仍保留上一 committed collection，禁止逐文件 issue 形成成功子集
#
# v37 变更摘要:
#   - 同 authority 的被动 Session Navigator refresh 必须合并到当前 in-flight
#     token；不得由 terminal bootstrap/source reconciliation 连续替换 token，
#     令所有后台 completion 都成为 stale
#   - 显式用户刷新不合并，必须能抢占一个可能停滞的旧 scan；其后到来的被动 refresh
#     再合并到新的 token，保证用户点击可获得一次可提交的完整结果
#
# v36 变更摘要:
#   - Omp 的发现与远端 native mutation 共用唯一正本 source shape：
#     `sessions/<project-bucket>/*.jsonl`
#   - cache、backup、tool log 和更深层路径必须在 helper allow-list 处 fail-closed，
#     拒绝物理副作用后保留 optimistic row 并走既有 rollback
#
# v35 变更摘要:
#   - Resume 点击消费已提交的 render model，禁止在 UI action 热路径重做全量 pane/source snapshot
#   - 会话图标状态明确区分 restoring、Agent execution、focused live、background live 与 historical
#
# v33 变更摘要:
#   - Agent provider/session binding 唯一归 PaneConfiguration，Navigator/placeholder 禁止后补 metadata
#   - restore finalize 使用 typed success/retryable/cancel/model-broken transition，禁止 log-and-return
#   - pane snapshot 在 identity allocation 前验证 content，missing content 零副作用失败
#
# v32 变更摘要:
#   - live Session Navigator 行重命名归 PaneConfiguration 容器标题所有，virtual row 才使用 authority-scoped alias
#   - Tab custom_title 只命名整个 pane group，不得复制为每个 live leaf/session 的标题
#   - 标题 mutation 只在 inline editor commit 后保存 App State，打开编辑器与取消不产生持久化副作用
#
# v31 变更摘要:
#   - Runtime transport restart/disconnect 必须携带 typed cause，显式 restart 不得回流成二次 reconnect
#   - 自动 readiness 调用方等待既有 active generation，只有显式用户 retry 可 force restart
#
# v30 变更摘要:
#   - 用户 split action 归 Workspace active Environment authority 所有，focus 仅是呈现状态
#   - 删除 PaneGroup 的 Environment terminal options 缓存与直接 PaneGroupAction::Add 用户绑定
#
# v29 变更摘要:
#   - Environment Runtime 的所有 materialization 调用方必须先建立 pane-owned owner，再允许启动 transport
#   - 冷恢复使用 typed preparation reason，保留 persisted pane tree/container UUID，且不得把 Error 当作显式重连
#
# v28 变更摘要:
#   - 冷恢复 active Runtime placeholder 必须复用 visible-activation preparation，重建非持久化 pending intent 后再 ensure transport
#
# v27 变更摘要:
#   - Provider picker 打开新 Runtime Environment 必须始终创建语义 entry intent；无 startup command 时使用共享 PlainTerminal intent
#
# v26 变更摘要:
#   - EnvironmentTable 持有 indexed-session scan generation，旧异步成功结果禁止覆盖新 canonical collection
#
# v25 变更摘要:
#   - reducer action 与 render 共用同一个刷新后的 SessionNavigatorModel，禁止 action 层拆读 sessions/state
#
# v24 变更摘要:
#   - Environment target HOME/root materialize 完成后由统一 backend passive refresh 投影历史 rows，禁止 Connected-before-HOME 空窗与 / fallback
#
# v23 变更摘要:
#   - SessionBridge native write-back 的 provider project identity 由目标 execution environment canonical path 唯一决定
#   - local canonicalize 与 remote exact SessionId + pwd -P 只在底层 path-resolution 分叉，共享 writer 禁止读取 source lexical path 猜 target identity
#
# v22 变更摘要:
#   - remote transfer 以 begin total_size + exact cursor 校验 snapshot 完整性，截断/增长/跳 offset fail closed
#
# v21 变更摘要:
#   - inode-pinned file transfer registry 收敛到 ConnectionState，handle 只在 owner namespace 定位
#
# v20 变更摘要:
#   - remote buffer Save/Resolve 使用 per-file 单 active + FIFO queue，一个事件只完成一个 intent
#   - active mutation owner 断连不释放 serialization slot，queued carrier 缺失才取消
#
# v19 变更摘要:
#   - executor、in-flight request 与 PTY 收敛到 ConnectionState，locator 不再作为 daemon-global ownership key
#   - remote PTY write/resize/close 必须经过当前 connection owner lookup
#
# v18 变更摘要:
#   - remote command executor 与 in-flight request 显式绑定 ConnectionId 并随断连清理
#
# v17 变更摘要:
#   - helper connection 将 sender/handshake phase/snapshot state 收敛为单一 ConnectionState
#   - 未成功 Initialize 的连接禁止进入任何 Session Navigator 相关 RPC
#
# v16 变更摘要:
#   - remote helper Initialize 显式双向校验 protocol revision，旧 helper/旧 client 均 fail-closed
#   - source/dev 不兼容协议 slot 升为 dev-pty-v2，不能依赖 protobuf unknown-field 兼容
#
# v15 变更摘要:
#   - SessionBridge Conversation source 固定归当前 app store，Environment authority 只保留执行/目标上下文语义
#   - 历史编辑 cold read 复用 SessionBridgeEnvironment capability，高层不再按 runtime authority 拒绝
#
# v14 变更摘要:
#   - indexed CLI sessions 与 alias/pin cache 统一归 EnvironmentTable
#   - Navigator 只表达 authority-scoped source/user-state capability，不再选择 local sidecar 或 runtime RPC
#   - 既有 Environment backend 统一 optimistic mutation/rollback 与 scan completion，只保留底层 I/O timing 差异
#
# v13 变更摘要:
#   - Resume 与所有 Environment entry 统一为 semantic container allocation → backend delivery
#   - PaneConfiguration 在 runtime 出现前持有 provider/session binding，placeholder/terminal replacement 只替换执行载体
#   - local/runtime 只允许 delivery 完成时机不同；Navigator snapshot/reducer 禁止 remote overlay
#   - provider registration 只确认 runtime attachment，不得首次创建 semantic identity
#
# v12 变更摘要:
#   - provider source identity 绑定 authority，跨 authority read/delete fail-closed
#   - restore backend 只按 typed authority capability 分发，connection_ref 不再决定 local/runtime
#   - pane-owned intent 在 transport failure 后可重试；所有 close path 统一进入 Retiring lease
#   - Codex canonical UUID 覆盖 plugin/OSC/SessionBridge 全部 ingress
#
# v11 变更摘要:
#   - window/pane owner 关闭后，durable session 在 PTY 确认退出前进入 app-wide retiring lease
#   - retiring lease 是 ownership 生命周期的一部分；禁止 UI owner 消失后立即启动同 identity 的第二个进程
#   - 关闭 owner 必须主动 shutdown PTY；lease 仅由 TerminalModel exit truth 释放，不用 timeout 猜测
#
# v10 变更摘要:
#   - Codex provider session identity 只能来自 session_meta / 显式 session_id 字段
#   - response_item.payload.id（msg_/fc_ 等事件对象 ID）不得进入 durable identity 或 resume command
#   - Codex resume 命令边界只接受 canonical UUID 或 rollout 名末尾 UUID，解析层与执行层双重 fail-closed
#
# v9 变更摘要:
#   - 同一 durable agent/conversation identity 在整个 App 内只能有一个 live 或 materializing owner
#   - 其他窗口激活同一会话必须导航到既有 owner，禁止再次 spawn/resume
#   - ownership 由 WorkspaceRegistry 派生自 live pane + pending materialization，不复制持久状态
#
# v8 变更摘要:
#   - Environment authority 字符串协议收敛到 ParsedEnvironmentAuthority 唯一类型化 parser
#   - local/runtime capability、navigation key、SSH connection ref 与 display label 必须由同一 parse result 派生
#   - app_state、EnvironmentTable、runtime/provider 与 Session Navigator 禁止自行 strip_prefix/starts_with
#
# v7 变更摘要:
#   - 所有 live pane 的身份统一收敛到 PaneConfiguration.container_uuid
#   - LeafSnapshot/SQLite 显式持久化 container UUID；terminal runtime UUID 不再兼任 UI 容器身份
#   - live container 缺 UUID 立即失败，禁止退回 tab/leaf locator
#   - runtime placeholder 与 Welcome 等非 terminal pane 同样获得稳定身份
#
# v6 变更摘要:
#   - app-state pane tree 在进入 SQLite 前统一裁剪不可恢复 leaf 并折叠 branch
#   - read-only transcript/provider/runtime-only pane 不得冷恢复成另一种可写语义
#   - SQLite 只接受结构完整的 persistable tree，禁止遍历期间静默跳 leaf
#
# v5 变更摘要:
#   - live terminal 稳定容器身份改为 pane UUID；tab:X:leaf:Y 降级为纯 locator
#   - identity/user-state key 统一归属 WorkspaceSessionSnapshot，删除各层重复拼 key
#   - local/remote sidecar 主动清理历史 tab/source:tab 键，不保留位置身份兼容债
#   - merge 对 source 顺序无关；virtual 先到时 live owner 仍必须接管 pane UUID/container
#
# v4 变更摘要:
#   - Environment 成为状态分区第一层;每个环境独立保存 rows/order/selection/lifecycle
#   - 新增稳定 RowId + identity registry;virtual/live 是同一行生命周期而非排序身份
#   - RowId 是 reducer 单调分配的 opaque row:N，永不复用 physical/durable/logical identity
#   - 位置状态与 active/focus/restoring 解耦;事件只能修改授权 state slice
#   - 删除 physical/durable 双 order 与 max/min 猜测桥接
#   - 外置 alias/title/pin 等 enrichment 在初次 scan/Refresh 即合并，不依赖 Resume
#
# v3 变更摘要:
#   - 新增 focus/active/selection 优先级链 (§6)
#   - 新增纯 reducer 契约 (§7): 所有列表变化走同一 reducer
#   - 修正 tie-breaker: 用 logical_key 不用 volatile id (§3)
#   - 修正删除流程: 统一 focus 决策,消除 preselect/reselect 重复 (§8)
#   - 修正 materialization 追踪: 显式迁移,不靠猜测 (§6.4)
#   - 新增边界条件全量覆盖 (§9)
#   - 新增测试矩阵: 序列测试 + oracle + 排序稳定性 + tie-break (§10)
#
# v2 = codex commit 8aef2d2 的隐式语义 (已废弃)
# v1 = 更早的隐式语义 (已废弃)

spec_version: 21
last_updated: "2026-07-29"

# ─────────────────────────────────────────────────────────
# 0. 内聚状态模型 (Cohesive State Model)
# ─────────────────────────────────────────────────────────
state_model:
  environment_authority:
    type: "ParsedEnvironmentAuthority"
    owner: "app/src/environment_authority.rs"
    variants:
      terminal_bootstrap: "local / local:<root>"
      saved_ssh: "ssh:<connection_ref> / ssh-config:<profile>"
      runtime: "container、WSL 与 custom authority；名称即稳定 authority identity"
    derived_capabilities: ["uses_terminal_bootstrap", "uses_runtime_environment", "navigation_key", "runtime_connection_ref", "display_label", "session_match"]
    invariant: "所有 consumer 必须先 parse 再读取 capability；禁止复制 starts_with/strip_prefix、fallback 分类或 display-label 链"
    connection_ref_precedence: "EnvironmentSnapshot.connection_ref 显式字段优先；缺失时只允许从 ParsedEnvironmentAuthority::SavedSsh 派生"
    custom_authority_rule: "locality:remote 等仅文本上以 local 开头的 custom authority 必须保持 Runtime，不得误归 TerminalBootstrap"
    plugin_host_scope: "CLI-agent environment_host_key 的 Some/None 只由 runtime capability 决定；SavedSsh 可把 connection ref enrich 为 transport target，custom/container/WSL runtime 缺 provider ref 时必须回退完整 authority，禁止降级为 local"


  provider_source_locator:
    id: "SN-SOURCE-AUTHORITY-LOCATOR-03"
    type: "EnvironmentCliAgentSourceLocator"
    fields: ["authority", "agent", "source", "provider_session_id"]
    invariant: "四个字段不可拆传播；encoded authority 与 snapshot authority mismatch 时 read/delete fail-closed"
    ownership_rule: "mutation executor 只消费 locator.authority，禁止当前 UI authority 覆盖 provider source ownership"

  restore_backend_dispatch:
    id: "SN-ENV-RESTORE-BACKEND-04"
    discriminator: "ParsedEnvironmentAuthority backend capability"
    invariant: "只有 TerminalBootstrap 可创建 current-app terminal；SavedSsh/Runtime 走 provider materializer或保留 virtual row并报错"
    forbidden_discriminator: "runtime_connection_ref presence"

  pane_owned_intent_retry:
    id: "SN-ENV-INTENT-RETRY-05"
    lifecycle: "Pending → Materializing → Committed；transport/helper/bootstrap failure 回到 Pending"
    consume_rule: "只有显式 pane/tab cancel 或 successful commit 可消费 intent"
    invariant: "authority failure 不得 drain 其他 pane intent，不得清 selection/restoring/container UUID"

  semantic_container_delivery:
    id: "SN-CONTAINER-ALLOCATION-DELIVERY-18"
    existing_abstractions: ["EnvironmentBackend", "PendingMaterialization", "PaneConfiguration", "WorkspaceSessionSnapshot"]
    lifecycle: "Allocated → Delivering → Live"
    allocation_rule: "所有 entry（PlainTerminal、StartupCommand、AgentView、ForkedConversation、SessionRestore）先分配 PaneConfiguration 容器；可知的 provider/session binding 必须在 runtime/terminal 对 Navigator 可见前提交"
    provider_open_rule: "Provider picker 激活已有 Environment container 时不得额外创建 terminal；当目标尚无 container、必须分配首个 placeholder 时，“打开 Environment”同时拥有创建首个 terminal 的语义意图：有 startup command 时创建 StartupCommand，否则由既有 active-placeholder reconciliation 创建 PlainTerminal。placeholder 不是可执行载体，无 pending intent 就没有 owner 可在 Connected 后 materialize execution carrier。"
    cold_restore_rule: "WindowSnapshot 只持久化 pane tree，不持久化 runtime pending queue；冷恢复必须保留 persisted pane tree、container UUID 与无关 tabs，并通过同一个 prepare_active_environment_after_activation(ColdRestore) 边界从全部 restored placeholders 重建 PlainTerminal owner，再 ensure transport，最后尝试 delivery。显式导航使用 UserVisibleActivation，只有该 reason 可重连 Error；禁止启动路径只 ensure transport、重新分配 container 或用 bool/fallback 表达 retry policy。"
    owner_before_transport_rule: "任何为了创建 terminal/agent/fork/startup/session-restore carrier 而启动 Runtime transport 的调用方，必须先分配 placeholder/loading pane 并原子写入 PendingMaterialization；split/spawn/cold-restore/provider 入口不得先 ensure transport 再补 owner。static check 与源码审计测试必须扫描整个生产 Rust 源码树，枚举所有 preparation/staging/spawn-plan/ensure/transport/bootstrap 调用点，同时锁定调用次数与 enclosing function owner 集合，并把真正启动 transport 与 post-control-master bootstrap 的副作用原语各锁定为唯一 canonical caller；primitive 的全部符号引用（包含定义、use alias、re-export、函数值转存与调用）也必须锁定 owner，禁止通过改写调用语法绕过 inventory；新增文件、包装入口、同文件内替换合法调用或未分类调用方必须 fail closed。"
    binding_home: "PaneConfiguration 是 container_uuid 与 provider/session binding 的同一容器语义 home；TerminalPane 只附着 runtime，并把新观察到的 provider binding 回写该既有 home"
    backend_rule: "EnvironmentBackend 消费同一 entry intent；TerminalBootstrap 可同步 delivery，Runtime 可异步 delivery，但高层 action、snapshot projection 与 reducer 不得分叉"
    replacement_rule: "placeholder → materializing terminal → live terminal 只替换 runtime carrier，必须保留同一 PaneConfiguration container UUID 与 semantic binding"
    snapshot_rule: "WorkspaceSessionSnapshot 只从 PaneConfiguration/container binding 与 pane runtime enrichment 投影；禁止读取 remote pending queue 后补 Navigator metadata"
    registration_rule: "CLIAgentSessionsModel registration 只能确认/更新 runtime attachment，不得首次建立 durable identity、RowId alias、label 或 Session Navigator membership"
    forbidden_parallel_paths: ["remote-only Navigator overlay", "materialization snapshot enrichment", "second session binding registry", "bootstrap-finalize identity creation", "debounce/delayed refresh/order freeze"]
    invariant: "delivery phase 与 terminal readiness 可以不同；row count、canonical RowId、display order、selection、container UUID、durable identity 与已知 provider metadata 必须逐阶段一致"

  canonical_agent_session_binding:
    id: "SN-CANONICAL-SESSION-BINDING-PROJECTION-60"
    existing_abstractions: ["PaneConfiguration.session_binding", "LeafSnapshot", "pane_container_identities.session_binding_json", "WorkspaceSessionSnapshot"]
    owner_rule: "PaneConfiguration 将 container UUID 与 provider/session binding 原子持有；Started/SessionUpdated 只能更新已存在 pane owner 并触发 App State save。"
    projection_rule: "live terminal、EnvironmentRuntimePlaceholder 与冷恢复 leaf 都只从 canonical pane binding 投影；Navigator 不读取 CLIAgentSessionsModel、command string、pending queue 或 source locator 后补 metadata。"
    identity_rule: "provider native session ID 可晚到，但必须作为同一 binding transition 持久化；container identity、RowId 与 order 不因 enrichment 改变。"
    carrier_missing_rule: "Agent-bound live/materializing container 缺 binding 属于模型破坏，立即失败；禁止 fallback 到 tab/leaf locator、terminal UUID、EntityId 或 environment authority。"
    forbidden_parallel_paths: ["Navigator CLIAgentSessionsModel enrichment", "placeholder metadata reconstruction", "render-time provider binding", "command-derived cold binding"]

  local_agent_history_membership:
    id: "SN-LOCAL-AGENT-HISTORY-MEMBERSHIP-67"
    existing_abstractions: ["Workspace::live_workspace_sessions", "PaneConfiguration.session_binding", "WorkspaceSessionSnapshot", "EnvironmentTable indexed session cache"]
    membership_rule: "TerminalBootstrap/local 的普通 live Terminal 在 canonical live projection 即排除；只有 AgentTerminal（canonical CLI binding 或 Ashide conversation）可进入 Navigator merge。SavedSsh/Runtime 的 live Terminal 不受该 local rule 影响。"
    persistence_rule: "agent-bound pane 的 PaneConfiguration binding 随 container 生命周期保存；被动 projection、agent 进程退出与同一 tab 内再次 resume 都不得清 binding 或降级 live row。"
    close_rule: "手动关闭含 agent binding/conversation 的 pane 或 tab 后，先移除 live carrier，再对关闭 authority 发起一次 PassiveProjection native-history refresh；已提交 indexed history 可立即接管，scan completion 必须保留 canonical collection 语义。"
    virtual_history_rule: "WindowSnapshot.restored_workspace_sessions 只能保存带 durable agent identity 或 Ashide conversation identity 的 virtual AgentTerminal；普通 Terminal、Welcome、Other、tab/leaf locator 或 generic pane 不是可恢复历史，读写边界必须清理。"
    local_user_state_cleanup_rule: "local session_state.json 不得保存 local::pane:<container_uuid> alias/pin；读取旧配置时原子移除。可恢复 native agent identity/source key 保留。"
    forbidden_parallel_paths: ["render-time local terminal hide", "tab-coordinate history snapshot", "generic terminal alias/pin sidecar", "remote terminal membership filter", "agent-exit binding clear"]

  typed_materialization_completion:
    id: "SN-MATERIALIZATION-ATOMIC-COMPLETION-ROLLBACK-61"
    existing_abstractions: ["EnvironmentBackend::deliver_entry", "PendingMaterialization", "PaneConfiguration", "EnvironmentTable"]
    ownership_rule: "EnvironmentTable 是 pending collection、monotonic generation、MaterializationTransition、MaterializationOutcome 与 MaterializationCompletion 的唯一 home；该协议覆盖 PlainTerminal/StartupCommand/AgentView/ForkedConversation/SessionRestore，禁止以 SessionRestore 命名通用完成状态。"
    lifecycle: "EnvironmentTable 原子持有 canonical pending projection：Allocated → Delivering(generation) → Live | Retryable | Cancelled；每个非终态必须有 exact container carrier。"
    success_rule: "current generation Success 原子消费 exact pending；调用方随后提交 live runtime，并保留 container UUID/binding/RowId/order/selection。"
