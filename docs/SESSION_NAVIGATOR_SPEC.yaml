      must_preserve: ["one_logical_row", "list_cardinality", "display_order", "canonical_row_id", "source_binding_before_first_projection", "unrelated_rows"]
      test: "test_terminal_bootstrap_resume_allocates_bound_container_before_projection"
    - id: "SN-ENV-ALL-INTENTS-CONTAINER-DELIVERY-03"
