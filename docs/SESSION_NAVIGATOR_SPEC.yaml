    parity_rule: "local/runtime 共用同一 render identity builder；backend 差异只影响 carrier 到达时机，不影响 UI identity"
    forbidden_parallel_paths: ["physical session id element key", "tab leaf SavePosition", "provider id hover key", "physical detail target", "UI list freeze", "flicker masking animation"]

  atomic_render_model:
    id: "SN-SESSION-NAVIGATOR-ATOMIC-RENDER-MODEL-49"
    existing_abstractions: ["SessionNavigatorModel", "SessionNavigator reducer Refresh", "EnvironmentTable active_session_navigator_model", "SessionNavigatorRowIdentity"]
    owner_rule: "sessions、RowId registry、selection、restoring 与 display order 必须作为同一个 SessionNavigatorModel render snapshot 被消费"
    render_rule: "Vertical Tabs row list、row identity 和 detail sidecar lookup 必须从同一次 reduce_session_navigator_refresh 结果读取 sessions + state"
    parity_rule: "local/runtime 共用同一 render model；backend 只改变 carrier 到达时机，不得各自生成 UI projection"
    failure_rule: "刷新后的 sessions 配刷新前 state 属于模型破坏；禁止 separate reads、fallback identity、render overlay、list freeze 或 debounce"
    forbidden_parallel_paths: ["session list plus separate state snapshot", "UI-owned render cache", "physical fallback row key", "remote-only render adapter", "legacy tab scroll target"]

  atomic_action_model:
    id: "SN-SESSION-NAVIGATOR-ATOMIC-ACTION-MODEL-50"
    existing_abstractions: ["SessionNavigatorModel", "Workspace::session_navigator_model", "session_navigator_reducer::reduce", "Workspace::apply_session_navigator_reduction"]
    owner_rule: "可点击的 Pin、Reorder、Activate、Restore lifecycle、Delete 目标必须来自当前已提交 SessionNavigatorModel；用户点击屏幕上已渲染的 RowId 时，action 直接消费这份 sessions/state，不得在 UI 热路径重新 snapshot 全部 PaneGroup/source。后台 source/live mutation 必须在 notify/render 前通过 canonical sync 提交。"
    lifecycle_rule: "rendered action target 与 committed model 属于同一代；delivery 后只允许一次 canonical Refresh 把新 carrier、identity、selection/restoring 原子提交。不可见的新 source identity 先由 sync 获得 RowId/display_order，之后才可能产生点击 action。"
    parity_rule: "local/runtime 只在 carrier delivery 时机不同；两者的 committed action input、reducer、identity、position 和 lifecycle 完全共用"
    failure_rule: "点击时重新遍历全部 tabs/panes、构造 TerminalPaneSnapshot、或使用旧 state + 新 sessions 都属于热路径/半事务模型破坏；禁止 action-time speculative Refresh、lifecycle dispatch 内嵌 action_model、raw session helper、action 后补多次 sync、retry、freeze 或 UI masking"
    forbidden_parallel_paths: ["action-time full source refresh", "snapshot state then refresh sessions", "raw_session_navigator_sessions action input", "backend-specific action adapter", "post-action identity repair", "duplicate post-delivery sync", "PaneGroup::snapshot Navigator live projection", "live_or_pending full live_workspace_sessions"]

  viewported_render_projection:
    id: "SN-SESSION-NAVIGATOR-VIEWPORTED-PROJECTION-69"
    existing_abstractions: ["EnvironmentTable active SessionNavigatorModel", "SessionNavigatorModel.revision", "SessionNavigatorRowIdentity", "ReorderUnit", "ListState", "VerticalTabsDetailTarget"]
    owner_rule: "SessionNavigatorModel 是唯一 membership/RowId/order owner；VerticalTabs 只在 committed model revision 或 query 改变时生成 render-only viewport projection。ListState index 只表示瞬时几何位置，禁止进入 RowId registry、selection、pin、alias、persistence 或 action target。"
    unit_rule: "每个 viewport item 必须对应一个 canonical ReorderUnit；split sibling rows 在同一 item 内渲染，insertion target 只出现在 unit boundary，禁止把 leaf/session row 作为独立 reorder/drop unit。"
    scroll_rule: "projection 变更时以旧 top item 的 stable unit identity + offset 映射新 index；新增/删除严格同步 ListState count，identity 或 content 变化的 index 必须 invalidate height，禁止全量每帧 invalidate。"
    sidecar_rule: "detail sidecar 只可锚定当前 viewport 内的 unit；虚拟化后不得信任 SavePosition 的离屏旧 rect，row 不可见或 anchor 缺失必须清理 overlay，不得 fallback 到 window 坐标。"
    parity_rule: "local/runtime 共用 committed model revision、ReorderUnit projection、RowId identity、scroll/sidecar语义；backend 只影响 model commit 时机。"
    forbidden_parallel_paths: ["render-time full session clone/filter/build", "index as persistent row identity", "leaf-level split drop target", "UI-owned membership cache", "offscreen SavePosition sidecar fallback", "per-frame ListState height invalidation", "backend-specific viewport adapter"]

  incremental_command_palette_search:
    id: "SN-SESSION-NAVIGATOR-INCREMENTAL-SEARCH-70"
    existing_abstractions: ["EnvironmentTable active SessionNavigatorModel", "Workspace::apply_session_navigator_reduction", "WorkspaceRegistry", "SessionNavigationData", "command palette navigation DataSource"]
    owner_rule: "SessionNavigatorModel 的 committed membership、RowId 与顺序是唯一 searchable document source。WorkspaceRegistry 只按 WindowId 保存瞬态 projection partition；WindowId、PaneViewLocator 与 Tantivy document id 都不得成为持久 identity、selection、pin、alias 或恢复 target。"
    projection_rule: "每次 canonical reducer commit 只能由 Workspace 发布对应 window 的完整 projection。live terminal 仅能 enrich 已存在 live row 的 prompt/render data；carrier 暂缺时必须从同一 committed snapshot materialize restore target，禁止用 stale locator 新增 row 或把未观察到的 live carrier 解释为删除。window close 必须清除该 partition。"
    query_rule: "command-palette fuzzy/full-text query 只匹配已发布 projection；禁止 query 内枚举 window、Workspace、PaneGroup 或调用 SessionNavigationData::all_sessions。Tantivy rebuild 只能由 WorkspaceRegistry projection-change event 在输入热路径外执行；generation 不一致必须 fail closed，不得 query-time rebuild。"
    parity_rule: "local/runtime 共用同一 committed SessionNavigatorModel → WorkspaceRegistry → DataSource 语义；backend 只能影响 canonical commit 与 event 到达时机。"
    failure_rule: "禁止 search-side membership discovery、WindowId/locator 持久化、live-only second collection、query-time Tantivy rebuild、stale generation 返回旧 documents、关闭 window 后残留 documents。"
    forbidden_parallel_paths: ["app.window_ids search traversal", "app.views_of_type::<Workspace> search traversal", "SessionNavigationData::all_sessions query path", "search-owned live membership overlay", "query-time create_searcher/build_index", "tab/leaf-derived document identity"]

  keyboard_navigation_surface:
    id: "SN-SESSION-NAVIGATOR-KEYBOARD-CURSOR-72"
    existing_abstractions: ["SessionNavigatorRowIdentity", "VerticalTabsPanelState", "SessionNavigatorViewportProjection", "ListState", "WorkspaceAction::ActivateRestoredWorkspaceSession"]
    owner_rule: "EnvironmentTable SessionNavigatorState 的 selected_row_id 继续只表达 canonical Navigator selection；VerticalTabsPanelState 仅持有不可持久化的 keyboard cursor，并且 cursor 唯一身份必须是 SessionNavigatorRowIdentity（canonical RowId + environment navigation key）。"
    projection_rule: "cursor 只在当前 committed、query-filtered viewport rows 中归一化；query、committed model revision、pin/order、split membership 或 virtual-to-live carrier 替换后，保留同一 stable identity，缺失时清空。ListState index 只用于几何 scroll-to-visible，绝不成为 cursor/persistence/action identity。"
    action_rule: "Up/Down 在 flattened visible row projection 中移动；Enter 只能 dispatch 既有 ActivateRestoredWorkspaceSession typed action。Refresh、rename、pin、delete 必须继续走各自既有 WorkspaceAction/reducer，禁止 UI 第二套 mutation path。"
    focus_rule: "Escape 清空 transient cursor，并在 query 非空时只清 query；query 已空时恢复 active tab focus。keyboard cursor 不得覆盖 Environment-owned canonical selection，也不得写入 SQLite、WorkspaceState 或 session snapshot。"
    parity_rule: "local/runtime 共用 committed viewport projection、row identity、typed action 与 cursor cleanup；backend 只影响 model revision 到达时机。"
    forbidden_parallel_paths: ["tab/leaf/index/EntityId cursor", "cursor writes SessionNavigatorState::selected_row_id", "keyboard-owned session mutation", "query-time membership discovery", "persistent cursor/user-state sidecar", "backend-specific keyboard adapter"]

  indexed_session_scan_transaction:
    id: "SN-ENVIRONMENT-INDEXED-SESSION-SCAN-TRANSACTION-51"
    existing_abstractions: ["EnvironmentBackend::refresh_indexed_sessions", "EnvironmentTable indexed sessions", "Environment runtime SessionId", "SessionNavigatorModel", "SessionNavigator reducer Refresh"]
    owner_rule: "scan generation 与 canonical indexed collection 必须由同一个 EnvironmentTable navigation-key partition 原子持有"
    lifecycle_rule: "scan start 分配 token；completion 校验 navigation key + runtime SessionId + generation；只有当前完整成功结果替换 collection，失败/取消/stale 保留旧 collection"
    parity_rule: "local 同步 scan 与 runtime 异步 scan 共用 commit contract；只允许 delivery timing 不同"
    failure_rule: "旧成功子集覆盖较新完整结果属于模型破坏；禁止 UI/reducer cache、列表冻结、debounce/retry 或永久保留缺失行"
    forbidden_parallel_paths: ["callback-only SessionId guard", "unversioned destructive collection replace", "Vertical Tabs membership cache", "reducer preserve-all-missing rows", "remote-only list adapter"]

  expanded_provider_discovery:
    id: "SN-EXPANDED-PROVIDER-DISCOVERY-65"
    existing_abstractions: ["AgentRecord", "AgentSessionDiscoveryPlan", "AgentSessionDiscoveryRecord", "CliAgentStoreRoots", "EnvironmentTable indexed session scan generation", "EnvironmentBackend::refresh_indexed_sessions", "SessionNavigatorModel"]
    provider_rule: "Droid、OpenCode、Copilot、Pi、Cursor 与 Antigravity 作为现有 CLIAgent 的 persisted-session provider 加入同一 registry descriptor；Claude、Codex、Omp 与这些 provider 由同一个 plan 穷尽选择、扫描和投影。禁止创建 AI Vault、第二个 sidebar、provider switch 或 UI-owned source registry。"
    source_rule: "每个 descriptor 唯一声明 target-HOME 派生 root、允许的正本 source shape 与 parser；OpenCode 同时读取 legacy storage/session/**/*.json 与 ~/.local/share/opencode/opencode*.db，按 provider session id 去重且 SQLite 记录优先。cache、backup、subagent/tool transcript 与非正本嵌套路径不进入顶层会话。"
    metadata_rule: "轻量 discovery record 至少持有 typed agent、provider session id、source、标题、启动 cwd 与更新时间；标题优先 provider title，再取首条可信真实用户消息，禁止把注入 context/tool/system 内容当用户标题。"
    scoped_rule: "当前 Environment 已知 workspace roots 下的会话必须在全局 recent logical limit 外保底合并；scope membership 只由 canonical cwd containment 决定，不复制 RowId/order/selection。"
    resume_rule: "所有新增 provider 只有存在公开原生 exact-session Resume argv 才可进入 can_index_sessions；Resume 继续走 EnvironmentEntryIntent::SessionRestore 与现有 allocate-then-deliver owner，禁止直接在 UI 拼命令或跨 host 恢复。"
    transaction_rule: "任一 enabled provider 的 root traversal、SQLite schema/read 或 metadata parse 失败使本 generation typed Failed，EnvironmentTable 保留上一完整 collection；不得移植 Orca 的 per-file issues + partial success 语义。"
    parity_rule: "local 与 runtime 执行同一个 descriptor plan 和 parser；差异只在 filesystem/SQLite 位于 current host 还是 helper target host，以及 completion timing。"
    protocol_rule: "ScanCliAgentSessions wire 仍只投影 typed CLIAgent 与 shared record；新增 provider 改变 request 语义，必须递增 REMOTE_SERVER_PROTOCOL_REVISION 并进入新 helper slot。"
    forbidden_parallel_paths: ["AI Vault panel", "second session collection", "renderer-owned provider scanner", "partial scan success with issues", "local-only provider parser", "runtime-only provider allow-list", "UI-built resume argv", "cwd scope fallback to lexical prefix"]

  omp_session_candidate_classification:
    id: "SN-OMP-SESSION-CANDIDATE-CLASSIFICATION-74"
    existing_abstractions: ["AgentSessionDiscoveryPlan", "parse_omp_discovery_record", "Omp native session listing", "EnvironmentTable indexed session scan generation"]
    candidate_rule: "sessions/<project-bucket>/*.jsonl 只是物理候选；metadata prefix 含合法 type=session header 且非空 id 后才成为可恢复 Omp 会话。只有 provider-native listing 同样排除的 headerless 文件可返回 NotSession；不得为其构造 filename-derived identity。"
    diagnostic_rule: "只含 session_exit 等 provider 诊断 entry、从未物化 session header 的文件不是会话实体，local/runtime discovery 都静默排除；这不是 per-file issue、partial-success 或兼容 fallback。"
    failure_rule: "一旦观察到合法 session header，header id 缺失、id 与 <timestamp>_<id>.jsonl 不一致、prefix I/O/JSON 元数据读取失败仍使本 generation typed Failed 并保留上一 committed collection；禁止把真实损坏会话伪装成 NotSession。"
    parity_rule: "local 与 runtime helper 编译并执行同一个候选分类器；dev helper freshness 输入必须包含 shared discovery/parser 源码，parser-only 改动不得复用旧 helper stamp。"
    forbidden_parallel_paths: ["skip every parser error", "filename-derived Omp identity", "remote-only orphan filter", "UI issue overlay", "stale dev helper after parser-only source change"]

  committed_render_projection:
    id: "SN-SESSION-NAVIGATOR-COMMITTED-RENDER-PROJECTION-52"
    existing_abstractions: ["EnvironmentTable active SessionNavigatorModel", "SessionNavigator reducer Refresh", "Workspace::sync_session_navigator_sessions", "SessionNavigatorRowIdentity"]
    owner_rule: "Vertical Tabs 与 detail sidecar 只能读取 EnvironmentTable 已提交的 SessionNavigatorModel；render query 不得自行执行 Refresh、分配 RowId 或引入 source membership"
    lifecycle_rule: "source/live/persistence mutation 先通过 sync/action path 原子 Refresh 并提交 owner model，再 notify/render；PaneGroup split/add/close 的 AppStateChanged 与 PaneFocused 共用同一 reducer commit；render 只允许基于已提交 model 计算无状态 focus decoration"
    parity_rule: "local 与 runtime 共用相同 committed projection；差异只留在 source delivery/materialization timing"
    failure_rule: "render-time speculative Refresh 会制造未提交顶部行、临时 RowId/display_order 与随后 canonical commit 的组件替换；禁止 UI cache、freeze、debounce 或动画遮挡"
    forbidden_parallel_paths: ["render-time reducer Refresh", "detail-sidecar speculative membership", "render Refresh masking a missing pane-change commit", "fallback physical row key", "render-owned projection cache", "backend-specific render adapter"]

  committed_focus_projection:
    id: "SN-SESSION-NAVIGATOR-COMMITTED-FOCUS-PROJECTION-59"
    existing_abstractions: ["EnvironmentTable active SessionNavigatorModel", "SessionNavigator reducer Refresh", "SessionNavigatorAction::PaneFocused", "Workspace::sync_session_navigator_sessions", "Workspace::session_navigator_action_model"]
    commit_rule: "canonical sync 必须先 Refresh membership，再从当前 focused live/pending carrier 解析 logical identity 并执行 PaneFocused，最后一次性提交 model；不得暴露 membership-only sync 选项。"
    ownership_rule: "PaneFocused 只计算 is_active projection，不修改 selected_row_id/restoring/deleting/order/pin/alias，因此把 focus 纳入每次 sync 不会借用或污染 Environment selection。"
    caller_rule: "Delete/close/Undo/split/materialize/Environment switch 与 background source mutation 都只调用同一个 sync；调用方禁止记忆并补第二次 focus refresh。"
    forbidden_parallel_paths: ["inject_focused_live bool", "reduce_session_navigator_refresh(ctx, false)", "post-close membership-only refresh", "active-row fallback", "local/remote focus branch"]
    invariant: "每个已提交 SessionNavigatorModel 的 membership 与 is_active 必须属于同一物理布局时点；有 focused visible carrier 时不得提交零 active rows。"

  runtime_live_row_stable_liveness:
    id: "SN-RUNTIME-LIVE-ROW-STABLE-LIVENESS-64"
    existing_abstractions: ["TerminalModel.force_environment_runtime_session_type", "TerminalModel.environment_runtime_transport_session_id", "TerminalView::is_environment_runtime_transport", "Workspace::live_workspace_sessions"]
    liveness_rule: "runtime Environment tab 里某个 terminal pane 是否投影为 live Session Navigator 行，只由该 terminal 的稳定 runtime transport 身份（构造时固定的 force_environment_runtime_session_type / environment_runtime_transport_session_id）决定；禁止使用 active_session_uses_environment_runtime 等依赖当前 active block session 的易失判据。"
    rationale: "CLI agent 在子 shell 内运行会把 active block 切到非 runtime session，易失判据随之翻转 false，会把正在运行的远程 agent live 行降级成 virtual 历史行，连带丢失 is_active 高亮、活动点，并把 rename 误路由到远程 alias RPC。"
    parity_rule: "local 与 runtime 共用同一 live-row 语义；差异只允许在 backend delivery 时机。本地 tab 不进入 runtime 过滤分支，runtime tab 只用稳定 transport 身份区分真正的 runtime pane 与误放进来的 current-app terminal。"
    forbidden_parallel_paths: ["active-block runtime classification for liveness", "pending/force fallback as liveness signal", "history-row-only projection for a live runtime agent", "remote-only rename via alias RPC when a live container exists"]
    invariant: "只要 runtime terminal pane 存在，其 Session Navigator 行就是 live container：is_live_container=true、可投影 is_active、可显示 structured activity 点、rename 编辑 PaneConfiguration 容器标题；agent 是否占据 active block 不改变以上任何一项。"

  stable_inline_edit_identity:
    id: "SN-SESSION-NAVIGATOR-STABLE-INLINE-EDIT-IDENTITY-47"
    existing_abstractions: ["SessionNavigatorRowIdentity", "SessionNavigatorState.row_id_by_identity", "Workspace::workspace_session_row_id", "ParsedEnvironmentAuthority.navigation_key", "workspace_session_for_row_identity"]
    identity_rule: "inline alias edit 的跨帧 owner 必须保存 SessionNavigatorRowIdentity；WorkspaceSessionActionTarget 只允许用于打开编辑器当帧定位当前 snapshot"
    lifecycle_rule: "request rename 将当前 action locator 解析为 Environment navigation key + canonical RowId；source/placeholder/live carrier 更换后，render 与 finish/cancel/clear alias 继续解析同一 RowId"
    parity_rule: "local 同步 materialize 与 runtime 异步 materialize 共用同一 inline-edit identity；backend 不得拥有 rename overlay 或 fallback"
    failure_rule: "当前 RowId 已被确认删除时才允许结束编辑态；禁止 physical session.id mismatch 静默卸载 editor、丢弃输入或把 alias 写到另一行"
    forbidden_parallel_paths: ["renaming WorkspaceSessionActionTarget", "physical session id rename comparison", "remote-only rename adapter", "rename state cache overlay", "materialization-time editor reset"]

  live_container_title_ownership:
    id: "SN-LIVE-CONTAINER-TITLE-OWNERSHIP-60"
    existing_abstractions: ["PaneConfiguration.container_uuid", "PaneConfiguration.custom_vertical_tabs_title", "LeafSnapshot.custom_vertical_tabs_title", "Workspace::rename_pane", "WorkspaceSessionSnapshot::is_live_container", "EnvironmentBackend session user state"]
    product_rule: "Session Navigator 一行代表一个 pane container；live row 的 Rename 必须编辑该 PaneConfiguration 的容器标题，virtual restore target 的 Rename 才编辑 durable session alias。菜单、inline editor、toast 与 clear/reset 文案必须明确当前对象，不得把两者都称为 session alias。"
    title_rule: "PaneConfiguration.custom_vertical_tabs_title 是 live container 可见标题唯一 owner；PaneGroup.custom_title 只命名整个 Tab/pane group。WorkspaceSessionSnapshot::from_tabs 与 Navigator live_workspace_sessions 必须从每个 leaf 的容器标题读取 label，禁止把 Tab custom_title、OSC/shell prompt 或 environment.label 复制给 leaf。"
    resume_seed_rule: "Resume/materialize 必须把当前已可见的扫描标题（title_fallback_label，可含 virtual alias）种子化写入新 pane 的 custom_vertical_tabs_title；禁止只写 Tab custom_title。Resume 不负责加载 metadata，只转移已投影标题的 owner。"
    projection_rule: "authority-scoped alias enrichment 只作用于 virtual row；virtual source 被 live container consume 后，alias 不得覆盖 live container title。双方均为 Specific 时 live pane title 优先于 indexed/virtual；live Missing/Generic 时仍吸收 indexed Specific。关闭 live carrier 后，同一 durable virtual row可继续显示自己的 alias。"
    identity_rule: "live rename 从 action locator 解析当前 PaneViewLocator，但 editor 生命周期继续由 container UUID/canonical RowId 识别；布局坐标只路由当次 action，不进入标题持久化。virtual alias 继续使用 stable_user_state_keys。"
    persistence_rule: "打开 Rename editor 与 Escape 取消不得保存；Enter 或 Blur commit 只有在规范化标题确实变化后才触发一次 App State save。Pane title 随 LeafSnapshot/SQLite 冷恢复；virtual alias 继续由统一 EnvironmentBackend 在底层分发到 local sidecar 或 runtime RPC。"
    parity_rule: "local 与 runtime live container 完全共用 PaneConfiguration mutation 与 App State save；只有 virtual alias persistence 在 EnvironmentBackend 最低层区分同步 sidecar 与异步 RPC。"
    empty_rule: "trim 后空标题表示清除当前对象的 override：live row 清除 pane container title，virtual row 清除 durable alias；不得创建空字符串 owner。"
    forbidden_parallel_paths: ["live row authority alias mutation", "alias overrides live label", "tab custom_title copied to every leaf", "environment.label as live session.label", "save when rename editor opens", "backend-specific live rename", "physical locator persisted as title identity"]

  live_cli_agent_activity_projection:
    id: "SN-LIVE-CLI-AGENT-ACTIVITY-63"
    existing_abstractions: ["PaneConfiguration.container_uuid", "PaneGroup terminal carrier lookup", "CLIAgentSessionsModel structured status", "WorkspaceSessionSnapshot.is_live_container/is_active", "Workspace::handle_cli_agent_sessions_event", "vertical-tabs restored session icon"]
    owner_rule: "图标 badge 是一个穷尽的 render-only 状态投影，不持久化：restore lifecycle 归 reducer；Agent execution 归 CLIAgentSessionsModel；live/focused 归 committed WorkspaceSessionSnapshot。三类 owner 禁止互相推断。"
    identity_rule: "structured Agent execution 只允许 live WorkspaceSessionSnapshot.container_uuid → current PaneGroup terminal carrier → TerminalView EntityId lookup。tab/leaf locator、row id、native history id 不得作为 execution registry identity；live/focused fallback 只读取当前 committed row 自身。"
    state_rule: "优先级固定为 Restoring > Attention(Blocked) > Running(InProgress) > FocusedLive(is_live_container && is_active) > BackgroundLive(is_live_container) > HistoricalQuiet。Success、command-only 与无 structured status 不猜 Agent execution，但仍保留真实 live/focused 存在态。"
    rendering_rule: "Restoring 使用 spinner；Attention 使用黄色状态点；Running 使用蓝色状态点；FocusedLive 使用 accent 实心点；BackgroundLive 使用 muted 小点；HistoricalQuiet 无点。row background/border 继续表达选择焦点，badge 提供可扫视状态且不得把 live 冒充 running。"
    parity_rule: "local 和 Environment runtime 复用同一个 PaneConfiguration container identity、TerminalView、committed row 与 CLIAgentSessionsModel；只允许 structured event 和 carrier delivery timing 不同。"
    forbidden_parallel_paths: ["locator-based execution lookup", "history metadata execution inference", "PTY text or process-exit execution inference", "persisted activity status", "backend-specific status registry", "polling/cache overlay", "deleting live/focused state to avoid badge ambiguity"]

  environment_target_home_materialization:
    id: "SN-ENVIRONMENT-TARGET-HOME-MATERIALIZATION-48"
    existing_abstractions: ["EnvironmentBackend::refresh_indexed_sessions", "EnvironmentSessionRefreshIntent::PassiveProjection", "EnvironmentTable indexed-session cache", "environment runtime SessionId ownership", "resolve_environment_runtime_roots"]
    owner_rule: "root/HOME materialization transition 是 indexed-session scan 的唯一启动 owner；SessionConnected 不得在 HOME unresolved 时抢跑 scan"
    ordering_rule: "exact authority + SessionId 校验 → remember target HOME → commit workspace root → PassiveProjection backend refresh → scan result stale check → EnvironmentTable commit → reducer projection"
    projection_rule: "首次未解析 HOME、解析失败或 stale result 都不得把 canonical indexed collection替换为空；已有 rows 与无关 rows 保持 cardinality、RowId 和 order"
    parity_rule: "local/runtime 高层都使用 EnvironmentBackend refresh capability；仅 target HOME materialization timing 位于 backend/lifecycle 底层"
    failure_rule: "解析失败保持 HOME unresolved 并显式失败，禁止 filesystem root /、project root、本机 HOME 或 UI 参数作为 target HOME fallback"
    forbidden_parallel_paths: ["scan in connected handler", "filesystem root HOME fallback", "Navigator reopen scan", "remote-only UI refresh", "timer retry", "empty projection before HOME"]

  codex_native_fork_system_configuration:
    id: "SN-CODEX-NATIVE-FORK-SYSTEM-CONFIGURATION-29"
    existing_abstractions: ["SessionBridge native writer", "NativeSessionTargetContext", "Codex native transcript/index", "real Codex resume bootstrap"]
    ownership_rule: "Codex provider/model/reasoning/sandbox/approval 等运行配置归目标 Codex installation；SessionBridge 不得选择或硬编码运行配置，native bootstrap 必需字段只能从目标配置派生"
    configuration_rule: "Fork backend 必须读取目标 CODEX_HOME/config.toml 并执行目标 codex --version；rollout 仅写 bootstrap/discovery 必需的 config-derived model_provider 与 installation-derived cli_version，model/reasoning/sandbox/approval 继续由 Resume 时的目标 Codex 系统配置决定"
    launch_rule: "Fork/Resume 命令保持 codex resume <session-id>，禁止追加 provider/model/profile/effort 参数覆盖系统配置"
    format_rule: "SessionBridge 只写 rollout、session_index.jsonl 与 history.jsonl；禁止直接修改 Codex 私有 state_5.sqlite。model_provider 来源为 target-config-derived，其他写出字段必须归类为 protocol constant/source-derived/generated identity"
    parity_rule: "local/runtime 共用 NativeSessionTargetContext 与同一 plan builder；差异仅是本地文件读取或 runtime 文件读取，各自读取自己的目标 CODEX_HOME，禁止本机配置污染远端"
    verification_rule: "writer reader round-trip 不是可恢复性证据；必须由仓库内可执行的 ignored Rust test 调用真实 Codex bootstrap 加载派生会话，static checker 必须验证该测试函数真实存在，禁止只在 required_tests 文档中声明名字"
    forbidden_parallel_paths: ["hard-coded codex provider", "hard-coded model", "hard-coded reasoning effort", "empty/missing provider fallback", "fork UI runtime parameters", "local config reused for runtime", "direct state_5.sqlite mutation", "self-reader-only resume proof"]

  claude_native_fork_target_ownership:
    id: "SN-CLAUDE-NATIVE-FORK-TARGET-OWNERSHIP-30"
    existing_abstractions: ["SessionBridge native writer", "NativeSessionTargetContext", "Claude native transcript/history", "real Claude resume bootstrap"]
    ownership_rule: "Claude installation version、git branch、mode、permission mode 与 runtime model 不属于 SessionBridge；可省略字段必须省略，必填 synthetic transcript 字段只能使用外部协议标记"
    configuration_rule: "Claude native store root 从目标 CLAUDE_CONFIG_DIR 派生，未设置才回退目标 home/.claude；禁止 CLAUDE_HOME 私有别名、本机路径代填 runtime 或 writer 猜测配置"
    launch_rule: "Fork/Resume 命令保持 claude --resume <session-id>，不追加 model/permission/effort/profile 参数覆盖目标配置"
    parity_rule: "local/runtime 共用同一 plan builder 与 target context；唯一差异是读取各自目标 CLAUDE_CONFIG_DIR 的 transport timing"
    verification_rule: "逐字段 provenance + 真实 native sample + 真实 Claude bootstrap；writer/reader 自闭环不算外部兼容证明"
    forbidden_parallel_paths: ["CLAUDE_HOME private alias", "hard-coded Claude version", "hard-coded HEAD branch", "hard-coded default permission mode", "invented runtime model", "local config reused for runtime", "self-reader-only resume proof"]

  cli_agent_store_root_operation_context:
    id: "SN-CLI-AGENT-STORE-ROOT-OPERATION-CONTEXT-31"
    existing_abstractions: ["CliAgentStoreRoots", "EnvironmentRuntime command transport", "remote helper typed RPC", "SessionBridgeEnvironment", "ResolvedSessionBridgeEnvironment", "CLI-agent source allowlist"]
    ownership_rule: "CLI-agent store roots 属于目标 installation/session execution context；本地进程或远程 helper daemon 都不得替目标 CLI 猜测另一套 roots"
    operation_rule: "未解析 SessionBridgeEnvironment 不能执行 store operation；scan/read/mutate/native Fork 每次先得到携带完整 roots snapshot 的 ResolvedSessionBridgeEnvironment，再把同一 snapshot 传给 source resolution、allowlist、index lookup 与 writer plan；同 execution context 的 source/target pair 只解析一次"
    remote_rule: "Environment session 解析 target HOME/CLAUDE_CONFIG_DIR/CODEX_HOME 并通过 RPC 显式传给 helper；helper 缺少 roots 必须失败，不得 fallback 到 daemon process environment"
    parity_rule: "Local 与 Runtime 共用 CliAgentStoreRoots 语义和相同 source/index/allowlist contract；差异只允许是本地环境读取或 Environment command/RPC transport；Conversation/Ashide DB source 保持独立 current-app owner"
    forbidden_parallel_paths: ["home.join(.codex) outside CliAgentStoreRoots", "home.join(.claude) outside CliAgentStoreRoots", "daemon process env root inference", "writer-only Environment root resolver", "consumer re-probe after resolution", "unresolved environment store operation", "Conversation forced into CLI roots", "ignored session_id/home_root parameters"]
    verification_rule: "至少覆盖自定义 Codex/Claude roots 的 scan→read→delete 及 remote RPC round-trip；默认 ~/.codex、~/.claude 夹具不能证明配置根一致性"

  terminal_session_execution_context:
    id: "SN-TERMINAL-SESSION-EXECUTION-CONTEXT-53"
    existing_abstractions: ["BootstrappedValue", "SessionInfo", "SessionBootstrapped RPC", "ConnectionState executor registry", "LocalCommandExecutor", "EnvironmentRuntime command transport", "CliAgentStoreRoots"]
    owner_rule: "exact terminal SessionId 原子拥有自己的 target snapshot；Environment synthetic SessionId 只拥有 transport，直到第一个真实 terminal bootstrap 以 insert-if-absent 建立其 canonical execution context。alias binding、exact context 与首次 owner context 必须由 RemoteServerManager 一次提交，失败不得留下 alias-only 半状态；后续 terminal 只更新 exact context，不得覆盖 Environment owner"
    validity_rule: "完整 snapshot 必须包含非空 shell_path、cwd、HOME 与 PATH；CODEX_HOME/CLAUDE_CONFIG_DIR 可明确 unset；ASHIDE_SESSION_EXECUTION_CONTEXT=1 只能在上述字段验证成功后派生。manager 和 helper 都必须使用同一 validation contract 并独立 fail closed"
    transport_rule: "连接阶段禁止为 synthetic owner 注册空 context，且 transport Connected 不得启动依赖 RunCommand 的 heartbeat；shell bootstrap 在用户配置加载完成后捕获 snapshot，经 SessionInfo 与 SessionBootstrapped 原样传输；ModelEventDispatcher 必须在 Sessions::initialize_bootstrapped_session 选择 CommandExecutor 之前提交 manager-owned alias/context，使 executor 从同一已提交 execution carrier 派生，禁止先固化 NoOp 再事后补注册；同一个 execution-carrier readiness gate 在 owner context 建立后释放 heartbeat 与 root/store operations；manager reconnect 必须实际发送 transport owner 绑定下仍存活的 owner+全部 aliases；alias 注销必须向当前 helper 发送 executor teardown，owner 注销通过 connection teardown 清除全部 executor/in-flight state"
    execution_rule: "LocalCommandExecutor 在派生 command 前移除 daemon 对上述 authoritative names 的值，再设置 session snapshot，最后应用显式 per-command override；未提供 override 时 cwd 使用 session snapshot"
    parity_rule: "current-app 与 runtime 的 CLI-agent roots 都来自各自 execution context；高层 scan/read/mutate/Fork 共用 ResolvedSessionBridgeEnvironment，差异只在 context 捕获/命令 transport"
    forbidden_parallel_paths: ["synthetic owner empty context", "heartbeat scheduled directly from transport connected", "separate heartbeat readiness state", "session initialized before execution context commit", "post-init NoOp executor repair", "terminal context overwrites Environment owner", "alias registration before context validation", "SessionId-only executor selection", "daemon cwd inheritance", "daemon HOME/PATH/CODEX_HOME/CLAUDE_CONFIG_DIR inheritance", "bare shell-name fallback", "missing HOME to workspace fallback", "UI supplied target roots", "wrapper command sourcing rc files", "owner-only reconnect replay", "manager-only alias teardown"]
    verification_rule: "覆盖 control session 无 carrier跨过一个 heartbeat interval 仍不发 RunCommand/不重连、matching context 才释放 heartbeat+root resolution、stale/unrelated context 保持 inert、malformed helper notification、owner+terminal A+terminal B、B 后到不覆盖 owner、alias 注销即时删除当前 executor、owner teardown、wire reconnect 重放全部存活 contexts、missing HOME/shell_path、relative roots、operation override；并用真实 remote custom roots 完成 scan→read→mutate→Fork/Resume"

  remote_helper_protocol_revision:
    id: "SN-REMOTE-HELPER-PROTOCOL-REVISION-32"
    existing_abstractions: ["RemoteServerClient Initialize", "ServerModel handle_initialize", "remote_server_binary", "REMOTE_SERVER_PROTOCOL_REVISION"]
    handshake_rule: "Initialize request/response 都携带同一个 REMOTE_SERVER_PROTOCOL_REVISION；任一侧观察到缺失、旧版或未知 revision 都在 host/session 可见前失败"
    side_effect_rule: "helper 必须先校验 client revision 再更新 auth token；不兼容连接不能改变 daemon state 或进入 scan/read/mutate handler"
    delivery_rule: "source/dev 安装身份为 dev-pty-v<revision>；release 安装身份同时包含 tag 与 pty-v<revision>。同一 tag 下 protocol revision 变化时不得复用旧 helper；安装身份和 Initialize revision 是双重合同而非互相替代"
    parity_rule: "local 与 runtime 的高层 Session Navigator 不感知协议版本；差异只在 remote transport 握手，失败作为 Environment connection failure 显式呈现"
    forbidden_parallel_paths: ["response without revision accepted", "request without revision accepted", "version string used as protocol revision", "help grep as sole protocol proof", "auth mutation before revision validation", "dev-pty-v1 reuse", "release version-only helper path"]
    verification_rule: "覆盖 matching、missing/zero、wrong nonzero、auth-on-mismatch、source/dev slot 和 release version+protocol slot；只测新 client/new server round-trip 不足"

  remote_connection_handshake_ownership:
    id: "SN-REMOTE-CONNECTION-HANDSHAKE-OWNERSHIP-33"
    existing_abstractions: ["ServerModel connection registry", "ConnectionId", "Initialize protocol revision", "per-connection snapshot delivery"]
    owner_rule: "一个 ConnectionState 同时拥有 outbound sender、AwaitingInitialize/Ready phase 与 snapshot_sent_roots；禁止旁挂 initialized set 或独立 snapshot map"
    routing_rule: "ScanCliAgentSessions/ReadCliAgentSession/MutateCliAgentSession 以及其它业务消息只有 Ready connection 才能 dispatch；握手失败后继续发送也必须被 gate 拒绝"
    lifecycle_rule: "register 创建 AwaitingInitialize；成功 Initialize 变 Ready；失败不变；deregister 原子删除 sender/phase/snapshot state"
    parity_rule: "该 gate 位于 remote transport 最低层，高层 Navigator/SessionBridge 继续共用一套 action/state；本地路径不新增模拟握手分支"
    forbidden_parallel_paths: ["business dispatch before Initialize", "initialized HashSet beside sender map", "snapshot map beside connection lifecycle", "old client continues after rejected Initialize", "notification side effect before Ready"]
    verification_rule: "至少覆盖 pre-init business rejection、wrong-revision-then-business rejection、successful init dispatch eligibility、duplicate init 与 deregister cleanup"

  remote_connection_resource_ownership:
    id: "SN-REMOTE-CONNECTION-RESOURCE-OWNERSHIP-34"
    owner_rule: "executor 和 cancellable request map 都由 ConnectionState 直接持有；SessionId/RequestId 只在该 connection namespace 内定位资源"
    routing_rule: "RunCommand/Abort/resolve cleanup 先定位当前 ConnectionState；两个 connection 可同时使用相同 locator，互不覆盖、拒绝或删除"
    cleanup_rule: "deregister/drop ConnectionState 必须删除其 executors 并主动 abort 其全部 in-flight requests"
    forbidden_parallel_paths: ["daemon-global executor map keyed by SessionId", "daemon-global request map keyed by RequestId", "owner stored only in map value", "cross-connection Abort", "stale executor after disconnect"]

  remote_pty_connection_ownership:
    id: "SN-REMOTE-PTY-CONNECTION-OWNERSHIP-35"
    owner_rule: "RemotePty map 由 ConnectionState 直接持有；PTY id 只在 owner connection 内作为 locator"
    routing_rule: "WritePty/ResizePty/ClosePty 必须携带 dispatch conn_id 并只访问该 ConnectionState 的 PTY map"
    cleanup_rule: "关闭单个 PTY 与 deregister connection 都只影响 owner 资源；ConnectionState drop 终止全部 child"
    forbidden_parallel_paths: ["daemon-global PTY mutation by numeric id", "handler ignores conn_id", "foreign close", "foreign write", "foreign resize"]

  remote_buffer_mutation_serialization:
    id: "SN-REMOTE-BUFFER-MUTATION-SERIALIZATION-36"
    owner_rule: "ServerBufferTracker 为每个 FileId 原子持有 active Save/Resolve intent 与 FIFO queued intents；GlobalBufferModel event 只解释 active head"
    ordering_rule: "同一 buffer 一次只启动一个磁盘 mutation；完成或失败后才启动下一项，不同 buffer 可并行"
    carrier_rule: "active connection 消失不等于 operation 消失；active 保留到真实 event，queued disconnected intents 在启动前移除"
    verification_rule: "production buffer runtime 必须通过真实 FileModel/disk 证明 ResolveConflict→SaveBuffer 响应与落盘严格 FIFO。"
    forbidden_parallel_paths: ["take all pending requests by kind", "multiple same-file FileModel saves in flight", "FileSaved confirms queued requests", "disconnect releases active serialization slot", "UI retry/debounce hides ordering"]

  remote_file_transfer_connection_ownership:
    id: "SN-REMOTE-FILE-TRANSFER-CONNECTION-OWNERSHIP-37"
    owner_rule: "ConnectionState 直接持有 inode-pinned transfer map；opaque handle 只在当前 connection namespace 内有效"
    routing_rule: "ReadChunk/WriteChunk/Finish/Abort 不再接受 owner 参数做 value-level check，而是只接收已经选定的 owner map"
    cleanup_rule: "ConnectionState drop 释放 read descriptors，并通过 FileTransferState::Drop unlink 未完成 write staging"
    verification_rule: "production dispatch 必须通过 Initialize gate、wire envelope 与两条 ConnectionId 证明断开一条连接只清理其资源，另一条连接可继续读取并 Finish。"
    forbidden_parallel_paths: ["ServerModel global file_transfers", "FileTransferState conn_id field", "per-helper owner mismatch branch", "disconnect retain scan"]

  remote_file_transfer_snapshot_integrity:
    id: "SN-REMOTE-FILE-TRANSFER-SNAPSHOT-INTEGRITY-38"
    owner_rule: "ConnectionState-owned read transfer 在 Begin 固定 inode + total_size；server offset 是唯一 snapshot cursor，client cursor 必须与 bytes 长度精确一致"
    completion_rule: "eof 仅允许出现在 next_offset=total_size；source 提前截断、offset 跳跃或 listing size 与 pinned size 不一致不得 commit 部分结果"
    reuse_rule: "bounded reader、file browser download/upload 与 native writer 共用 environment_runtime transfer cursor contract，不维护调用方私有 monotonic-only checks"
    verification_rule: "production dispatch 必须在真实临时文件上证明 Begin 后 source 增长不越过 pinned total_size，提前截断只允许返回已有进度且下一次读取显式失败。"
    forbidden_parallel_paths: ["read==0 means successful eof before total_size", "read beyond begin total_size after source growth", "offset <= guard without exact delta", "unused begin total_size", "listing metadata as transfer truth"]

  root:
    type: "SessionNavigatorModel"
    fields:
      active_environment: "EnvironmentKey"
      environments: "HashMap<EnvironmentKey, EnvironmentNavigatorState>"
    invariant: "任何行状态必须且只能属于一个 canonical EnvironmentKey；authority alias 与 transport generation 不是 EnvironmentKey"

  app_wide_live_ownership:
    id: "SN-CROSS-WINDOW-LIVE-OWNER-01"
    identity: "WorkspaceSessionSnapshot.durable_identity_key；缺少 durable identity 的普通 terminal container 不参与跨窗口互斥"
    owner_scope: "同一 App 进程内所有 Workspace window"
    invariant: "同一 durable identity 同一时刻至多一个 live 或 pending-materialization owner；窗口不是 session ownership namespace"
    registry_home: "WorkspaceRegistry 只派生 owner locator，不另存可漂移的 session 状态；owner 来源只能是 live pane binding 或 pane-owned SessionRestore intent"
    activation_rule: "当前窗口无 owner 时先查询其他 Workspace；命中后聚焦 owner window/pane，禁止 reducer 进入 SpawnTerminal"
    race_rule: "UI action 串行提交；第一个 Activate 在返回前必须建立 live binding 或 pane-owned pending intent，使第二个窗口观察到 reservation"
    release_rule: "pane/window 关闭必须先把 durable terminal identity 转入 retiring lease 并主动 shutdown PTY；只有 TerminalModel 确认 exit 后 lease 才释放，下一窗口随后可 materialize"
    environment_scope: "durable identity 包含 canonical EnvironmentKey；相同 provider session id 位于不同 Environment 时不互相抢占"
    duplicate_rule: "若运行时观察到多个 owner，记录模型破坏并确定性聚焦既有最早 WindowId；禁止再创建第三个 owner"

  retiring_process_ownership:
    id: "SN-CROSS-WINDOW-RETIRING-OWNER-02"
    owner_home: "WorkspaceRegistry"
    identity_source: "关闭前的 live WorkspaceSessionSnapshot.durable_identity_key；禁止从 command 字符串、tab/leaf locator 或 terminal UUID 重拼"
    lifecycle: "Live/Pending → Retiring(PTY shutdown requested) → Released(TerminalModel handled_exit=true)"
    activation_rule: "durable identity 命中 Retiring 时 Activate fail-closed，不进入 reducer、不 SpawnTerminal；用户稍后重试或由上层重新触发"
    teardown_rule: "window、普通 tab、单 pane、hidden/undoable close 都必须对 durable CLI-agent terminal 调用统一 shutdown_pty 并建立 lease；ContentTransferred 不得建立 retiring lease 或杀死被转移 pane"
    no_timeout_rule: "禁止用固定延时猜测进程已退出；try_lock 暂时不可得时仍视为 Retiring"
    failure_rule: "shutdown 未完成时 lease 保持，宁可阻止恢复也不得让同一 provider session 出现两个可写进程"

  provider_session_identity:
    id: "SN-CODEX-CANONICAL-SESSION-ID-01"
    canonical_source: "Codex transcript 的 session_meta.payload.id/session_id，或 session index 的显式 id/session_id/sessionId"
    forbidden_sources: ["response_item.payload.id", "event_msg.payload.id", "function_call id", "message id"]
    parser_rule: "payload.id 只有在 type=session_meta 时可成为 provider session identity；后续 transcript item 不得覆盖 canonical identity"
    command_rule: "codex resume 只接受 canonical UUID，或从 rollout 文件名末尾提取出的 UUID；msg_/fc_/call_ 等对象 ID 与任意非 UUID 必须返回 None"
    shared_boundary: "local scan、remote helper scan、plugin/OSC event、SessionBridge reader、session index 与命令解析共用 canonical_codex_session_id；任何 Codex durable identity 在写入 model/IR/persistence 前必须先归一为 UUID；expected/transcript mismatch 必须报错"

  environment_partition:
    type: "EnvironmentNavigatorState"
    owns:
      rows: "HashMap<RowId, RowState>"
      order: "Vec<RowId> / 等价稳定 position map"
      selected_row: "Option<RowId>"
      restoring: "HashMap<RowId, RestoreAttempt>"
      deleting: "HashSet<RowId>"
      deleted: "HashSet<RowId> durable tombstone"
      identity_registry: "stable container/durable/logical identity → RowId（不含 tab/leaf locator）"
      next_row_id: "opaque RowId 单调分配器"
    isolation: "后台或前台事件只能修改事件所属环境分区"

  row_identity:
    row_id: "reducer 首次观察时单调分配的 opaque row:N；在 virtual/restoring/live 生命周期中不变，绝不等于或复用任何 identity"
    stable_container_identity: "所有 live pane 使用 PaneConfiguration.container_uuid（pane:<uuid>）；经 LeafSnapshot 与 pane_container_identities 跨 tab/pane 重排和冷启动持久化"
    physical_locator: "tab:X:leaf:Y 只用于当前布局 action 路由；禁止进入 identity registry、alias、pin、selection 或 display order"
    durable_identity: "agent/conversation binding；可增加，不直接拥有 position"
    key_ownership: "logical/durable/observed/user-state key 只能由 WorkspaceSessionSnapshot 生成；组件/reducer/Workspace/remote adapter 禁止重复拼 key"
    materialization: "只把 stable container/durable identity 绑定到既有 RowId，不创建新 position"
    conflict_reconcile: "若异步时序曾让同一 observed row 的 durable/container alias 指向不同 RowId，Refresh 必须选择 durable canonical RowId，并原子迁移 selection/lifecycle/order/全部 aliases，禁止留下孤儿 RowId"
    command_detection: "普通 live pane 后续识别出 agent binding 时仍保留原 RowId"
    deletion_reuse: "删除只 tombstone 旧 RowId；释放 volatile pane alias 后，未来复用相同 tab/leaf 坐标的新 session 必须分配新 RowId"

  metadata_enrichment:
    ownership: "alias/title/pin/cwd/provider metadata 是逻辑会话的投影输入，不是独立 row，也不拥有 display position"
    title_parser_parity: "local initial scan、local Refresh、remote scan 与 SessionBridge reader 必须复用同一份 Claude/Codex transcript metadata parser；标题顺序固定为 provider title → 首条真实用户消息 → agent display name，禁止各 authority/consumer 自行实现 fallback"
    loading: "外置 metadata 必须在初次 scan/Refresh 时按 durable session identity 与实体 source 聚合；Activate/Resume/materialize 不得作为加载前置条件"
    budgeting: "limit/pagination 按逻辑会话计算；同一会话的 rollout/index/user-state 等 backing source 不互相竞争配额"
    discovery_limit: "local initial scan、local Refresh、remote scan 共用 WORKSPACE_SESSION_NAVIGATOR_LOGICAL_LIMIT；禁止各调用点写独立魔法数字"
    physical_source_gate: "每个 provider store 扫描共用 WORKSPACE_SESSION_NAVIGATOR_PHYSICAL_SOURCE_LIMIT_PER_PROVIDER=1600；目录/JSONL/index 超限必须显式失败并保留当前 canonical rows，禁止按枚举顺序截断 partial result。仅 discovery 使用该 gate；SessionBridge 的用户显式全文读取不受此会话列表 discovery 配额限制。"
    isolation: "metadata 只能 enrich 同 EnvironmentKey + durable identity 的 row，不得跨环境串写"
    failure_boundary: "metadata/user-state 读取失败不得丢弃已成功扫描的实体 rows；保留该 Environment 已缓存 enrichment 并允许后续 Refresh 重试"
    binding_persistence: "cli_agent/command/origin/provider session id/source identities 必须由 PaneConfiguration live owner → LeafSnapshot snapshot owner → pane_container_identities.session_binding_json generic SQLite owner 落盘并在冷启动恢复；TerminalPaneSnapshot/terminal_panes 双写必须删除；Started/SessionUpdated 必须触发 app-state save，禁止把 Resume 当成 identity 恢复机制"
    user_state_key_hygiene: "local/remote alias/pin sidecar 只允许稳定 key；历史 tab:* 与 *::source:tab:* 必须在读取时清除并重写，禁止兼容债继续扩散"

  app_state_persistence:
    live_authority: "WindowSnapshot.tabs 是 live pane 唯一持久化权威；restored_workspace_sessions 只保存 virtual restore targets"
    tree_boundary: "PaneNodeSnapshot::into_persistable 是 pane 可恢复性的唯一结构边界；必须在写 SQLite 前递归裁剪不可恢复 leaf"
    transient_semantics: "read-only terminal transcript、provider editor/browser、runtime-only code pane 不可跨重启恢复，禁止降级成可写或空 pane"
    structural_normalization: "branch 裁剪后 0 child 删除整 branch，1 child 折叠为 child，多 child 保留；SQLite 禁止二次静默跳 leaf"
    container_identity: "PaneConfiguration.container_uuid 是所有 leaf pane 身份的运行时唯一归属，经 LeafSnapshot.container_uuid 写入 pane_container_identities；terminal UUID 只属于 terminal runtime"
    hard_cut: "旧 pane tree 不含 container UUID，migration 为每个现存 leaf 一次性分配随机 UUID；禁止从 tab index、leaf index、数据库自增 id 或 terminal runtime UUID 猜测迁移"

  write_ownership:
    position:
      allowed_events: ["Refresh.FirstObserved", "Reorder"]
      forbidden_events: ["Activate", "Resume", "Materialized", "Focus", "RefreshExisting", "EnvironmentSwitched"]
    selection:
      allowed_events: ["Activate", "Resume", "Materialized", "ExplicitSessionCreated", "DeleteSelectedFallback"]
      forbidden_events: ["PaneFocused", "TabActivated", "RefreshOrder", "BackgroundEnvironmentUpdated"]
    lifecycle:
      allowed_events: ["RestoreStarted", "RestoreFinished", "Delete", "DeleteRolledBack", "DeleteCommitted", "Refresh.Materialized"]
      forbidden_events: ["Reorder", "Pin", "EnvironmentSwitched"]
    active_environment:
      allowed_events: ["EnvironmentSwitched", "EnvironmentDisconnectedFallback"]

  action_write_ownership:
    state_slices:
      position: ["display_order", "next_display_order"]
      identity: ["row_id_by_identity", "next_row_id"]
      selection: ["selected_row_id"]
      lifecycle: ["restoring_row_ids", "deleting_row_ids", "deleted_row_ids"]
    actions:
      Delete: ["identity", "selection", "lifecycle"]
      Activate: ["identity", "selection", "lifecycle"]
      SelectionChanged: ["identity", "selection"]
      RestoreStarted: ["identity", "selection", "lifecycle"]
      RestoreFinished: ["selection", "lifecycle"]
      DeleteRolledBack: ["lifecycle"]
      DeleteCommitted: ["identity", "lifecycle"]
      Pin: []
      Refresh: ["position", "identity", "selection", "lifecycle"]
      TabActivated: []
      PaneFocused: []
      Reorder: ["position"]
    direct_write_boundary: "除 session_navigator_reducer.rs 与测试夹具外，生产代码禁止直接修改以上 state slices；adapter 只能发送 typed action"

  environment_switch:
    save: "保存来源环境自己的 selected row 与 last-active tab/pane"
    restore: "投影目标环境自己的 rows/order/selection 与 last-active tab/pane"
    forbidden: "不得 reconcile 其他环境顺序；不得用来源 focus 覆盖目标 selection"
    background_update: "非 active environment 的 refresh/materialize 只更新其分区，不抢焦点"

# ─────────────────────────────────────────────────────────
# 1. 容器模型 (Container Model)
# ─────────────────────────────────────────────────────────
container_model:
  live_container:
    description: "由真实 pane 支撑的会话 (from_tabs 产出, id=tab:X:leaf:Y)"
    identity: "所有 pane 使用 pane:{container_uuid} 稳定容器身份；id=tab:X:leaf:Y 仅负责当前 action 路由"
    missing_identity: "模型错误并立即失败；禁止 fallback 到 source:tab:*"
    is_live_container: true
    is_pinned_initial: false
    pin_inheritance: "不继承 durable pin key"

  virtual_container:
    description: "无真实 pane 支撑的会话 (restored / indexed / historical)"
    identity: "durable 身份 agent:{agent}:{session_id} 或 conversation:{id}"
    is_live_container: false
    is_pinned_initial: "由 snapshot 构建器通过 is_pinned_by(&pinned_set) 预赋值"
    pin_inheritance: "virtual row 保留自己的 pin 状态,直到被 live consume"

  consume_rule:
    description: "virtual row 的 binding 匹配 live container 时被 consume"
    pin_transfer: "被 consume 的 virtual row 强制 is_pinned=false"

# ─────────────────────────────────────────────────────────
# 2. 排序意图链 (Sort Intent Chain)
# ─────────────────────────────────────────────────────────
sort_intent_chain:
  - key: "is_pinned (降序)"
    intent: "pinned 行优先"
    applies_when: "always"

  - key: "same_window_group_order (降序)"
    intent: "同一 tab 的 split pane 相邻;用同 tab 所有 pane 的最大 display_order（越大越靠顶）"
    applies_when: "id 可解析为 tab:X:leaf:Y"

  - key: "same_window_split leaf index (升序)"
    intent: "同 tab 内按 leaf 序号排"
    applies_when: "同 tab 的 pane 之间"

  - key: "display_order (降序)"
    intent: "稳定序号，越大越靠顶/越新。一旦分配不因 updated_at 变化而重排"
    applies_when: "已 sync/reconcile 的行"
    fallback_when_empty: "order=0（未分配时排在非 pin 段末尾）"

  - key: "updated_at_unix_ms (降序, None 排最后)"
    intent: "最近更新排前面 —— 仅在 order 未分配时生效"
    applies_when: "两行 position 相同或尚未分配；正常已 reconcile 行不依赖它重排"

  - key: "original_position (升序)"
    intent: "merge 后的原始位置作为 tiebreaker"
    applies_when: "always"

  - key: "logical_key (升序)"
    intent: "确定性兜底 —— 用 logical_key 不用 volatile id"
    applies_when: "always"
    note: "v3 修正: v2 用 id 做 tie-breaker,但 id 在 materialize 时从 agent:... 变成 tab:...,导致 order 丢失"

# ─────────────────────────────────────────────────────────
# 3. display_order 分配策略 (Reconcile Strategy)
# ─────────────────────────────────────────────────────────
reconcile_strategy:
  description: "为新行分配稳定序号（越大越靠顶）"
  allocation_order: |
    候选按 pinned DESC → updated_at DESC → logical_key ASC（newest-first）排出;
    对需要新 order 的行从旧到新（oldest-first）依次 next++，使最新拿到最大号
  not_depends_on: "不依赖 merge 的输出顺序"
  existing_row: "已有 order 的行跳过"
  identity_lookup: "所有 observed identity 先经 registry 解析 RowId；只有 RowId 没有 position 才分配 next"
  tie_breaker: "pinned DESC → updated_at DESC (None 排最后) → logical_key ASC"
  new_row_position: "新增行拿到更大 order，排在非 pin 组顶端"
  note: "v3 修正: tie-breaker 从 id ASC 改为 logical_key ASC,因为 id 是 volatile"

# ─────────────────────────────────────────────────────────
# 4. display_order 键策略 (Key Strategy)
# ─────────────────────────────────────────────────────────
key_strategy:
  row_id:
    description: "display_order 只以稳定 RowId 为 key"
    lookup: "identity_registry[observed identity] → RowId → position"
  alias_registration:
    virtual_first: "durable identity 建立 RowId；materialize 后 container UUID identity 指向同一 RowId"
    live_first: "container UUID identity 建立 RowId；后续 agent detection 只新增 durable alias"
    restoring_conflict: "正在 restoring/selected 的 RowId 优先，确保 Resume 原位替换"
  forbidden:
    - "同一行同时保存 primary_order 与 durable_order"
    - "用 max/min 在读取阶段猜测哪个 order 正确"
    - "materialization 为 physical key 分配新 position"

# ─────────────────────────────────────────────────────────
# 5. merge_for_session_navigator 职责
# ─────────────────────────────────────────────────────────
merge_responsibility:
  does:
    - "合并去重:按 logical_key 合并同源行"
    - "consume:virtual row 的 binding 匹配 live container 时合并到 live row"
    - "pin 守卫:被 consume 的 virtual row 强制 is_pinned=false"
    - "pin 补齐:未被 consume 的 virtual row 执行 is_pinned_by 补齐"
  does_not:
    - "排序"
    - "分配 display_order"
    - "决定 active/focus"

# ─────────────────────────────────────────────────────────
# 6. Focus / Active / Selection 优先级链 (v3 新增)
# ─────────────────────────────────────────────────────────
#
# 三个概念:
#   - focus: 物理输入焦点 (pane group 的 focused_pane_id)
#   - active: Session Navigator 中高亮的行 (snapshot.is_active)
#   - selection: 当前 Environment 独立保存的恢复/选择标记 (state.selected_row_id)
#
# 这三者可能指向不同行。mutation 之后谁说了算,由下面的优先级链决定。

focus_active_selection:
  # 6.1 active 行的唯一决定规则 (按优先级从高到低)
  active_priority_chain:
    - rule: "live container focused pane"
      priority: 1
      description: "pane group 的 focused pane 对应的 live session → is_active=true"
      overrides: "一切虚拟标记"
      
    - rule: "restoring session"
      priority: 2
      description: "restoring_workspace_session_keys 中的 session → is_active=true"
      overrides: "当前 Environment 的 virtual/restored selection"

    - rule: "EnvironmentNavigatorState.selected_row_id"
      priority: 3
      description: "当前 Environment 的恢复/选择标记指向 virtual row → is_active=true"
      overridden_by: "规则 1 (live focus) 和规则 2 (restoring)"

    - rule: "其余"
      priority: 4
      description: "is_active=false"

  # 6.2 冲突解决
  conflict_resolution:
    live_vs_virtual: "live container focused pane 总是胜出 —— 物理焦点 > 虚拟标记"
    restoring_vs_restore_key: "restoring 中的 session 胜出 —— 正在恢复 > 已点击待恢复"
    multiple_active: "Refresh/reducer 保证至多一行 is_active; 测试辅助 normalize_session_navigator_active_state 仍可用于静态断言"

  # 6.3 mutation 后的 focus 决策
  focus_after_mutation:
    delete:
      - condition: "被删 session 在多 visible pane 的 tab 中"
        focus_target: "同 group 的 prev_pane (pane_history 优先,其次位置相邻)"
        close_action: "close_pane_permanently"
        rule: "不 preselect 到别的 tab;让 pane group 的 focus_next 自己处理"

      - condition: "被删 session 是 tab 的唯一 visible pane"
        focus_target: "同 environment 的邻居 tab (优先同 env,其次任意)"
        close_action: "close_tab"
        rule: "由 remove_tab 的 tab 选择逻辑处理 focus"

      - condition: "被删 session 是窗口的唯一 tab 的唯一 pane"
        focus_target: "无 (不关窗) 或新建空 tab"
        close_action: "close_pane (保留空 tab)"
        rule: "不关窗,留空 tab"

      - condition: "被删 session 是 virtual row (无 live pane)"
        focus_target: "不改 focus"
        close_action: "只删 provider source + 清 user state"
        rule: "virtual row 删除不影响物理焦点"

    activate_restore:
      - condition: "target 已 materialize (有 locator)"
        focus_target: "focus_pane(target locator)"
        side_effect: "set active_restored_key + clear restoring"

      - condition: "target 是 Ashide conversation"
        focus_target: "restore_or_navigate_to_conversation (新 tab)"
        side_effect: "set active_restored_key + clear restoring"

      - condition: "target 是 virtual row (需 spawn)"
        focus_target: "不抢 focus (用户可能已切走)"
        side_effect: "set restoring + set active_restored_key + spawn terminal"
        container_rule: "必须分配新的 session container；local 直接创建 terminal tab，remote 先创建同环境 placeholder 再精确 materialize。禁止替换当前 live pane"

    pin_unpin:
      - condition: "always"
        focus_target: "不改 focus / active / selection"
        rule: "pin 只改排序组,不碰焦点"

    split_pane_fork:
      - condition: "always"
        focus_target: "focus_pane(新创建的 pane)"
        rule: "新 split pane 获得焦点"

    tab_switch:
      - condition: "always"
        focus_target: "activate_tab → focus_active_tab (pane group 的 focused pane)"
        rule: "切 tab 时由 pane group 的 focus_state 决定焦点"

    pane_focus_projection:
      - condition: "PaneFocused / TabActivated"
        focus_target: "只计算本帧 snapshot.is_active"
        rule: "不得把 focused live logical key 写回 EnvironmentNavigatorState.selected_row_id"

  # 6.4 Materialization identity reconcile
  materialization_tracking:
    old_behavior: "找不到 stored session 就假设 materialized,返回 live active key"
    new_behavior: |
      Refresh.reconcile_identity:
        - 所有 observed physical/durable/logical identity 先查 identity registry
        - virtual 与 live 有任一 durable alias 相交 → 全部 alias 绑定既有 opaque RowId
        - alias 冲突时 durable identity 所属 RowId 为 canonical，并原子迁移 competing RowId 的 selection/lifecycle/order/aliases
        - selected_row_id 始终保存 RowId，不随 logical/physical identity 变化
        - 只有真正首次观察且无任何 alias 命中时才 allocate row:N + position
        - Refresh 不因瞬时 source 消失主动清除 in-flight selection；RestoreFinished 后再次确认无 source/live carrier 时原子清除 selection
    deletion_behavior: "session 被删时不做 active 转移猜测;走 focus_after_mutation.delete 的决策"
    rationale: "猜测是不可靠的 —— 被删和 materialize 都表现为'stored session 不在了',但需要不同处理"
    workspace_path: "sync 原子 apply reduce(Refresh) 的 canonical sessions + state；EnvironmentTable 不再保存 state-only 分区；已删除 preferred_active_* 双轨"

# ─────────────────────────────────────────────────────────
# 6.5 Environment 导航上下文 UX 矩阵
# ─────────────────────────────────────────────────────────
environment_navigation_context:
  identity:
    current_app: "authority=local 与 local:<root> 归一为同一个 navigation key: local"
    remote: "remote authority_key 本身就是 navigation key"
    parser_home: "app/src/environment_authority.rs::ParsedEnvironmentAuthority"
    comparison_rule: "环境导航、关闭后的同环境选择与 strip 去重一律比较 ParsedEnvironmentAuthority.navigation_key,不比较完整 EnvironmentSnapshot 或重新解析字符串"

  memory:
    owner: "Workspace 的 EnvironmentTable"
    key: "canonical environment navigation key"
    value: "上次激活 tab 的 pane_group EntityId"
    forbidden: "不得记录 tab index;reorder/insert/close 会让 index 失效"
    update_point: "所有 tab 激活与 active tab 环境归属变更的统一入口"
    stale_value: "remembered EntityId 已关闭或已移到其他环境时,回退到同环境第一个 tab,激活后立即重写记忆"

  navigator_state_partition:
    owner: "EnvironmentTable.session_navigator_model_by_navigation_key"
    key: "canonical environment navigation key"
    current_app_aliases: "local、local:<root> 共用同一分区"
    remote_reconnect: "同一 remote navigation key 的 transport 重连复用原分区"
    forbidden: "不得把 Session Navigator state 挂在单次 authority entry/connection generation 上"

  switch_matrix:
    - id: "ENV-SW-01"
      transition: "current-app/local → remote"
      expected: "记住 local 当前 tab,恢复 remote 上次激活 tab 及该 tab 内已有 focused pane"
    - id: "ENV-SW-02"
      transition: "remote → current-app/local"
      expected: "恢复 local 上次激活 tab,不固定选择该环境第一个 tab"
    - id: "ENV-SW-03"
      condition: "remembered tab 已关闭"
      expected: "确定性回退到同 navigation key 的第一个 tab并重写记忆;没有 tab 才创建环境 tab"
    - id: "ENV-SW-04"
      condition: "remembered tab 被 reorder"
      expected: "按 EntityId 恢复同一 tab,不受 index 变化影响"
    - id: "ENV-SW-05"
      condition: "用户切走后 remote connect/root-resolution 异步完成"
      expected: "只更新目标 authority 的 runtime/table/tab 状态,不得抢 focus、不得改 active authority、不得把 pending entry 投递到当前 local tab"
    - id: "ENV-SW-06"
      condition: "关闭 active tab"
      expected: "优先选择同 canonical navigation key 的邻居;root/label/lifecycle 元数据变化不应造成跨环境跳转"
    - id: "ENV-SW-07"
      condition: "disconnect 一个拥有多个 tab 的 remote environment"
      expected: "关闭该 authority 的全部 tab并清除导航记忆,不得留下 stale remote tab;若该环境原本 active,恢复 current-app/local 上次激活 tab"
    - id: "ENV-SW-08"
      condition: "在切换完成后新建 tab、agent 或 split"
      expected: "新内容继承当前 active environment;切回 local 后不得投递到 remote,切回 remote 后不得投递到 local"

  entrypoint_rule:
    applies_to:
      - "Environment Strip 点击"
      - "Environment provider open/switch"
      - "session restore environment activation"
      - "ensure/recreate environment tab"
    invariant: "所有入口必须调用同一个 preferred-tab 选择规则,不得各自 position() 选择第一个 tab"

  checks:
    authority_parser: "environment_authority_parser_covers_local_saved_ssh_and_custom_runtime"
    authority_snapshot_ref: "environment_snapshot_runtime_connection_ref_uses_shared_authority_parser"
    authority_static_guard: "script/check_local_remote_parity"
    canonical_identity: "environment_navigation_key_collapses_current_app_authority_aliases"
    stable_memory: "remembers_last_active_tab_by_navigation_key"
    round_trip_restore: "test_switching_between_environments_restores_each_last_active_tab"
    active_pane_restore: "test_switching_between_environments_preserves_each_active_pane"
    stale_and_reorder: "test_environment_last_active_tab_fallback_and_reorder"
    async_no_focus_steal: "test_environment_runtime_root_resolution_updates_non_active_environment_tab_without_stealing_focus"
    close_boundary: "test_closing_active_tab_prefers_same_navigation_environment"
    disconnect_cleanup: "test_disconnect_environment_closes_all_authority_tabs_and_restores_local"
    build_gate: "cargo check"

# ─────────────────────────────────────────────────────────
# 7. 纯 Reducer 契约 (v3 新增)
# ─────────────────────────────────────────────────────────
#
# 所有列表变化都走同一个纯 reducer。reducer 只描述可观察结果,
# 不描述内部实现机制 (如 focus-restorer)。
#
# 输入: (当前 sessions 快照, action)
# 输出: (new sessions, side_effect)

reducer_contract:
  input:
    sessions: "Vec<WorkspaceSessionSnapshot> — 当前排序后的 session 列表"
    state: "SessionNavigatorState — 包含 selected_row_id, restoring_row_ids, deleting_row_ids, display_order"
    action: "SessionNavigatorAction"
    pane_group_info: "PaneGroupInfo — 各 tab 的 visible pane 数、focused pane、pane_history"

  output:
    sessions: "Vec<WorkspaceSessionSnapshot> — 更新后的 session 列表"
    state: "SessionNavigatorState — 更新后的状态"
    side_effect: "Option<SideEffect> — 需要执行的外部操作 (focus_pane / close_pane / close_tab / spawn_terminal / write_user_state)"

  actions:
    Delete:
      input: "session_id: String"
      output: |
        1. 从 sessions 中移除被删 session
        2. 加入 deleting_row_ids
        3. 根据 focus_after_mutation.delete 决定 side_effect
        4. 如果被删 session 的 key == selected_row_id → 清除 selected_row_id

    Activate:
      input: "session_id: String"
      output: |
        1. 如果 target 已 materialize → side_effect = FocusPane
        2. 如果 target 是 virtual → 加入 restoring_row_ids, side_effect = SpawnTerminal
        3. 解析或分配 target RowId，并设置 selected_row_id = target RowId

    SelectionChanged:
      input: "session_logical_key: Option<String>"
      output: |
        1. 显式 Navigator 选择或显式新建会话 deliver 完成后，解析/分配对应 RowId
        2. 设置当前 Environment 的 selected_row_id；None 只用于 placeholder 阶段清除旧选择
        3. 普通 PaneFocused / TabActivated 禁止借用此 action 反写 selection

    Pin:
      input: "session_id: String, pinned: bool"
      output: |
        1. 不改 sessions 的 is_active / focus
        2. side_effect = WriteUserState
        3. 下一次 refresh 时 is_pinned 由 user_state 预赋值

    Reorder:
      input: "ordered_logical_keys: Vec<String> — Workspace 按拖动单元 flatten 后的 keys；[0]=列表顶"
      output: |
        1. 按 keys 重写 display_order（顶行最大号，底行最小号；配合降序 sort）
        2. 不改 selected_row_id / restoring_row_ids；active projection 继续解析同一 RowId
        3. side_effect = None
      invariants:
        - "同 tab 的 live split leaf 在结果中必须连续"
        - "同组 leaf 相对序 (leaf index) 不因 Reorder 改变"
        - "UI 拖动单元 = 同屏组 (tab 多 pane) 或单行; 落点只在单元边界"

    Refresh:
      input: "new_raw_sessions: Vec<WorkspaceSessionSnapshot>"
      output: |
        1. merge + reconcile + sort
        2. reconcile_identity (§6.4 durable + binding)
        3. 根据 active_priority_chain 重新计算 is_active
        4. 清除已 materialize 的 restoring_row_ids

    TabActivated:
      input: "无 payload；当前 pane 拓扑由 pane_info 单向提供"
      output: |
        1. 不修改持久 state；pane focus 由 PaneFocused projection 单独提供
        2. 保留当前 Environment 自己的 selection/lifecycle/position

    PaneFocused:
      input: "session_logical_key: Option<String>；只表达 active projection 所需 identity"
      output: |
        1. 对应 live session 的 is_active = true
        2. 其他 live session 的 is_active = false
        3. 不改 EnvironmentNavigatorState.selected_row_id / lifecycle / position

  side_effects:
    FocusPane: "PaneViewLocator — 调用 workspace.focus_pane"
    DeleteEffects: |
      一次 Delete action 的复合副作用 (仍算「一个 side_effect」):
        focus: Option<PaneViewLocator> — 先执行 (多 pane ClosePane 时可由 close_pane focus_next 代劳)
        close: ClosePane(locator) | CloseTab(tab_index) | None
    SpawnTerminal: "session: WorkspaceSessionSnapshot — 调用 activate_restored_workspace_session 的 spawn 路径"
    WriteUserState: "authority, keys, mutation — 调用 mutate_workspace_session_user_state"
    NoEffect: "无副作用 (pin/refresh 只改数据模型)"

  invariants:
    - "reducer 是纯函数: 相同输入 → 相同输出, 无隐藏状态"
    - "reducer 只认 stable id (logical_key), 不认 volatile id 或 index"
    - "sort/pin policy 和 focus restore 分开: sort 决定位置, focus 决定高亮"
    - "contract 只描述可观察结果, 不描述内部机制"
    - "一次 action 只产生一个 side_effect (Delete 用 DeleteEffects 复合携带 focus+close)"
    - "pin/unpin 不产生 focus 副作用"

# ─────────────────────────────────────────────────────────
# 8. 删除流程 (v3)
# ─────────────────────────────────────────────────────────
delete_semantics:
  unified_flow:
    step_1: "snapshot PaneGroupInfo + SessionNavigatorState"
    step_2: "reducer.Delete → DeleteEffects { focus, close }"
    step_3: "validate_transition (log on failure)"
    step_4: "apply DeleteEffects: Focus (若需要) → ClosePane/CloseTab"
    step_5: "adapter_hooks (见下)"
    step_6: "异步删 provider source"
    step_7: "finish: 只清 user state + sync, 不再 reselect"

  adapter_hooks:
    description: "纯 reducer 无法表达的 Workspace 兜底,在 apply 末尾执行"
    ensure_environment_tab: "删光某 env 的 live session 后 → ensure_environment_tab_for_authority"
    terminal_bootstrap: "切本地邻居 tab / 空窗口时 add_explicit_terminal_bootstrap_default_tab"
    refuse_last_pane: "唯一 tab 唯一 pane 且 CloseWindow 未启用 → 拒绝关闭并 toast"

  source_not_found: "视为成功 (Ok)"
  pinned_state_clear_failure: "只 log::warn, 不阻断"
  session_state_write_failure: "返回 Err 但不 panic"
  navigator_cache_cleanup: "从 deleting_workspace_session_keys 过滤"

  historical_v2:
    note: "已废弃,仅作考古。生产路径不再调用 preselect/reselect。"
    old_flow: |
      1. preselect_workspace_session_before_delete
      2. close_live_workspace_session_for_delete
      3. reselect_workspace_session_after_delete
    old_problems:
      - "preselect 可能跳到别的 tab, close_pane focus_next 无法留在同屏兄弟"
      - "preselect + reselect 重复选, 焦点跳两次"
      - "split pane 删除后焦点不留在同屏兄弟"

# ─────────────────────────────────────────────────────────
# 9. 边界条件全量覆盖 (v3 新增)
# ─────────────────────────────────────────────────────────
edge_cases:
  - id: "EC-01"
    name: "删除 split tab 中的一个 pane"
    expected: "focus 留在同 tab 的兄弟 pane, 不跳到别的 tab"
    reducer_rule: "delete → 多 pane → close_pane + FocusPane(prev_pane)"
    ship_status: covered

  - id: "EC-02"
    name: "删除唯一 pane 的 tab"
    expected: "focus 切到同 env 邻居 tab, 不重复选"
    reducer_rule: "delete → 唯一 pane → close_tab + FocusPane(邻居)"
    ship_status: covered

  - id: "EC-03"
    name: "删除窗口唯一 tab 的唯一 pane"
    expected: "不关窗 (adapter refuse 或留空/bootstrap tab)"
    reducer_rule: "delete → CloseTab, focus=None; adapter 可拒绝关窗"
    ship_status: covered

  - id: "EC-04"
    name: "当前聚焦项被删, 别的项还 selected"
    expected: "focus 给同 group 兄弟, 其他 selection 不变"
    reducer_rule: "delete → 多 pane → FocusPane(prev_pane)"
    ship_status: covered

  - id: "EC-05"
    name: "active session 被删 → 恢复 → pin"
    expected: "恢复后 active 跟随新 pane; pin 不改 focus"
    reducer_rule: "delete → Activate → Pin, 每步独立"
    ship_status: covered

  - id: "EC-06"
    name: "列表为空时插入新项"
    expected: "新项 is_active=false, order=0"
    reducer_rule: "Refresh → reconcile 分配 order"
    ship_status: covered

  - id: "EC-07"
    name: "多项同一时刻创建"
    expected: "updated_at 相同 → logical_key 升序兜底, 排序稳定"
    reducer_rule: "reconcile tie_breaker = logical_key ASC"
    ship_status: covered

  - id: "EC-08"
    name: "reorder 后 focus 跟随稳定 id"
    expected: "focus 不因 reorder 丢失, 跟随 logical_key; 同屏 split 邻接不被拆散"
    reducer_rule: "Reorder → 只改 display_order; selected_row_id 不变; same_window leaf 连续且相对序不变"
    ship_status: covered

  - id: "EC-09"
    name: "最后一项被删除时的 fallback focus"
    expected: "不关窗, 留空 tab"
    reducer_rule: "delete → 唯一 tab 唯一 pane → 不 FocusPane"
    ship_status: covered

  - id: "EC-10"
    name: "pin/unpin 后不改 selection 或 focus"
    expected: "pin 只改排序组, is_active / selected_row_id / focus 不变"
    reducer_rule: "Pin → NoEffect (focus)"
    ship_status: covered

  - id: "EC-11"
    name: "virtual row consume 时 RowId 连续"
    expected: "selected_row_id 保持原 opaque RowId；live identity 只新增 alias"
    reducer_rule: "Refresh → identity registry bind alias；禁止迁移 selection 或新建 position"
    ship_status: covered

  - id: "EC-12"
    name: "restoring 中用户切走"
    expected: "物理 highlight 跟随用户 focus；restoring lifecycle 与 Environment selection 保留"
    reducer_rule: "active_priority_chain: restoring > selected_row_id, live focus > restoring"
    ship_status: covered

  - id: "EC-13"
    name: "被删 session 的 active 不猜测转移"
    expected: "被删 session 是 active → 清除 selected_row_id, 走 focus 决策, 不猜 materialize"
    reducer_rule: "Delete: 清 selected RowId + lifecycle tombstone；identity reconcile 不猜测 active 转移"
    ship_status: covered

  - id: "EC-14"
    name: "跨 environment 删除"
    expected: "删除后 focus 留在被删 session 的 environment"
    reducer_rule: "delete → focus target 限同 env"
    ship_status: covered

  - id: "EC-15"
    name: "split pane fork 后焦点"
    expected: "新 pane 获得焦点"
    reducer_rule: "split_pane_fork → FocusPane(new_pane)"
    ship_status: covered

  - id: "EC-16"
    name: "tab 关闭后 focus"
    expected: "优先同 env 邻居 tab"
    reducer_rule: "delete → 唯一 pane → close_tab → 同 env 邻居"
    ship_status: covered

  - id: "EC-17"
    name: "同屏 split 组拖拽重排"
    expected: |
      拖组内任意行 = 整组平移; 落点不能插入同组 leaf 之间;
      展示不全仍以 tab:X 组为单位; selected_row_id 不变; 组内 leaf 相对序不变
    reducer_rule: "Workspace build_reorder_units → flatten → Reorder; validate same_window adjacency"
    ship_status: covered

  - id: "EC-18"
    name: "远程环境切换到历史会话"
    expected: "新会话在独立 container 中 materialize；原 live tab/pane 保留且可再次切回"
    reducer_rule: "Activate virtual → SpawnTerminal；runtime adapter 只能替换本次新建的 placeholder，禁止替换当前 live pane"
    ship_status: covered

  - id: "EC-19"
    name: "两个窗口激活同一 durable CLI/AI session"
    expected: "第二个窗口聚焦第一个窗口的 live/materializing pane，不新建 tab、不再次执行 resume"
    reducer_rule: "WorkspaceRegistry ownership guard 在 Activate(false) 进入 reducer 前拦截；命中 owner 时只产生跨窗口 FocusPane 导航"
    ship_status: covered

  - id: "EC-20"
    name: "Codex transcript 后续 response_item 带 msg_/fc_ 对象 ID"
    expected: "Session Navigator 始终保留 session_meta 的 canonical UUID；Resume 禁止生成 msg_/fc_ 命令"
    reducer_rule: "共享 parser 不从非 session_meta payload.id 读取 identity；local/remote/index/SessionBridge/CLI adapter 全部通过同一个 canonical UUID guard"
    ship_status: covered

  - id: "EC-21"
    name: "关闭 owner window 后立即从另一窗口恢复同一 durable CLI session"
    expected: "关闭路径先 shutdown 原 PTY 并保留 Retiring lease；旧 TerminalModel 未确认 exit 前不得启动第二个 resume，exit 后才允许 materialize"
    reducer_rule: "WorkspaceRegistry retiring ownership guard 在 Activate(false) 进入 reducer 前 fail-closed；lease 释放只读取 TerminalModel exit truth"
    ship_status: covered

# ─────────────────────────────────────────────────────────
# 9.5 可执行 UX 契约矩阵 (新增事件必须补一行并绑定测试)
# ─────────────────────────────────────────────────────────
ux_contract_matrix:
  required_fields: ["id", "scope", "event", "may_change", "must_preserve", "test"]
  rows:
    - id: "SN-CROSS-REMOTE-RESTORE-CONTAINER-01"
      scope: "cross_environment"
      event: "Activate remote historical session → allocate placeholder → async materialize"
      may_change: ["selection", "lifecycle", "active_tab", "physical_binding"]
      must_preserve: ["all_existing_live_containers", "container_count_monotonic_until_explicit_close", "intent_target_pane", "target_authority"]
      test: "test_environment_runtime_restored_first_class_cli_agents_queue_remote_startup_commands"
    - id: "SN-ENV-PLACEHOLDER-RESTORE-TRANSACTION-01"
      scope: "remote_environment"
      event: "Allocate restore placeholder while the previously Connected runtime client is unavailable"
      may_change: ["active_tab", "placeholder_container", "runtime_lifecycle"]
      must_preserve: ["pane_owned_restore_intent", "startup_command", "logical_selection", "retryability", "existing_live_containers"]
      test: "test_environment_runtime_placeholder_allocation_binds_restore_before_reconnect"
    - id: "SN-ENV-SEMANTIC-CONTAINER-DELIVERY-02"
      scope: "local_remote_parity"
      event: "Activate restore target → allocate semantic container → placeholder/terminal delivery → PTY bootstrap commit"
      may_change: ["delivery_phase", "terminal_readiness", "runtime_attachment"]
      must_preserve: ["logical_row_count", "canonical_row_id", "display_order", "selection", "container_uuid", "durable_identity", "provider_metadata", "single_snapshot_projection"]
      test: "test_environment_runtime_resume_never_projects_transient_generic_terminal_row"
    - id: "SN-ENV-RESUME-CARRIER-BIRTH-04"
