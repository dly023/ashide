  production_refresh: "single reduce(Refresh) path; identity reconcile owns §6.4; no preferred_active_* dual-path"
  production_reorder: "group-aware UI (split tab = one drag unit) → flatten → reduce(Reorder); selected_row_id + same_window adjacency preserved"
  workspace_integration:
    - "EC-01 test_deleting_split_pane_session_keeps_focus_on_sibling_in_same_tab"
    - "EC-02/16 test_deleting_local_tab_session_focuses_same_env_neighbor_tab"
    - "EC-03/09 test_deleting_only_live_local_session_does_not_close_window"
    - "EC-08/17 test_reorder_session_navigator_sessions_keeps_selected_row_id + split group reorder"
    - "EC-10 test_pin_workspace_session_does_not_change_focus"
    - "EC-14 env delete suite (test_deleting_*_environment_*)"
    - "ENV-SW-01/02 test_switching_between_environments_restores_each_last_active_tab"
    - "ENV-SW-PANE-01 test_switching_between_environments_preserves_each_active_pane"
    - "ENV-SW-03/04 test_environment_last_active_tab_fallback_and_reorder"
    - "ENV-SW-05 test_environment_runtime_root_resolution_updates_non_active_environment_tab_without_stealing_focus"
    - "ENV-SW-06 test_closing_active_tab_prefers_same_navigation_environment"
    - "ENV-SW-07 test_disconnect_environment_closes_all_authority_tabs_and_restores_local"
    - "SN-INTRA-READONLY-PERSIST-01 persistable pane tree 在 SQLite 前裁剪只读/transient leaf 并折叠 branch"
    - "SN-INTRA-CONTAINER-PERSIST-01 所有 leaf pane 的 container UUID 独立于 terminal runtime UUID 跨冷启动保持"
    - "SN-ENV-PLACEHOLDER-IDENTITY-01 runtime placeholder 跨 Environment 往返不退回布局坐标身份"
