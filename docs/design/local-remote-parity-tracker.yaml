version: 1
updated_at: '2026-07-23'
purpose: Ashide 本地/远程能力一致性与共享抽象追踪。发现分叉立即追加；开始修改改为 in_progress；只有静态检查、相关测试以及适用的 GUI/真实
  runtime 验证完成后才改为 verified。
status_values:
- open
- in_progress
- fixed
- verified
status_semantics:
  fixed: SPEC、UX matrix、静态护栏、focused test 与 Rust 编译门禁已完成。
  verified: fixed 之外，适用的 GUI/真实 runtime 证据也已完成；不适用时必须显式记录 not_applicable。
rules:
  single_source_of_truth: 本文件是本地/远程 parity 扫描的唯一动态 tracking list。
  append_on_discovery: true
  mark_before_implementation: true
  change_protocol:
  - SPEC
  - UX_MATRIX
  - STATIC_CHECK
  - FOCUSED_TEST
  - CARGO_CHECK
  - GUI_OR_RUNTIME_VERIFY
  no_code_before_contract: 行为或架构变更必须先更新 spec/matrix/check；若发现顺序违反，立即停止实现并补齐门禁。
  external_agent_transport_selection:
    default: 优先使用目标 Agent 官方原生协议或稳定 SDK，直接连接其 canonical runtime owner；不得仅为统一接口而默认增加 ACP、sidecar、PTY parser 或私有存储 adapter。
    acp_exception: 只有当 ACP 提供原生协议无法提供且产品确实需要的能力、安全边界、跨厂商互操作或显著降低维护成本，并有协议覆盖、版本协商、local/remote parity 与失败恢复证据时，才允许选择 ACP。
    required_evidence:
    - 原生协议/SDK 的能力与缺口 inventory
    - ACP 相对原生协议的不可替代优势
    - 新增进程、协议翻译、版本面与 reconnect/error mapping 成本
    - canonical session owner 未被复制或旁路
    - discovery、resume、subscribe、cancel、stdin、failure 与 upgrade 的逐能力对比
    prohibited:
    - 为多个 Agent 表面统一而牺牲原生完整能力
    - 同时维护原生协议与 ACP 两套等价生产路径
    - 用 ACP 弥补可在原生公共协议中正确补齐的契约缺口
  verified_requires:
  - static_check
  - focused_test
  - cargo_check_when_rust_changed
  - gui_or_runtime_verification_when_user_visible
  forbidden_resolution:
  - 在行为层追加 if local / else remote 条件补丁
  - 复制 parser、identity key、状态机或 fallback 链
  - 用本地测试通过代替远程语义验证
  - 在 Navigator snapshot/render 中读取 remote pending state 后补 semantic binding
  - 用 debounce、延迟 Refresh、排序冻结或动画遮挡 materialization lifecycle
  verified_requires_architecture_evidence:
  - reused_abstractions
  - removed_parallel_paths
scan_scope:
- environment authority classification
- runtime/session ownership and lifecycle
- Session Navigator identity, metadata and title projection
- terminal/bootstrap delivery
- Project Explorer and File Browser filesystem semantics
- remote helper protocol and release contract
