- id: LR-144
  status: verified
  category: terminal_session_execution_context_ownership
  discovered_at: '2026-07-19'
  summary: LR-120/LR-122 runtime 证据审查发现 SessionId 只选择 helper executor；SessionBootstrapped 未携带 target terminal cwd/env，LocalCommandExecutor 因此继承 daemon HOME/PATH/CODEX_HOME/CLAUDE_CONFIG_DIR，custom roots 与 codex --version 仍可观察错误 installation。
  root_cause: terminal bootstrap 已观察 cwd/env，但 synthetic Environment transport owner 与 exact terminal execution owner 被混成同一个可覆盖 registry key；连接阶段曾注册空 context，随后每个 terminal 又覆盖 owner，reconnect 只重放 exact owner key，且 missing HOME 仍被改写为 workspace root。首轮修复只让 root resolution 等待 execution carrier，真实 runtime 进一步证明 command heartbeat 仍从 transport Connected 旁路启动；继续沿日志反查又发现 ModelEventDispatcher 先调用 Sessions::initialize_bootstrapped_session 固化 NoOpCommandExecutor，之后才注册 alias/context，导致即使 context 随后 ready，该 terminal executor 也永久错误。
