- id: LR-179
  status: verified
  category: jcode_omp_readonly_discovery_and_native_resume
  discovered_at: '2026-07-23'
  summary: Jcode 与 Omp 已交付可配置的只读原生 metadata discovery、Session Navigator virtual row、cold restore 与精确原生 Resume；desktop settings 是 local/runtime plan、Navigator 历史和 New Session 入口的唯一 selection authority，discovery 与 Resume 不互相依赖。当前产品范围只包含 discovery 与 native Resume；realtime attach/input/cancel、Fork/Edit/Write-back 均保持 capability=false，且没有 Ashide 产品入口。2026-07-26 已在 Jcode provider reader 底层镜像原生 picker 的默认可见性：`is_debug=true` self-dev/swarm worker 与空 session 不再被投影，官方 Jcode 图标也已进入 Agent 入口。
  root_cause: 旧契约把「非交互公开 CLI session list」误当作唯一可靠 discovery boundary，因而把 Jcode 排除在 shared discovery；同时它把 discovery、未来 realtime input control 和历史 mutation 混为一个 lifecycle。正确边界是：只读、校验严格的原生 metadata reader 可提供 virtual-row discovery；native resume 只需要 stable native session id；当前产品不提供 realtime 或写操作。
  target_invariant: CLIAgent::Jcode 与 CLIAgent::Omp 都是 AgentSessionDiscoveryPlan provider，能力为 detect/live binding/index/list/cold restore/resume=true。Jcode 仅读 ~/.jcode/sessions/session_*.json 的 root id/title/short_name/working_dir/updated_at/is_debug 和 `messages` 数组结构，且 id 必须与 filename 相同；reader 在底层排除 `is_debug=true` 与缺失/空 messages 的 session，并在筛选后再消耗 recency limit；`parent_id` 不参与过滤。Omp 仅读 ~/.omp/agent/sessions/*/*.jsonl 的 metadata prefix，且 header id 必须与 <timestamp>_<id>.jsonl suffix 相同。reader 不读取正文来构建 transcript、不修改文件、不属于 SessionBridge。`agents.third_party.history_enabled_agents` 是唯一 selection authority：默认所有可 index 且可 resume provider；unknown/重复项被过滤；禁用 provider 不读取其 store、不会出现在 Navigator 或 New Session，手工命令 detection 与直接 Resume 不受影响。target HOME 决定所有 store roots；desktop 显式将 enabled_agents 传入 runtime RPC，local/runtime 共享 plan、identity、排序和 failure semantics。缺少 provider store 是成功空集合；失败/cancel/stale completion 保留 canonical committed collection；永久删除只删除该 provider row。设置变更刷新所有 authority，disabled row 在重绘前从 canonical collection 移除。`jcode --resume <id>` 和 `omp --resume <id>` 可在完全不扫描 store 时执行。realtime attach/input/cancel、Fork/Edit/Write-back 与原生 history 写入均不属于当前产品能力，必须保持关闭且无入口。
  spec_path: docs/LOCAL_REMOTE_PARITY_SPEC.yaml
  spec_matrix_id: JCODE-PHASED-CONTROL-PLANE-83
  capability_matrix:
  - 'Jcode/Omp Agent discovery and native resume'
  static_check: script/check_local_remote_parity
  reused_abstractions:
  - unified layered Agent capability registry from LR-171
  - shared AgentSessionDiscoveryPlan and CliAgentStoreRoots
  - WorkspaceSessionSnapshot virtual-row projection and durable external identity
  - generic native resume command delivery and pane-owned live Agent binding
  removed_parallel_paths:
  - jcode_machine_json_list_as_discovery_prerequisite
  - jcode_and_omp_discovery_exclusion_from_shared_plan
  - discovery_as_resume_precondition
  - session_bridge_or_history_mutation_for_discovery
  - PTY_or_TUI_text_session_list_parser
  - speculative_Jcode_realtime_control_plane
  - premature_Jcode_omp_fork_edit_writeback_capabilities
  shared_paths:
  - app/src/cli_agent_jsonl.rs
  - app/src/terminal/cli_agent.rs
  - app/src/terminal/cli_agent_session_index.rs
  - app/src/remote_server/cli_agent_sessions.rs
  lifecycle_carriers:
  - state: readonly_metadata_discovery
    canonical_owner: AgentSessionDiscoveryPlan plus its typed AgentSessionDiscoveryProvider readers
    identity: provider-native session id plus physical source path; Navigator projection has no layout container identity
    visible_carrier: canonical committed AgentSessionDiscoveryRecord collection and derived virtual Session Navigator rows
    carrier_missing_semantics: a missing Jcode/Omp store is a successful empty provider result and leaves unrelated committed provider rows available
    cleanup: filename/id mismatch or malformed metadata never commits; permanent provider-store deletion removes only that provider rows; failure/cancel/stale completion preserves committed collection
  - state: native_resume
    canonical_owner: generic pending resume action plus pane-owned live Agent binding
    identity: exact nonblank Jcode or Omp native session id
    visible_carrier: local or runtime resumed terminal and its pane binding after the native CLI reports it
    carrier_missing_semantics: Resume remains available with an explicit id even when discovery is disabled, missing, stale, or never run
    cleanup: blank identity emits no command; Resume emits only the quoted native CLI argv and does not read or modify a session store
  required_tests:
  - jcode_is_a_first_class_detectable_cli_agent
  - jcode_uses_its_official_icon_in_all_agent_entrypoints
  - jcode_explicit_resume_command_uses_public_cli_contract
  - jcode_discovery_and_resume_do_not_require_a_daemon_handshake
  - jcode_readonly_discovery_capabilities_are_separate_from_advanced_session_actions
  - omp_readonly_discovery_has_an_independent_explicit_resume_adapter
  - jcode_fork_edit_and_writeback_remain_disabled
  - jcode_discovery_reads_authoritative_session_json_and_uses_updated_at
  - jcode_discovery_rejects_filename_id_mismatch
  - jcode_discovery_filters_debug_and_empty_sessions_before_recency_limit
  - omp_discovery_reads_one_project_level_and_prefers_title_slot
  - omp_discovery_orders_by_mtime_and_rejects_filename_id_mismatch
  - explicit_target_roots_keep_jcode_and_omp_under_target_home
  - jcode_and_omp_are_file_backed_session_index_providers
  - discovery_plan_uses_only_enabled_unique_file_backed_agents
  - local_jcode_and_omp_cold_scan_project_stable_rows_without_layout_identity
  - test_cli_agent_history_enabled_agents_default_to_all_discoverable_native_resumers
  - test_cli_agent_history_enabled_agents_ignore_stale_names_and_deduplicate_selection
  - test_unified_new_session_menu_projects_history_discovery_selection
  - test_remote_scan_respects_explicit_enabled_agents
  verification:
    discovery_resume: 'verified 2026-07-26：Jcode v0.58.0（5e064af4）的原生 picker 默认隐藏 `is_debug=true` self-dev/swarm worker；Ashide 的 Jcode provider reader 现在在底层跳过 debug 与缺失/空 messages session，并在筛选后才消耗 recency limit；非 debug parent session 仍保留。本机只读 metadata census 为 166 个 filename/id 合法 candidate，其中 78 个 debug、2 个空 messages 被过滤，86 个会投影。`jcode --resume <id>` 与 `omp --resume <id>` 均继续使用精确 native session id。'
    boundary: 'verified 2026-07-24：Discovery 不读取或写入 conversation history，不是 SessionBridge，不依赖 daemon handshake；Resume 不触发扫描。未知/缺失 provider store 被解释为成功空集合，而不是全局 discovery failure。'
    scope_boundary: 'verified 2026-07-24：当前产品只支持 discovery + native Resume。Jcode/Omp realtime attach/input/cancel、Fork/Edit/Write-back 与 native history write 均保持 capability=false、没有菜单或 SessionBridge 入口；不引入 ACP、Jcode private app-core、daemon façade 或 internal wire compatibility。'
    static_check: 'verified 2026-07-26：`bash -n script/check_local_remote_parity` 与完整 checker 通过；LR-179 guard 现在锁定 Jcode provider reader 的 default visibility helper、debug/messages 结构判定、parent_id 非过滤语义、新 focused test 与唯一 store reader。'
    focused_tests: 'verified 2026-07-26：`MACOSX_DEPLOYMENT_TARGET=10.14 cargo test -p warp --lib --features gui,local_fs jcode_ -- --nocapture` 通过 12 项，包括新增 debug/empty filtering before recency limit、non-debug parent session discovery、filename/id mismatch、官方图标映射、cold-scan Navigator projection 与 native Resume independent from daemon。'
    cargo_check: 'verified 2026-07-26：`MACOSX_DEPLOYMENT_TARGET=10.14 cargo check -p warp` 通过；仅有仓库既有 dead-code/unused warnings。'
    gui_or_runtime: 'verified 2026-07-26：`TERM=xterm-256color ./script/run` 从当前 checkout 重建、签名并启动 target/debug/bundle/osx/AshideDev.app（PID 26696）；未启动或触碰 /Applications/Ashide.app。二进制 embedded asset index 已包含 `bundled/svg/jcode.svg`，Quick Look 成功将该 SVG 生成 128×128 PNG thumbnail，证明 data-URI 官方图标可被实际 macOS SVG 栈解析。Session Navigator 选中 Jcode virtual row 后的既有运行日志仍记录 native `jcode --resume <native-session-id>` delivery。系统拒绝 display capture，故不伪称已观察到窗口内像素或点击行为。'

