  - id: SESSION-CONTAINER-ALLOCATION-DELIVERY-PARITY
    source: LR-109,LR-146,LR-147,LR-148
    reproduction: "Remote-only Resume replaces its placeholder with a terminal before PTY bootstrap and CLIAgentSessionsModel registration; the intermediate terminal is projected as a generic live container at the top of Session Navigator, then disappears when provider binding arrives and consumes the virtual row. A second runtime reproduction opened a provider without startup_command, allocated a placeholder with intent=None, and therefore never created the first terminal/execution carrier after Connected. A clean rebuilt cold start restored that placeholder but startup called only ensure_current_environment_runtime_transport_if_needed, so the non-persisted pending queue was never reconstructed; red b1bbf9eb further proved the runtime restore branch reallocated its persisted container UUID. Global callsite scan then found agent/startup/fork split paths ensuring transport before allocating and queuing their loading-pane owner."
    required_tests:
      - test_environment_runtime_resume_never_projects_transient_generic_terminal_row
      - test_environment_entry_intents_share_container_allocation_delivery_contract
      - test_open_environment_runtime_provider_without_startup_queues_plain_terminal_intent
      - test_cold_restored_active_environment_placeholder_rebuilds_terminal_intent_before_transport
      - test_restored_error_window_snapshot_does_not_implicitly_connect
      - test_runtime_materialization_call_sites_establish_owner_before_transport
      - test_add_plain_terminal_pane_on_connecting_runtime_stages_loading_pane_and_queues
      - local_remote_parity_static_session_container_delivery_guard
      - full_workspace_nextest
    focused_evidence: "LR-109 evidence remains valid for Resume carrier identity. LR-146 red e5157f4c proved a newly allocated provider placeholder had no PlainTerminal owner; green 7047576b passed 1/1 and combined 32de3dcc passed 8/8. Real remote-fixture-secondary Provider picker opening a new container logged pane-owned PlainTerminal intent before transport, then runtime terminal creation, EnvironmentRuntimeCommandExecutor selection and commit without NoOp/No executor/SessionNotFound/reconnect; 160 captured frames had no empty or decreasing remote projection. LR-147 red b1bbf9eb proved cold restore replaced the persisted container before the missing-pending assertion. LR-148 red c9eade65 proved the direct ensure inventory still contained bypasses; implementation preserves the pane tree, enumerates every runtime placeholder, and stages generic/agent/startup/fork typed owners before transport. Full-tree owner inventory and alias/new-wrapper probes fail closed. The rebuilt remote-fixture-secondary composition test queued the provider placeholder owner, dispatched SplitPaneDown 25ms later, queued a second owner before one transport, and committed two Environment runtime terminals. Cold restart PID 84341→92009 reconstructed two placeholder owners before a single transport ensure and visibly restored both panes with two runtime executors/commits and no NoOp, No executor or SessionNotFound. Full workspace nextest remains the shared release gate."
    result: passed_focused_static_cargo_check_rebuilt_split_plural_cold_restore_and_full_workspace_6326_of_6326

